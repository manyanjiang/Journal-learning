volatile evolution of distiller’s grains (DG), a protein-rich agro-industrial residue. DG pyrolysis exhibited distinct multistage degradation …","abstractTruncated":true,"tier":"must_read","tierLabel":"必读","reportDate":"2026-10-21","tkey":"other","id":326,"titleZh":"","abstractZh":""},{"title":"Towards sustainable catalyst production: A prospective life cycle assessment of resource-efficient Ni-CeO2 scale-up across current and future electricity mixes","url":"https://doi.org/10.1016/j.rser.2026.117543","doi":"10.1016/j.rser.2026.117543","journal":"Renewable and Sustainable Energy Reviews","jabbr":"Renewable and Sustainable Energy Reviews","pubdate":"2026-10-20","topic":"能源转型与低碳技术","topics":["能源转型与低碳技术","生命周期与技术经济评价"],"matchTerm":"net zero","matchWhere":"摘要：net zero、标题：life cycle assessment","score":12,"authors":["Anastasia Pappa","Mathias Barreau","Cuong Pham‐Huu","Spiros Papaefthimiou","Spyridon Zafeiratos"],"authorMore":false,"abstract":"Scaling up catalytic synthesis from laboratory to industrial scale strongly influences its environmental profile, presenting new opportunities to integrate circular practices into catalyst manufacturing. In this study, a prospective Life Cycle Assessment (LCA) is carried out to measure the environmental implications associated with the synthesis of Ni-CeO₂ nanoparticles under three electricity scenarios: the current Global mix, a Business-as-Usual (BAU) pathway according to the IEA Stated Policies Scenario (STEPS), and a fully decarbonized mix aligned with the IEA Net Zero proposal. Solvents and electricity demands are identified as the dominant contributors. The environmental benefits of …","abstractTruncated":true,"tier":"must_read","tierLabel":"必读","reportDate":"2026-11-05","tkey":"air","id":327,"titleZh":"","abstractZh":""},{"title":"Photochemical Interactions of Nitrate Photolysis and Photosensitization of BBOA: Enhanced HONO Production and the Formation of Nitrophenols","url":"https://doi.org/10.1021/acs.est.6c13970","doi":"10.1021/acs.est.6c13970","journal":"Environmental Science \u0026 Technology","jabbr":"ES\u0026T","pubdate":"2026-10-19","topic":"空气污染","topics":["空气污染","大气化学"],"matchTerm":"aerosol","matchWhere":"摘要：aerosol、标题：photochemical","score":12,"authors":["Ruifeng Zhang","Yong Jie Li","Chak K. Chan"],"authorMore":false,"abstract":"Abstract Renoxification of nitrate to reactive nitrogen species (RNS) can sustain atmospheric oxidant production. Because nitrate and light-absorbing brown carbon can coexist in biomass burning (BB) plumes, their photochemical interaction may alter RNS cycling. Furthermore, nitration of phenols in biomass burning organic aerosol (BBOA) can form nitrophenols, potentially increasing the warming effect of aged BBOA. Yet the mechanisms of renoxification and nitration in irradiated nitrate-BBOA mixtures remain poorly understood. We experimentally investigate these coupled processes over a wide range of fir-wood BBOA concentrations during aqueous nitrate photolysis (10 mM) under acidic conditions …","abstractTruncated":true,"tier":"must_read","tierLabel":"必读","reportDate":"2026-10-20","tkey":"other","id":328,"titleZh":"","abstractZh":""},{"title":"Aqueous Carbonyl-Amino Aggregation Drives Atmospheric Nitrogen-Containing Oligomer Formation in China Haze","url":"https://doi.org/10.1021/acs.est.6c09940","doi":"10.1021/acs.est.6c09940","journal":"Environmental Science \u0026 Technology","jabbr":"ES\u0026T","pubdate":"2026-10-19","topic":"空气污染","topics":["空气污染","生物地球化学"],"matchTerm":"haze","matchWhere":"标题：haze、摘要：nitrogen cycle","score":12,"authors":["Binyu Xiao","Chenlong Liang","Gehui Wang","Rongjie Li","Luyao Chen","Zheng Li"],"authorMore":true,"abstract":"Abstract Nitrogen-containing organic compounds (NOCs) are ubiquitous in the troposphere and contribute to the reactive nitrogen cycle and aerosol light absorption, yet their formation mechanisms remain unclear, especially in polluted regions. Here, we characterized NOCs in PM2.5 during winter haze in the North China Plain (NCP), with a comparison to those in the Sichuan Basin (ScB). Reduced-nitrogen NOCs (Re-NOCs) accounted for 40% of organics detected in the ESI+ mode, highlighting their importance within atmospheric NOCs. Compared to dry haze (DH) in NCP, high-molecular-weight (HMW, m/z \u0026gt; 250) Re-NOCs in humid haze (HH) were enhanced, which positively correlated with NH4+ and the mass …","abstractTruncated":true,"tier":"must_read","tierLabel":"必读","reportDate":"2026-10-20","tkey":"other","id":329,"titleZh":"","abstractZh":""},{"title":"Carbon Prices and Cooking Fires: How Decarbonization Pathway Design Shapes Household Energy Burdens","url":"https://doi.org/10.1088/1748-9326/aeb55d","doi":"10.1088/1748-9326/aeb55d","journal":"Environmental Research Letters","jabbr":"ERL","pubdate":"2026-10-16","topic":"能源转型与低碳技术","topics":["能源转型与低碳技术","气候变化与极端天气"],"matchTerm":"decarbonization pathway","matchWhere":"标题：decarbonization pathway、摘要：climate mitigation","score":12,"authors":["Mel George","Leon Clarke","Jihoon Min","Shonali Pachauri","Anand Patwardhan","Narasimha D. Rao"],"authorMore":false,"abstract":"Abstract Climate mitigation pathways impose uneven burdens across income groups, yet analyses typically focus on revenue recycling rather than on how pathway architecture shapes distributional outcomes. We examine 17 pathways to 1.5°C and trace their impacts to household energy burdens across income deciles in India and the United States. Pathway architecture is a primary determinant of whether mitigation is progressive or regressive. Technology, pace, and cost-optimal pathways are regressive: the poorest households bear cost increases up to an order of magnitude larger than the richest. Demand-side pathways lower carbon prices by curbing demand among high-income consumers, creating …","abstractTruncated":true,"tier":"must_read","tierLabel":"必读","reportDate":"2026-11-05","tkey":"air","id":330,"titleZh":"","abstractZh":""},{"title":"Social Nature, Compound Vulnerabilities, and Relational Impacts: A Sympathetic Critique of Environmental Assessment","url":"https://doi.org/10.1146/annurev-environ-012023-022549","doi":"10.1146/annurev-environ-012023-022549","journal":"Annual Review of Environment and Resources","jabbr":"Annu Rev Environ Resour","pubdate":"2026-10-15","topic":"城市与环境空间建模","topics":["城市与环境空间建模","减排政策与能源战略"],"matchTerm":"environmental assessment","matchWhere":"标题：environmental assessment、摘要：climate policy","score":12,"authors":["Keith Barney","Rini Astuti","Sara Bice","Christina Griffin","Mira Käkönen","Sango Mahanty"],"authorMore":false,"abstract":"Environmental and social impact assessment is a core policy approach for regulating environment–development challenges across both developed and developing contexts. Related frameworks, including cumulative impact assessment and vulnerability assessment, have become key mechanisms for guiding project approval and climate policy. However, assessment frameworks are often constrained by the political economy of extractive development, compliance-oriented procedures, and limited incorporation of local and Indigenous knowledge, while regulatory accretion can delay approvals for even beneficial interventions. Drawing on more than 150 publications across environmental assessment (EA), political …","abstractTruncated":true,"tier":"must_read","tierLabel":"必读","reportDate":"2026-11-05","tkey":"gis","id":331,"titleZh":"","abstractZh":""},{"title":"Quantifying Multiple Reaction Pathways for Ambient Consumed Volatile Organic Compounds Derived from Emission Sources","url":"https://doi.org/10.1021/acs.est.6c05906","doi":"10.1021/acs.est.6c05906","journal":"Environmental Science \u0026 Technology","jabbr":"ES\u0026T","pubdate":"2026-10-07","topic":"空气污染","topics":["空气污染","大气化学"],"matchTerm":"ozone","matchWhere":"摘要：ozone、标题：volatile organic","score":12,"authors":["Tao Yang","Baoshuang Liu","Liqin Duan","Yuan Ma","Zhongwei Luo","Yinchang Feng"],"authorMore":true,"abstract":"Abstract A novel method was developed to quantify source-specific volatile organic compound (VOC) consumption via multiple reaction pathways, including daytime hydroxyl (•OH) radical reactions and nighttime ozone (O3) and nitrate radical (NO3•) reactions. This approach integrates positive matrix factorization (PMF) with observed and initial-concentration data, enabling simultaneous source apportionment of both emitted and chemically consumed VOCs. The method was applied to hourly VOC measurements made in Linfen, a typical industrial city in China, from April to October 2023. Eight emission sources were resolved and quantified for their contributions to VOC consumption through different …","abstractTruncated":true,"tier":"must_read","tierLabel":"必读","reportDate":"2026-10-08","tkey":"other","id":332,"titleZh":"","abstractZh":""},{"title":"Kinetic Aerosol Trapping Drives Arctic Enrichment of Organophosphate Flame Retardants","url":"https://doi.org/10.1021/acs.est.6c09739","doi":"10.1021/acs.est.6c09739","journal":"Environmental Science \u0026 Technology","jabbr":"ES\u0026T","pubdate":"2026-10-06","topic":"空气污染","topics":["空气污染","大气化学"],"matchTerm":"aerosol","matchWhere":"标题：aerosol、摘要：atmospheric chemistry","score":12,"authors":["Dongchun Wang","Haibo Ma","Xiaxia Wang","Zixuan Li","Zhaoli Yang","Shuyi Li"],"authorMore":true,"abstract":"Abstract Organophosphate flame retardants (OPFRs) are emerging contaminants posing significant risks to the Arctic environment and human health. Concerns have been raised about the origins of Arctic OPFRs because atmospheric models have failed to reproduce the high Arctic OPFR levels due to unresolved phase-partitioning dynamics and atmospheric chemistry. Here, we implement a kinetic gas-particle accumulation scheme, in which particle-bound OPFRs do not re-equilibrate to the gas phase, into the atmospheric chemistry model GEOS-Chem High Performance (GCHP) v14.5.0. A 2 × 2 factorial design crossing the partitioning mechanism with hydroxyl radical (OH) chemistry isolates the importance of …","abstractTruncated":true,"tier":"must_read","tierLabel":"必读","reportDate":"2026-10-07","tkey":"other","id":333,"titleZh":"","abstractZh":""},{"title":"Combustion-derived air pollution and heat from gas-fired appliances in commercial kitchens can exceed health-based guidelines","url":"https://iopscience.iop.org/article/10.1088/1748-9326/ae9d96","doi":"10.1088/1748-9326/ae9d96","journal":"Environmental Research Letters","jabbr":"ERL","pubdate":"2026-10-05","topic":"空气污染","topics":["空气污染","生物地球化学"],"matchTerm":"air pollution","matchWhere":"标题：air pollution、摘要：methane","score":12,"authors":["Yannai S Kashtan","Eric D Lebel","Nicole Lucha","Colin Finnegan","Gan Huang","Tamara L Sparks"],"authorMore":true,"abstract":"Abstract Commercial kitchens may expose an estimated 15.7 million U.S. workers to elevated air pollution and heat, yet real-world measurements are limited and no prior study has compared commercial kitchens with gas-fired appliances to fully electric ones. We monitored pollutants and temperature in 27 commercial kitchens in California, Pennsylvania, and New York, including 24 natural gas- or propane-fired and 3 fully electric, during both work and idle periods. We measured nitrogen dioxide (NO₂), carbon monoxide (CO), carbon dioxide (CO₂), methane (CH₄), benzene, and temperature at five locations within each kitchen relevant for chefs and cooks. During work hours, NO₂ measured …","abstractTruncated":true,"tier":"must_read","tierLabel":"必读","reportDate":"2026-10-07","tkey":"other","id":334,"titleZh":"","abstractZh":""},{"title":"Persistent Desorption, Aging, and Secondary VOC Formation from Biomass-Burning Emissions on Indoor Surfaces","url":"https://doi.org/10.1021/acs.est.6c05801","doi":"10.1021/acs.est.6c05801","journal":"Environmental Science \u0026 Technology","jabbr":"ES\u0026T","pubdate":"2026-10-03","topic":"空气污染","topics":["空气污染","大气化学"],"matchTerm":"air quality","matchWhere":"摘要：air quality、标题：voc","score":12,"authors":["Shiqian Long","Xiaoqiao Jiao","Wenting Yuan","Weilin Huang","Wangchao Zhao","Bo Yang"],"authorMore":true,"abstract":"Abstract Biomass burning (BB) degrades indoor air quality both through direct emissions and via smoke sorption onto surfaces, resulting in persistent pollutant re-emission and transformation. However, the dynamics of this multiphase process remain unclear. This study investigates the re-emission, chemical aging, and secondary product formation of smoke residues on three representative indoor surfaces (glass, cotton, and gypsum). Smoke-contaminated surfaces re-emitted 120–180 distinct volatile organic compounds (VOCs). After 2 weeks of ventilation, the median emission rates of various VOCs from porous cotton and gypsum (3.3 and 4.2 μg m–2 h–1) far exceeded that from glass (0.06 μg m–2 h–1), …","abstractTruncated":true,"tier":"must_read","tierLabel":"必读","reportDate":"2026-10-04","tkey":"other","id":335,"titleZh":"","abstractZh":""},{"title":"A Multi-Stage Deep Learning Framework for Daily PM2.5 Estimation at 100 m Resolution Across the Contiguous United States, 2000–2024 (A Quarter Century of Data)","url":"https://doi.org/10.1021/acs.est.6c05375","doi":"10.1021/acs.est.6c05375","journal":"Environmental Science \u0026 Technology","jabbr":"ES\u0026T","pubdate":"2026-10-02","topic":"空气污染","topics":["空气污染","遥感"],"matchTerm":"pm2.5","matchWhere":"标题：pm2.5、摘要：satellite","score":12,"authors":["Ali Sheidaei","Kimiya Gohari","Ryan Michael","Jitendra Kumar Barupal","Ajit Rajiva","Anat Heilper"],"authorMore":true,"abstract":"Abstract Accurate high-resolution estimation of fine particulate matter (PM2.5) remains challenging because of sparse monitoring networks and missing satellite observations. We developed a multistage deep learning framework to generate daily PM2.5 concentrations at 100 m resolution across the contiguous United States (CONUS) from 2000 to 2024. The framework first reconstructed missing satellite aerosol optical depth (AOD) using a U-Net-based encoder–decoder informed by reanalysis data, refined temporal dependencies using a bidirectional long short-term memory network, and downscaled reconstructed AOD to 100 m using terrain information. Daily PM2.5 was subsequently estimated using a …","abstractTruncated":true,"tier":"must_read","tierLabel":"必读","reportDate":"2026-10-04","tkey":"other","id":336,"titleZh":"","abstractZh":""},{"title":"COVID-19 Impacts on Anthropogenic NOₓ Emissions in China, the contiguous U.S., and Europe: Insights from Joint TROPOMI and Surface NO₂ Data Assimilation","url":"https://doi.org/10.1088/1748-9326/aeaf6b","doi":"10.1088/1748-9326/aeaf6b","journal":"Environmental Research Letters","jabbr":"ERL","pubdate":"2026-10-02","topic":"空气污染","topics":["空气污染","遥感"],"matchTerm":"air quality","matchWhere":"摘要：air quality、标题：tropomi","score":12,"authors":["Chongyuan Wu","Xiaoye Zhang","Lifeng Guo","峻霆 仲","Deying Wang","Jiaying Li"],"authorMore":true,"abstract":"Abstract This study integrates satellite and surface NO₂ measurements through the ensemble square root filter (EnSRF) and the GEOS‑Chem model to estimate anthropogenic NOₓ emissions for China, the contiguous U.S., and Europe over 2019–2020, and further examines how the COVID‑19 pandemic altered emission patterns and sectoral contributions. Our results show that in 2020, anthropogenic NOₓ emissions were 19.20 ± 5.87 Tg in China, 8.96 ± 2.90 Tg in the contiguous U.S., and 10.56 ± 2.95 Tg in Europe. Compared with 2019, emissions decreased by about 5.38% in China, 8.94% in the contiguous U.S., and 15.38% in Europe. In China, emission reductions came from transportation, power plants, and …","abstractTruncated":true,"tier":"must_read","tierLabel":"必读","reportDate":"2026-10-04","tkey":"other","id":337,"titleZh":"","abstractZh":""},{"title":"Metal-Induced Localized Microcrystals Buffer Poisoning in NOx Catalytic Reduction","url":"https://doi.org/10.1021/acs.est.6c09247","doi":"10.1021/acs.est.6c09247","journal":"Environmental Science \u0026 Technology","jabbr":"ES\u0026T","pubdate":"2026-10-01","topic":"空气污染","topics":["空气污染","大气化学"],"matchTerm":"no2","matchWhere":"摘要：no2、标题：nox","score":12,"authors":["阎立军","Guang Yan","Li Chen","Jun Liu","Zhenyang Tao","Mzamo L. Shozi"],"authorMore":true,"abstract":"Abstract Metal impurities in flue gas severely threaten the service life of NOx abatement catalysts. While traditional acid-base interaction strategies rely on sacrificial sites, such passive defense mechanisms merely mitigate activity loss rather than fundamentally resolving poisoning. This study establishes an active defense mechanism by fabricating amorphous high-entropy metal oxides capable of sequestering metal poisons by inducing localized microcrystallization. These resulting microcrystals are subsequently transformed into extra active centers for NOx reduction. Systematic investigation reveals that the K-migration pathway drives a structural evolution from a disordered metastable …","abstractTruncated":true,"tier":"must_read","tierLabel":"必读","reportDate":"2026-10-04","tkey":"other","id":338,"titleZh":"","abstractZh":""},{"title":"Living with extreme weather: Health vulnerabilities and everyday adaptations of informal outdoor workers in urban Vietnam","url":"https://doi.org/10.1016/j.gloenvcha.2026.103235","doi":"10.1016/j.gloenvcha.2026.103235","journal":"Global Environmental Change","jabbr":"Global Environmental Change","pubdate":"2026-09-19","topic":"气候变化与极端天气","topics":["气候变化与极端天气","减排政策与能源战略"],"matchTerm":"extreme weather","matchWhere":"标题：extreme weather、摘要：climate governance","score":12,"authors":["Anh Ngoc Vu","Loc Duc Nguyen","Jonathan D. Rigg"],"authorMore":false,"abstract":"Climate change has intensified health risks for informal outdoor workers in the Global South, whose exposure to extreme weather is compounded by systemic marginalisation, economic precarity, and limited access to healthcare. Dominant climate-health research and adaptation policies often remain anchored in ons from the 2019–2020 Black Summer and multi-year variability","url":"https://iopscience.iop.org/article/10.1088/1748-9326/aea86e","doi":"10.1088/1748-9326/aea86e","journal":"Environmental Research Letters","jabbr":"ERL","pubdate":"2026-10-26","topic":"空气污染","topics":["空气污染","遥感","极端天气"],"matchTerm":"no2","matchWhere":"标题：no2、摘要：satellite、摘要：wildfire","score":15,"authors":["Zhenda Sun","Zhongfeng Pan","Chongyang Li","Hao Yin and Youwen Sun"],"authorMore":false,"abstract":"Abstract The 2019–2020 Black Summer wildfires provide a representative case for quantifying how extreme biomass burning affects regional pollutant transport. In this study, we combine satellite-derived column concentrations, ground-based observations, flux diagnostics, and forward trajectory analysis to evaluate the cross-boundary transport responses of NO₂ and CO over southeastern Australia. During the peak fire period, both CO and NO₂ fluxes increased markedly, indicating enhanced cross-boundary export of fire-related pollutants. However, the enhancement of CO net flux was more sustained over time than that of NO₂, and remained elevated during the later fire stage, indicating a more …","abstractTruncated":true,"tier":"must_read","tierLabel":"必读","reportDate":"2026-10-27","tkey":"other","id":341,"titleZh":"","abstractZh":""},{"title":"Atmospheric Removal of Nitrous Oxide: Approaches and Feasibility","url":"https://doi.org/10.1021/acs.est.6c04107","doi":"10.1021/acs.est.6c04107","journal":"Environmental Science \u0026 Technology","jabbr":"ES\u0026T","pubdate":"2026-10-16","topic":"空气污染","topics":["空气污染","大气化学","生物地球化学"],"matchTerm":"ozone","matchWhere":"摘要：ozone、摘要：atmospheric lifetime、标题：nitrous oxide","score":15,"authors":["William J. Sawyer"],"authorMore":false,"abstract":"Abstract Nitrous oxide (N2O) is the third-largest contributor to anthropogenic greenhouse gas forcing and the dominant anthropogenic ozone-depleting emission. While mitigation can flatten emissions, there is no clear pathway to eliminate residual emissions from agriculture and other diffuse sources, a key challenge for climate stabilization. The potential role of atmospheric removal has not been holistically assessed, yet N2O’s high potency and long atmospheric lifetime indicate the potential for a durable climate benefit. This review synthesizes emerging approaches for atmospheric N2O removal, organized by reaction mechanism (thermal destruction and thermocatalysis, photolysis, gas-phase …","abstractTruncated":true,"tier":"must_read","tierLabel":"必读","reportDate":"2026-10-17","tkey":"other","id":342,"titleZh":"","abstractZh":""},{"title":"Quantifying assets for the geopolitics of climate change mitigation","url":"https://doi.org/10.1038/s41893-026-01971-z","doi":"10.1038/s41893-026-01971-z","journal":"Nature Sustainability","jabbr":"Nat Sustain","pubdate":"2026-10-15","topic":"电力系统与风光资源","topics":["电力系统与风光资源","气候变化与极端天气"],"matchTerm":"renewable energy potential","matchWhere":"摘要：renewable energy potential、标题：climate change","score":15,"authors":["Guanna Pan","Ulrike Kornek","Chen Chris Gong","Edna Johanna Molina Bacca","Gunnar Luderer","Ottmar Edenhofer"],"authorMore":false,"abstract":"Abstract Climate change mitigation reshapes the distribution of economic assets in the low-carbon transition. Here we quantify climate-related assets for 169 countries across four dimensions: fossil fuel production, climate change damages, renewable energy potential and land carbon sequestration capacity. We combine integrated assessment models, climate projections, economic damage functions and biosphere datasets to assess asset changes under multiple mitigation scenarios. Geopolitical challenges and opportunities arise from climate change mitigation because losses and gains across energy and environmental assets are country-specific, which we further characterize through a broad …","abstractTruncated":true,"tier":"must_read","tierLabel":"必读","reportDate":"2026-11-05","tkey":"wx","id":343,"titleZh":"","abstractZh":""},{"title":"Public support for novel carbon removal hinges on procedural and distributive fairness","url":"https://doi.org/10.1038/s41558-026-02741-7","doi":"10.1038/s41558-026-02741-7","journal":"Nature Climate Change","jabbr":"Nat Clim Chang","pubdate":"2026-09-24","topic":"CO2减排与碳排放","topics":["CO2减排与碳排放","CDR碳移除与负排放","减排政策与能源战略"],"matchTerm":"carbon dioxide","matchWhere":"摘要：carbon dioxide、标题：carbon removal、摘要：climate policy","score":15,"authors":["Livia Fritz","Lucilla Losi","Christine Merk","Michela Boldrini","Valentina Bosetti","Chad M. Baum"],"authorMore":false,"abstract":"Abstract Alongside the need for rapid emissions reductions, removing carbon dioxide from the atmosphere is emerging as a central pillar of global climate policy. Scaling up carbon removal raises pressing questions about how this can be done in an equitable and socially legitimate manner. Using vignette experiments with nationally representative surveys in six global south and global north countries (N = 10,852 respondents across Brazil, Malaysia, Saudi Arabia, Italy, Norway and the UK), we examine which modes of implementing novel carbon removal methods gain public support across diverse socio-political settings. We find that support hinges on procedural and distributive fairness: opening …","abstractTruncated":true,"tier":"must_read","tierLabel":"必读","reportDate":"2026-11-05","tkey":"ghg","id":344,"titleZh":"","abstractZh":""},{"title":"Progress and prospects of amine-based chemical absorption for post-combustion CO2 capture in thermal power plants","url":"https://doi.org/10.1016/j.apenergy.2026.128866","doi":"10.1016/j.apenergy.2026.128866","journal":"Applied Energy","jabbr":"Applied Energy","pubdate":"2027-01-01（在线预发表）","topic":"CO2减排与碳排放","topics":["CO2减排与碳排放","CCUS与地质封存"],"matchTerm":"co2","matchWhere":"标题：co2、标题：co2 capture","score":18,"authors":["Lijian Jin","Jinjin Li","Mao Jin","Danjun Jin","Heng Chen","Lingxiao Zhan"],"authorMore":false,"abstract":"","abstractTrunca "must_read","tierLabel":"必读","reportDate":"2026-11-02","tkey":"other","id":347,"titleZh":"","abstractZh":""},{"title":"ANME-2a perform methane oxidation in brackish coastal sediments via multiple pathways","url":"https://www.science.org/doi/abs/10.1126/sciadv.aei5868?af=R","doi":"10.1126/sciadv.aei5868","journal":"Science Advances","jabbr":"Sci Adv","pubdate":"2026-10-30","topic":"生物地球化学","topics":["生物地球化学","温室气体"],"matchTerm":"methane","matchWhere":"标题：methane、标题：methane","score":18,"authors":["Robin Klomp","Anna J. Wallenius","Merijn A. W. Schutgens","Theo van Alen","Thomas Röckmann","Mike S. M. Jetten"],"authorMore":true,"abstract":"Methane is a powerful greenhouse gas. Typically, a large fraction of methane formed in coastal sediments is removed via anaerobic oxidation of methane (AOM). Here, we demonstrate the potential for a range of AOM pathways in brackish coastal sediments by ANME-2a archaea. At our study site, geochemical profiles indicate that AOM is primarily restricted to a shallow, metal oxide–rich sulfate-methane transition zone (SMTZ). ANME-2a were the sole methanotrophs detected, and metatranscriptomics showed the highest expression levels of the ANME-2a genes in the SMTZ. AOM activity was observed in sediment incubations with various electron acceptors, including sulfate, metal oxides, and the organic …","abstractTruncated":true,"tier":"must_read","tierLabel":"必读","reportDate":"2026-10-31","tkey":"other","id":348,"titleZh":"","abstractZh":""},{"title":"Fog Intensity and Droplet Size-Resolved Aqueous Secondary Organic Aerosol (aqSOA) Formation in Polluted Winter Fog: New Insights from a Combined Observational and Modeling Study","url":"https://doi.org/10.1021/acs.est.6c09700","doi":"10.1021/acs.est.6c09700","journal":"Environmental Science \u0026 Technology","jabbr":"ES\u0026T","pubdate":"2026-10-30","topic":"空气污染","topics":["空气污染","大气化学"],"matchTerm":"aerosol","matchWhere":"标题：aerosol、标题：secondary organic aerosol","score":18,"authors":["Abhishek Ch ngxiang Guo","Fan Dai","Kuishuang Feng","Shijie Li","Peng Gong","Yuyu Zhou"],"authorMore":false,"abstract":"Abstract China’s century-long economic transition generated substantial methane emissions, yet the trajectory and factors of this evolution remain poorly quantified. A systematic understanding is essential for reconciling China’s economic growth with emission mitigation targets and for informing Global South nations. Using a bottom-up estimate of subnational methane emissions (1949–2022), we uncover a fundamental shift from agriculture-dominated to industry-dominated methane emissions in China. Nationwide emissions peaked in 2012, declining 3.8% by 2022, yet provincial disparities widened by 48%. While superficially reflecting heterogeneous fossil fuel use, these disparities are …","abstractTruncated":true,"tier":"must_read","tierLabel":"必读","reportDate":"2026-10-29","tkey":"other","id":351,"titleZh":"","abstractZh":""},{"title":"Estimating the Avoided Tropospheric Ozone Radiative Forcing From US Air Pollution Controls","url":"https://doi.org/10.1029/2026gl124547","doi":"10.1029/2026gl124547","journal":"Geophysical Research Letters","jabbr":"GRL","pubdate":"2026-10-28","topic":"空气污染","topics":["空气污染","温室气体"],"matchTerm":"air pollution","matchWhere":"标题：air pollution、标题：radiative forcing","score":18,"authors":["Stephanie Elkins","Arlene M. Fiore","Xinyuan Yu","Jean‐François Lamarque","Vaishali Naik","Yangyang Xu"],"authorMore":true,"abstract":"Abstract Regional air pollution controls imposed by the US Clean Air Act of 1970 reduced emissions of precursors to ozone (O₃), a radiatively active gas that primarily acts as a greenhouse gas in the troposphere. From a pair of CESM2(WACCM6) initial‐condition ensembles that simulate a “world avoided” by US air pollution controls from 1970 to 2013, we estimate the avoided tropospheric O₃ stratospheric‐adjusted radiative forcing (SARF) using an O₃ radiative kernel. We estimate an avoided global annual tropospheric O₃ SARF of +15 mW m −2 (+10–24, ensemble range) at the end of the period (2004–2013 average), approximately 4% (3%–6%) of the preindustrial‐to‐present‐day tropospheric O₃ …","abstractTruncated":true,"tier":"must_read","tierLabel":"必读","reportDate":"2026-10-29","tkey":"other","id":352,"titleZh":"","abstractZh":""},{"title":"Coupled drought–land use dynamics and agricultural resilience in mainland Southeast Asia","url":"https://iopscience.iop.org/article/10.1088/1748-9326/aea91b","doi":"10.1088/1748-9326/aea91b","journal":"Environmental Research Letters","jabbr":"ERL","pubdate":"2026-10-27","topic":"极端天气","topics":["极端天气","城市地理信息系统"],"matchTerm":"drought","matchWhere":"标题：drought、标题：land use","score":18,"authors":["Anping Chen","Alan D Ziegler","Stephen J Leisz","Nathaniel D Mueller and Edwin K P Chong"],"authorMore":false,"abstract":"Abstract Drought is initiated by climatic anomalies, but its development and consequences often unfold as a coupled socio-ecological process shaped by interactions among land use, water infrastructure, resource management, and governance. This coupling is particularly pronounced in mainland Southeast Asia (MSEA), where strong monsoon dependence, rapid land-system transformation, expanding hydraulic infrastructure, and intensive water use influence how climatic water deficits propagate through hydrological, agricultural, and livelihood systems. Drawing on an integrative narrative review and an illustrative analysis of standardized precipitation–evapotranspiration index data, we characterize …","abstractTruncated":true,"tier":"must_read","tierLabel":"必读","reportDate":"2026-10-28","tkey":"other","id":353,"titleZh":"","abstractZh":""},{"title":"From Molecular Topography to Ozone Pollution: Species Sources and Photochemical Kinetics of Individual Organic Peroxyl Radicals","url":"https://doi.org/10.1021/acs.est.6c12080","doi":"10.1021/acs.est.6c12080","journal":"Environmental Science \u0026 Technology","jabbr":"ES\u0026T","pubdate":"2026-10-24","topic":"空气污染","topics":["空气污染","大气化学"],"matchTerm":"ozone","matchWhere":"标题：ozone、标题：photochemical","score":18,"authors":["Weiqing Liang","XuRong Shi","Jing Gong","Zhenyu Wang","Huan Zhao","Han Xu"],"authorMore":true,"abstract":"Abstract Ground-level ozone (O3) poses significant threats to global public health and climate change. Organic peroxyl radicals (RO2) serve as crucial intermediates in atmospheric O3 formation. Although individual RO2 species exhibit distinct reactivities, the quantification and source attribution of individual RO2 species remain poorly understood. Here, we address the challenge by integrating high-resolution field observations with fundamental theoretical kinetics within a novel hybrid receptor-kinetic modeling framework. The concentration and composition of RO2 species exhibit significant seasonal and diurnal dependencies. In summer, the 19 RO2 pool was characterized by a substantial …","abstractTruncated":true,"tier":"must_read","tierLabel":"必读","reportDate":"2026-10-25","tkey":"other","id":354,"titleZh":"","abstractZh":""},{"title":"Chasing Bubbles: Toward a Standardized Approach for Quantifying Methane Ebullition Using Bubble Traps in Streams and Rivers","url":"https://doi.org/10.1021/acs.est.6c13075","doi":"10.1021/acs.est.6c13075","journal":"Environmental Science \u0026 Technology","jabbr":"ES\u0026T","pubdate":"2026-10-23","topic":"生物地球化学","topics":["生物地球化学","温室气体"],"matchTerm":"methane","matchWhere":"标题：methane、标题：methane","score":18,"authors":["Adam Bednařík","Eva Darenova","Helena Cvetkovic","Charlotte Doebke","Clemens Karwautz","Lukáš Kokrda"],"authorMore":true,"abstract":"Abstract Ebullition transports large quantities of the potent greenhouse gas methane (CH4) from stream sediments into the atmosphere. However, the use of different sampling designs complicates comparisons of CH4 emissions estimates between studies. Here, we present the first systematic review of sampling designs used in the past for assessing fluvial CH4 ebullition rates. In addition, we conducted field experiments to estimate the optimal number of bubble traps and the length of the sampling period, and to assess uncertainties in determining CH4 content in the emitted bubbles. Our results demonstrate considerable spatial variability in bubble fluxes (0–4.8 L m–2 d–1) and CH4 content in the …","abstractTruncated":true,"tier":"must_read","tierLabel":"必读","reportDate":"2026-10-24","tkey":"other","id":355,"titleZh":"","abstractZh":""},{"title":"Amazon carbon emissions driven by human actions amplified by droughts","url":"https://www.nature.com/articles/s41586-026-11168-1","doi":"10.1038/s41586-026-11168-1","journal":"Nature","jabbr":"Nature","pubdate":"2026-10-21","topic":"温室气体","topics":["温室气体","极端天气"],"matchTerm":"carbon emissions","matchWhere":"标题：carbon emissions、标题：droughts","score":18,"authors":["Luciana V. Gatti","Camilla L. Cunha","Juan C. G. Blas","A. Scott Denning","Mariane S. Reis","Luciano Marani"],"authorMore":true,"abstract":"Abstract The Amazon carbon sink is weakening as deforestation 1–5, rising tree mortality 6–8 and climate change disrupt the climatic conditions that sustain a humid tropical forest 9–11. Forest loss reduces precipitation, increases temperatures and lengthens the dry season, driving higher carbon emissions 1–4,11,12. Climate stress is stronger in more deforested regions, rendering forests progressively more flammable 1,9,13. Large-scale climate events, such as El Niño, further amplify regional climate impacts 9,14–17. Here we present an analysis of 15 years of Amazonian carbon fluxes derived from atmospheric CO₂ measurements. We determine a carbon balance of 0.32 ± 0.08 PgC yr −1, …","abstractTruncated":true,"tier":"must_read","tierLabel":"必读","reportDate":"2026-10-22","tkey":"other","id":356,"titleZh":"","abstractZh":""},{"title":"Observing Methane Emissions From Oil and Gas Infrastructure in the Permian Basin Using TROPOMI","url":"https://doi.org/10.1029/2026gl124412","doi":"10.1029/2026gl12 038/s41558-026-02753-3","journal":"Nature Climate Change","jabbr":"Nat Clim Chang","pubdate":"2026-09-21","topic":"电力系统与风光资源","topics":["电力系统与风光资源","气候变化与极端天气"],"matchTerm":"solar and wind","matchWhere":"标题：solar and wind、标题：climate change","score":18,"authors":["Yuanyuan Lin","Dongsheng Zheng","Dan Tong","Steven J. Davis","Zhicong Yin","Kebin He"],"authorMore":false,"abstract":"","abstractTruncated":false,"tier":"must_read","tierLabel":"必读","reportDate":"2026-11-05","tkey":"wx","id":361,"titleZh":"","abstractZh":""},{"title":"Important but Overlooked Reactive Organic Carbon (ROC) Air Pollution From Permafrost Wildfires in Canada","url":"https://doi.org/10.1029/2026gl124165","doi":"10.1029/2026gl124165","journal":"Geophysical Research Letters","jabbr":"GRL","pubdate":"2026-10-28","topic":"空气污染","topics":["空气污染","大气化学","极端天气"],"matchTerm":"air pollution","matchWhere":"标题：air pollution、摘要：voc、标题：wildfires","score":21,"authors":["Xueying Liu","Zejiang Yu","Yifang Ban","Hemraj Bhattarai","Theodore K. Koenig","Lingcao Huang"],"authorMore":true,"abstract":"Abstract Canadian permafrost wildfires, characterized by surface flaming and deep organic soil smoldering, emit complex suites of volatile organic compounds (VOCs). These emissions include air toxics that pose substantial public health risks and fuel secondary pollution, yet remain understudied. We quantified VOC emissions from the record‐setting 2023 wildfires using three inventories (GFED, GFAS, QFED) and assessed air quality impacts via GEOS‐Chem simulations and in situ observations. VOC emissions amount to ∼15 ± 8 TgC, just ∼2% of inorganic carbon. Despite this small fraction, their impacts are significant: simulated concentrations increase by 2–5 μg m −3 for benzene and 5–35 μg m −3 …","abstractTruncated":true,"tier":"must_read","tierLabel":"必读","reportDate":"2026-10-29","tkey":"other","id":362,"titleZh":"","abstractZh":""},{"title":"Biochar Application Enhances Photochemical Reactivity of Dissolved Organic Matter to Stimulate CO2 Emissions in Paddy Water","url":"https://doi.org/10.1021/acs.est.6c11475","doi":"10.1021/acs.est.6c11475","journal":"Environmental Science \u0026 Technology","jabbr":"ES\u0026T","pubdate":"2026-10-27","topic":"大气化学","topics":["大气化学","生物地球化学","温室气体"],"matchTerm":"photochemical","matchWhere":"标题：photochemical、摘要：carbon cycle、标题：co2","score":21,"authors":["Mengmeng Zhao","Shishu Zhu","Wendan Luo","Hengyi Fu","Yalan Chen","Ke Sun"],"authorMore":false,"abstract":"Abstract Dissolved organic matter (DOM) plays a pivotal role in regulating photochemical reactivity and carbon turnover in flooded paddy systems. While biochar (BC) is recognized as a promising strategy for soil carbon preservation, its impact on DOM evolution and photochemical carbon cycle in paddy water remains unknown. Here, we demonstrated that BC amendment continuously enhanced the photogeneration of hydroxyl radicals (•OH) and low-energy excited triplet-state DOM (3DOM*-L) in paddy water, increasing CO2 emissions by an average of 35.5% while playing a minor role in CH4 formation over a 34-day incubation. The enhanced photoactivity was associated with the enrichment of the photoactive …","abstractTruncated":true,"tier":"must_read","tierLabel":"必读","reportDate":"2026-10-28","tkey":"other","id":363,"titleZh":"","abstractZh":""},{"title":"Global socioeconomic constraints on afforestation- and reforestation-based carbon dioxide removal","url":"https://www.cell.com/one-earth/fulltext/S2590-3322(26","doi":"10.1016/j.oneear.2026.101872","journal":"One Earth","jabbr":"One Earth","pubdate":"2026-10-16","topic":"CO2减排与碳排放","topics":["CO2减排与碳排放","CDR碳移除与负排放","气候变化与极端天气"],"matchTerm":"carbon dioxide","matchWhere":"标题：carbon dioxide、标题：carbon dioxide removal、摘要：climate mitigation","score":21,"authors":["Wenkai Bao","Yiannis Moustakis","Wolfgang A. Obermeier","Matthias Garschagen","Julia Pongratz"],"authorMore":false,"abstract":"Afforestation and reforestation are central to climate mitigation, yet their feasibility and viability depend on more than biophysical suitability. Without considering socioeconomic constraints, carbon dioxide removal (CDR) assessments risk mistaking biophysical potential for deployable removal, obscuring where projects can succeed and which investments are needed for durable, equitable implementation. Here, we combine an assessment of 200 studies with 78 machine-learning models to quantify socioeconomic associations with standing afforestation and reforestation and assess implications for future CDR. Poverty, food insecurity, insecure land tenure, and weak governance emerge globally as the …","abstractTruncated":true,"tier":"must_read","tierLabel":"必读","reportDate":"2026-11-05","tkey":"ghg","id":364,"titleZh":"","abstractZh":""},{"title":"Fusion-DeepRSM for Satellite-Derived PM2.5 Estimation and Precursor Sensitivity Prediction","url":"https://doi.org/10.1021/acs.est.6c08137","doi":"10.1021/acs.est.6c08137","journal":"Environmental Science \u0026 Technology","jabbr":"ES\u0026T","pubdate":"2026-10-12","topic":"空气污染","topics":["空气污染","遥感","大气化学"],"matchTerm":"pm2.5","matchWhere":"标题：pm2.5、标题：satellite、摘要：atmospheric chemistry","score":21,"authors":["Maolin Zhang","Siwei Li","Jia Xing","Ge Song","Senlin Hu","Jie Yang"],"authorMore":true,"abstract":"Abstract Accurate estimation of fine particulate matter (PM2.5) and characterization of precursor-response relationships are crucial for human health protection and air quality management. However, current approaches remain limited by the high computational cost and uncertainties of chemical transport models (CTMs), as well as the sample imbalance and limited interpretability of observation-based machine learning methods. Here, we developed Fusion-DeepRSM, an observation-constrained extension of the Deep Learning Response Surface Model (DeepRSM) framework that integrates CTM simulations, multisource satellite observations, and ground-based measurements to derive spatially continuous PM2.5 …","abstr <script>
(function(){
  var D = JSON.parse(document.getElementById('DATA').textContent);
  var A = D.articles;
  var TOPICS = D.topics;
  var JOURNAL_RANK = {};
  (D.journalOrder || []).forEach(function(name, index){ JOURNAL_RANK[name] = index; });
  function journalRank(a){ return JOURNAL_RANK[a.journal] == null ? 10000 : JOURNAL_RANK[a.journal]; }

  /* Inline SVG rather than emoji: emoji depend on a colour-emoji font being
     installed, and the missing-glyph box is worse than no icon at all. */
  var P = {
    all:   '<rect x="3" y="3" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="2"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="2"/>',
    air:   '<path d="M3 7.5h9.6a2.6 2.6 0 1 0-2.6-2.6"/><path d="M3 12h13.2a2.6 2.6 0 1 1-2.6 2.6"/><path d="M3 16.5h6.8"/>',
    rs:    '<circle cx="12" cy="12" r="8.6"/><ellipse cx="12" cy="12" rx="3.7" ry="8.6"/><path d="M3.4 12h17.2"/>',
    chem:  '<path d="M9.5 2.8h5"/><path d="M10.6 2.8v5.8L6.3 16.9a2 2 0 0 0 1.8 3h7.8a2 2 0 0 0 1.8-3L15.4 8.6V2.8"/><path d="M7.9 13.6h8.2"/>',
    bgc:   '<path d="M20.6 3.4C20.6 12 15.7 16.1 9.5 16.1H4.1C4.1 7.5 9 3.4 15.2 3.4h5.4z"/><path d="M4.1 20.6c2.2-5.8 6.1-9.1 11.3-10.5"/>',
    ghg:   '<path d="M4.6 20v-6.2"/><path d="M2.2 15.6 4.6 13.2l2.4 2.4"/><path d="M12 20V9.4"/><path d="M9.6 11.8 12 9.4l2.4 2.4"/><path d="M19.4 20v-3.4"/><path d="M17 18.4l2.4-2.4 2.4 2.4"/>',
    wx:    '<path d="M13.2 2.6 4.4 13.8h6.2l-1 7.6 8.8-11.2h-6.2l1-7.6z"/>',
    gis:   '<path d="M9 3.4 3.5 5.8v14.8L9 18.2l6 2.4 5.5-2.4V3.4L15 5.8 9 3.4z"/><path d="M9 3.4v14.8"/><path d="M15 5.8v14.8"/>',
    other: '<path d="M14 3H7.6A2 2 0 0 0 5.6 5v14a2 2 0 0 0 2 2h9a2 2 0 0 0 2-2V7.6L14 3z"/><path d="M14 3v4.6h4.6"/>',
    search:'<circle cx="11" cy="11" r="7"/><path d="M20.2 20.2l-4.3-4.3"/>'
  };
  function svg(k, cls){
    return '<svg class="'+(cls||'ic')+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" '
         + 'stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">'+(P[k]||P.other)+'</svg>';
  }

  var state = { topic:'all', tier:'all', sort:'score', reading:'all', q:'' };
  var STORAGE_KEY = 'journal-alert-library-v1';
  var records = {};
  try { records = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}') || {}; }
  catch (e) { records = {}; }

  function articleKey(a){ return a.doi || a.url || a.title; }
  function recordOf(a){ return records[articleKey(a)] || {}; }
  function saveRecords(){
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(records)); }
    catch (e) { /* Keep the page usable when browser storage is unavailable. */ }
  }
  function updateRecord(a, patch){
    var key = articleKey(a);
    records[key] = Object.assign({}, records[key] || {}, patch);
    saveRecords();
  }

  // RIS_EXPORT_HELPERS_START
  function risValue(value){
    if(value==null) return '';
    return String(value).replace(/\r\n?|\n/g,' ').trim();
  }
  function risField(tag, value){
    var text = risValue(value);
    return text ? tag+'  - '+text+'\r\n' : '';
  }
  function buildRis(article){
    var lines = ['TY  - JOUR\r\n', risField('TI',article.title)];
    (article.authors||[]).forEach(function(author){ lines.push(risField('AU',author)); });
    lines.push(risField('JF',article.journal));
    var date = risValue(article.pubdate);
    var year = date.match(/^(\d{4})(?:-|$)/);
    lines.push(risField('PY',year ? year[1] : ''));
    lines.push(risField('DO',article.doi));
    var abstract = risValue(article.abstract);
    if(!article.abstractTruncated && !abstract.endsWith(' …')){
      lines.push(risField('AB',abstract));
    }
    lines.push(risField('UR',article.url));
    lines.push('ER  - \r\n');
    return lines.join('');
  }
  function risFilename(article){
    var base = risValue(article.doi || article.title || 'citation')
      .replace(/[\\/:*?"<>|]+/g,'_')
      .replace(/\s+/g,'_')
      .replace(/[^A-Za-z0-9._-]/g,'_')
      .replace(/_+/g,'_')
      .replace(/^[_\.]+|[_\.]+$/g,'')
      .slice(0,100);
    return (base || 'citation')+'.ris';
  }
  function downloadRis(article){
    var blob = new Blob([buildRis(article)], {type:'application/x-research-info-systems;charset=utf-8'});
    var url = URL.createObjectURL(blob);
    var link = document.createElement('a');
    link.href = url;
    link.download = risFilename(article);
    document.body.appendChild(link);
    link.click();
    link.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); },0);
  }
  // RIS_EXPORT_HELPERS_END

  /* An article can hit several keyword groups at once. a.topics holds every
     match (used for filtering); a.topic is the primary one (used for the cover
     chip and the section grouping, so nothing is listed twice). */
  var THEME = D.topicTheme || {};
  function topicsOf(a){ return a.topics && a.topics.length ? a.topics : [a.topic]; }

  var tabs = document.getElementById('tabs');
  var C = {all:A.length};
  TOPICS.forEach(function(t){ C[t]=0; });
  A.forEach(function(a){
    topicsOf(a).forEach(function(t){ if(C[t]!==undefined) C[t]++; });
  });

  var tabDefs = [{k:'all',label:'全部',icon:'all'}].concat(
    TOPICS.map(function(t){ return {k:t,label:t,icon:THEME[t]||'other'}; })
  );
  tabDefs.forEach(function(d){
    var b = document.createElement('button');
    b.className = 'tab' + (d.k==='all'?' on':'');
    b.type = 'button';
    var n = d.k==='all' ? C.all : (C[d.k]||0);
    b.innerHTML = svg(d.icon) + '<span>'+d.label+'</span><span class="n">'+n+'</span>';
    b.onclick = function(){
      state.topic = d.k;
      [].forEach.call(tabs.children, function(x){ x.classList.toggle('on', x===b); });
      render();
    };
    tabs.appendChild(b);
  });

  document.getElementById('seg').onclick = function(e){
    var b = e.target.closest('button'); if(!b) return;
    state.tier = b.dataset.t;
    [].forEach.call(this.children, function(x){ x.classList.toggle('on', x===b); });
    render();
  };
  document.getElementById('sortseg').onclick = function(e){
    var b = e.target.closest('button'); if(!b) return;
    state.sort = b.dataset.s;
    [].forEach.call(this.children, function(x){ x.classList.toggle('on', x===b); });
    render();
  };
  document.getElementById('readseg').onclick = function(e){
    var b = e.target.closest('button'); if(!b) return;
    state.reading = b.dataset.state;
    [].forEach.call(this.children, function(x){ x.classList.toggle('on', x===b); });
    render();
  };
  var qt;
  document.getElementById('q').oninput = function(e){
    clearTimeout(qt);
    var v = e.target.value.trim().toLowerCase();
    qt = setTimeout(function(){ state.q = v; render(); }, 130);
  };

  function esc(s){
    return String(s==null?'':s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  function trunc(s,n){ s=s||''; return s.length>n ? s.slice(0,n)+'…' : s; }
  function initial(name){
    if(!name) return '?';
    var m = /[A-Za-z]/.exec(name);
    return m ? m[0].toUpperCase() : name.slice(0,1);
  }
  function isFuture(d){ return (d||'').indexOf('（在线预发表）') >= 0; }
  function dateOf(a){ return (a.pubdate||a.reportDate||'').replace('（在线预发表）','').slice(0,10); }
  document.getElementById('kpi-days').textContent = D.reports.length;

  function select(){
    var q = state.q;
    var out = A.filter(function(a){
      if(state.topic!=='all' && topicsOf(a).indexOf(state.topic)<0) return false;
      if(state.tier!=='all' && a.tier!==state.tier) return false;
      var record = recordOf(a);
      if(state.reading==='unread' && record.read) return false;
      if(state.reading==='read' && !record.read) return false;
      if(state.reading==='saved' && !record.saved) return false;
      if(q){
        var hay = (a.title+' '+a.abstract+' '+a.authors.join(' ')+' '+a.journal+' '+a.doi).toLowerCase();
        if(hay.indexOf(q)<0) return false;
      }
      return true;
    });
    if(state.sort==='date'){
      out.sort(function(x,y){ return dateOf(y).localeCompare(dateOf(x)) || ((y.score||0)-(x.score||0)) || journalRank(x)-journalRank(y); });
    } else if(state.sort==='journal'){
      out.sort(function(x,y){ return journalRank(x)-journalRank(y) || x.journal.localeCompare(y.journal) || ((y.score||0)-(x.score||0)); });
    } else {
      out.sort(function(x,y){ return ((y.score||0)-(x.score||0)) || dateOf(y).localeCompare(dateOf(x)) || journalRank(x)-journalRank(y); });
    }
    return out;
  }

  function cardHTML(a){
    var record = recordOf(a);
    var tags = '<span class="tag '+a.tier+'">'+esc(a.tierLabel)+'</span>'
             + '<span class="tag">'+esc(a.jabbr)+'</span>';
    if(record.read) tags += '<span class="tag record">已读</span>';
    if(record.saved) tags += '<span class="tag saved">已收藏</span>';
    if(a.score!=null) tags += '<span class="tag">得分 '+a.score+'</span>';
    if(a.matchTerm) tags += '<span class="tag match" title="命中位置：'+esc(a.matchWhere)+'">命中 '+esc(a.matchTerm)+'</span>';
    topicsOf(a).filter(function(t){ return t!==a.topic; }).slice(0,2).forEach(function(t){
      tags += '<span class="tag cross">也属 '+esc(t)+'</span>';
    });

    var ab = a.abstract
      ? '<p class="excerpt">'+esc(trunc(a.abstract,200))+'</p>'
      : '<p class="excerpt none">日报未收录摘要'+(a.matchTerm?'（命中词 '+esc(a.matchTerm)+'）':'')+' · 点击看原文</p>';

    var au = esc(a.authors[0] || '佚名') + (a.authors.length>1 ? ' 等 '+(a.authors.length-1)+' 位' : '');

    return '<article class="card t-'+a.tkey+'" data-id="'+a.id+'" tabindex="0">'
      + '<div class="cover">'
      +   '<div class="tp">'+esc(a.topic)+'</div>'
      +   (a.score!=null ? '<div class="sc">★ '+a.score+'</div>' : '')
      +   '<div class="icon">'+svg(a.tkey)+'</div>'
      +   '<div class="jr">'+esc(a.jabbr)+'</div>'
      +   '<div class="tier '+a.tier+'"></div>'
      + '</div>'
      + '<div class="body">'
      +   '<h3 class="title">'+esc(a.title)+'</h3>'
      +   ab
      +   '<div class="translation">'
      +     '<div class="translation-label">中文速览</div>'
      +     (a.titleZh
              ? '<p class="translation-title">'+esc(a.titleZh)+'</p>'
                + (a.abstractZh?'<p class="translation-abstract">'+esc(a.abstractZh)+'</p>':'')
              : '<p class="translation-pending">待运行 Actions 生成译文</p>')
      +   '</div>'
      +   '<div class="tagrow">'+tags+'</div>'
      + '</div>'
      + '<div class="foot">'
      +   '<div class="av">'+esc(initial(a.authors[0]))+'</div>'
      +   '<div class="au">'+au+'</div>'
      +   '<div class="dt">'+esc(dateOf(a))+(isFuture(a.pubdate)?' · 预发表':'')+'</div>'
      + '</div>'
      + '</article>';
  }

  var wrap = document.getElementById('wall-wrap');
  var countEl = document.getElementById('count');
  var TIER_NAME = {must_read:'必读', worth_reading:'值得一读', other:'其他相关'};

  function render(){
    var list = select();
    var READ_NAME = {all:'全部状态', unread:'待读', read:'已读', saved:'收藏'};
    var scope = (state.topic==='all' ? '全部学科' : state.topic)
              + (state.tier==='all' ? '' : ' · '+TIER_NAME[state.tier])
              + (state.reading==='all' ? '' : ' · '+READ_NAME[state.reading]);
    countEl.textContent = scope + ' ｜ ' + list.length + ' / ' + A.length + ' 篇';

    if(!list.length){
      wrap.innerHTML = '<div class="empty">'+svg('search')+'没有匹配的文献，换个关键词或学科试试</div>';
      return;
    }

    var html = '';
    if(state.topic==='all' && state.tier==='all' && !state.q && state.sort==='score'){
      TOPICS.forEach(function(t){
        var g = list.filter(function(a){ return a.topic===t; });
        if(!g.length) return;
        var key = THEME[t] || 'other';
        var related = list.filter(function(a){ return topicsOf(a).indexOf(t)>=0; }).length - g.length;
        html += '<div class="grouphead'+(key!=='other'?' g-'+key:'')+'"><h2>'+svg(key)+t+'</h2>'
              + '<span class="gn">'+g.length+' 篇'
              + (related>0 ? ' · 另有 '+related+' 篇跨学科命中' : '')+'</span><div class="bar"></div></div>'
              + '<div class="wall">'+g.map(cardHTML).join('')+'</div>';
      });
      var rest = list.filter(function(a){ return TOPICS.indexOf(a.topic)<0; });
      if(rest.length){
        html += '<div class="grouphead"><h2>'+svg('other')+'其他</h2>'
              + '<span class="gn">'+rest.length+' 篇</span><div class="bar"></div></div>'
              + '<div class="wall">'+rest.map(cardHTML).join('')+'</div>';
      }
    } else {
      html = '<div class="wall">'+list.map(cardHTML).join('')+'</div>';
    }
    wrap.innerHTML = html;
  }

  var mask = document.getElementById('mask'), modal = document.getElementById('modal');
  function openModal(id){
    var a = A[id]; if(!a) return;
    var record = recordOf(a);
    var authors = a.authors.length ? a.authors.join('、') + (a.authorMore?' 等':'') : '未收录作者信息';
    modal.innerHTML =
      '<div class="mhead" style="background:linear-gradient(135deg,var(--'+a.tkey+'-a),var(--'+a.tkey+'-b))">'
      + '<button class="mclose" id="mclose" type="button">✕</button>'
      + '<div class="mj">'+esc(topicsOf(a).join(' / '))+' · '+esc(a.journal)+'</div>'
      + '<h3>'+esc(a.title)+'</h3>'
      + '<div class="mmeta">'
      +   '<span>'+esc(a.tierLabel)+'</span>'
      +   (a.score!=null?'<span>得分 '+a.score+'</span>':'')
      +   (a.pubdate?'<span>'+esc(a.pubdate)+'</span>':'')
      +   '<span>日报 '+esc(a.reportDate)+'</span>'
      + '</div></div>'
      + '<div class="mbody">'
      +   '<div class="sec-t">摘要</div>'
      +   (a.abstract
            ? '<p class="abs">'+esc(a.abstract)+'</p>'
            : '<p class="abs" style="color:#9d9da8">该条日报未收录摘要。</p>')
      +   '<div class="sec-t">作者</div><p class="authors">'+esc(authors)+'</p>'
      +   (a.doi ? '<div class="kv">DOI：<code>'+esc(a.doi)+'</code></div>' : '')
      +   (a.matchWhere ? '<div class="kv">关键词命中：'+esc(a.matchWhere)+'</div>' : '')
      +   '<div class="personal-actions">'
      +     '<button class="btn" id="mread" type="button">'+(record.read?'标为待读':'标记已读')+'</button>'
      +     '<button class="btn" id="msave" type="button">'+(record.saved?'取消收藏':'加入收藏')+'</button>'
      +     '<button class="btn" id="mris" type="button">下载 RIS</button>'
      +   '</div>'
      +   '<label class="note-label" for="mnote">我的笔记</label>'
      +   '<textarea class="note-input" id="mnote" placeholder="记录阅读要点">'+esc(record.note||'')+'</textarea>'
      +   '<div class="linkrow">'
      +     '<a class="btn pri" href="'+esc(a.url)+'" target="_blank" rel="noopener">打开原文 ↗</a>'
      +     (a.doi?'<a class="btn" href="https://doi.org/'+esc(a.doi)+'" target="_blank" rel="noopener">DOI 链接</a>':'')
      +     '<button class="btn" id="mcopy" type="button">复制 DOI</button>'
      +   '</div>'
      + '</div>';
    mask.classList.add('on');
    document.body.style.overflow = 'hidden';
    var cb = document.getElementById('mclose'); if(cb) cb.onclick = closeModal;
    var cp = document.getElementById('mcopy');
    if(cp) cp.onclick = function(){
      var txt = a.doi || a.url;
      var done = function(){ cp.textContent='已复制 ✓'; setTimeout(function(){ cp.textContent='复制 DOI'; },1400); };
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(txt).then(done, function(){ cp.textContent = txt; });
      } else { cp.textContent = txt; }
    };
    document.getElementById('mread').onclick = function(){
      updateRecord(a, {read:!recordOf(a).read});
      render(); openModal(id);
    };
    document.getElementById('msave').onclick = function(){
      updateRecord(a, {saved:!recordOf(a).saved});
      render(); openModal(id);
    };
    document.getElementById('mris').onclick = function(){ downloadRis(a); };
    document.getElementById('mnote').oninput = function(){ updateRecord(a, {note:this.value}); };
  }
  function closeModal(){ mask.classList.remove('on'); document.body.style.overflow=''; }
  mask.onclick = closeModal;
  document.addEventListener('keydown', function(e){ if(e.key==='Escape') closeModal(); });

  wrap.addEventListener('click', function(e){
    var c = e.target.closest('.card'); if(c) openModal(+c.dataset.id);
  });
  wrap.addEventListener('keydown', function(e){
    if(e.key==='Enter'){ var c = e.target.closest('.card'); if(c) openModal(+c.dataset.id); }
  });

  render();
})();
</script>
</body>
</html>
