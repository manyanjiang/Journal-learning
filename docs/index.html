<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>个人文献中心 · 文献卡片墙</title>
<style>
:root{
  --bg:#f1f2f4; --card:#fff; --ink:#1c1c1e; --ink2:#63636d; --ink3:#9d9da8;
  --line:#eeeef2; --red:#ff2442; --radius:16px;
  --sh:0 1px 2px rgba(16,16,24,.05), 0 6px 20px rgba(16,16,24,.06);
  --sh-hover:0 2px 6px rgba(16,16,24,.07), 0 14px 34px rgba(16,16,24,.12);
  --air-a:#ffb27a; --air-b:#ff5f7e;
  --rs-a:#63b3ff;  --rs-b:#3a5ce0;
  --chem-a:#c3a0ff; --chem-b:#7048e8;
  --bgc-a:#6ee0a8;  --bgc-b:#0b9e73;
  --ghg-a:#f7c95c;  --ghg-b:#b87300;
  --wx-a:#ff8494;   --wx-b:#c1121f;
  --gis-a:#5ed6c4;  --gis-b:#0d8f9e;
  --other-a:#c9ccd4; --other-b:#8b90a0;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility; padding-bottom:56px;
}
a{color:inherit;text-decoration:none}
svg.ic{display:block;flex:none}

.topbar{
  position:sticky; top:0; z-index:60; background:rgba(241,242,244,.84);
  backdrop-filter:saturate(180%) blur(16px); -webkit-backdrop-filter:saturate(180%) blur(16px);
  border-bottom:1px solid rgba(0,0,0,.05);
}
.topbar-in{max-width:1560px;margin:0 auto;padding:14px 22px 0}
.brand{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.logo{
  width:30px;height:30px;border-radius:9px;flex:none;
  background:linear-gradient(135deg,var(--red),#ff7a59);
  display:grid;place-items:center;color:#fff;font-weight:800;font-size:15px;
  box-shadow:0 3px 10px rgba(255,36,66,.32);
}
.brand h1{font-size:17px;margin:0;font-weight:800;letter-spacing:.2px}
.brand .sub{font-size:12.5px;color:var(--ink3);margin-left:2px}
.brand .spacer{flex:1}
.kpi{display:flex;gap:6px;flex-wrap:wrap}
.kpi span{font-size:12px;color:var(--ink2);background:#fff;border:1px solid var(--line);padding:3px 9px;border-radius:999px;white-space:nowrap}
.kpi b{color:var(--red);font-weight:700}

.controls{max-width:1560px;margin:0 auto;padding:12px 22px;display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{
  border:1px solid var(--line);background:#fff;color:var(--ink2);
  font-size:13.5px;font-weight:600;padding:7px 14px;border-radius:999px;cursor:pointer;
  white-space:nowrap;transition:.16s;display:flex;align-items:center;gap:7px;font-family:inherit;
}
.tab svg{width:15px;height:15px;stroke-width:1.9}
.tab:hover{border-color:#dcdce4;transform:translateY(-1px)}
.tab .n{font-size:11.5px;color:var(--ink3);font-weight:600}
.tab.on{background:var(--ink);border-color:var(--ink);color:#fff}
.tab.on .n{color:rgba(255,255,255,.66)}
.tab.on svg{stroke-width:2}
.search{
  flex:1;min-width:180px;max-width:340px;border:1px solid var(--line);background:#fff;border-radius:999px;
  padding:8px 15px;font-size:13.5px;outline:none;font-family:inherit;color:var(--ink);transition:.16s;
}
.search:focus{border-color:#ffc2cc;box-shadow:0 0 0 3px rgba(255,36,66,.09)}
.search::placeholder{color:var(--ink3)}
.seg{display:flex;background:#fff;border:1px solid var(--line);border-radius:999px;padding:2px}
.seg button{border:0;background:transparent;font-size:12.5px;padding:5px 12px;border-radius:999px;cursor:pointer;color:var(--ink2);font-family:inherit;transition:.16s}
.seg button.on{background:var(--ink);color:#fff;font-weight:600}
.count{font-size:12.5px;color:var(--ink3);margin-left:auto;white-space:nowrap}
.local-controls{justify-content:space-between}
.local-note{font-size:12px;color:var(--ink3)}

.grouphead{max-width:1560px;margin:24px auto 0;padding:0 22px;display:flex;align-items:center;gap:10px}
.grouphead h2{font-size:15.5px;margin:0;font-weight:800;display:flex;align-items:center;gap:8px}
.grouphead h2 svg{width:18px;height:18px;stroke-width:1.9}
.grouphead .bar{flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
.grouphead .gn{font-size:12.5px;color:var(--ink3);font-weight:600}
.g-air h2{color:#e8455f} .g-rs h2{color:#3a5ce0} .g-chem h2{color:#7048e8} .g-bgc h2{color:#0b9e73} .g-ghg h2{color:#b87300} .g-wx h2{color:#c1121f} .g-gis h2{color:#0d8f9e}

.wall{max-width:1560px;margin:0 auto;padding:14px 22px 0;columns:4;column-gap:16px}
@media(max-width:1380px){.wall{columns:3}}
@media(max-width:1000px){.wall{columns:2}}
@media(max-width:620px){
  .wall{columns:1}
  .topbar-in,.controls,.wall,.grouphead{padding-left:14px;padding-right:14px}
  .kpi{display:none}
}
.card{
  break-inside:avoid; -webkit-column-break-inside:avoid; page-break-inside:avoid;
  background:var(--card);border-radius:var(--radius);overflow:hidden;
  box-shadow:var(--sh);margin:0 0 16px;cursor:pointer;
  transition:transform .18s cubic-bezier(.2,.8,.2,1),box-shadow .18s;
  display:inline-block;width:100%;vertical-align:top;
}
.card:hover{transform:translateY(-3px);box-shadow:var(--sh-hover)}

.cover{position:relative;height:108px;overflow:hidden}
.cover::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background-image:radial-gradient(rgba(255,255,255,.3) 1px,transparent 1px);
  background-size:14px 14px;opacity:.45;
}
.t-air .cover{background:linear-gradient(135deg,var(--air-a),var(--air-b))}
.t-rs  .cover{background:linear-gradient(135deg,var(--rs-a),var(--rs-b))}
.t-chem .cover{background:linear-gradient(135deg,var(--chem-a),var(--chem-b))}
.t-bgc .cover{background:linear-gradient(135deg,var(--bgc-a),var(--bgc-b))}
.t-ghg .cover{background:linear-gradient(135deg,var(--ghg-a),var(--ghg-b))}
.t-wx .cover{background:linear-gradient(135deg,var(--wx-a),var(--wx-b))}
.t-gis .cover{background:linear-gradient(135deg,var(--gis-a),var(--gis-b))}
.t-other .cover{background:linear-gradient(135deg,var(--other-a),var(--other-b))}
.cover .icon{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:#fff;opacity:.28;width:76px;height:76px;z-index:1}
.cover .icon svg{width:100%;height:100%;stroke-width:1.25}
.cover .jr{
  position:absolute;left:12px;bottom:11px;right:60px;color:#fff;font-size:13px;font-weight:800;
  letter-spacing:.3px;text-shadow:0 1px 6px rgba(0,0,0,.25);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;z-index:2;
}
.cover .tp{
  position:absolute;left:12px;top:10px;background:rgba(255,255,255,.95);color:#2a2a30;
  font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;z-index:2;
  box-shadow:0 1px 4px rgba(0,0,0,.1);
}
.cover .sc{
  position:absolute;right:12px;top:10px;background:rgba(0,0,0,.28);color:#fff;font-size:11px;
  font-weight:700;padding:3px 9px;border-radius:999px;z-index:2;backdrop-filter:blur(4px);
  font-variant-numeric:tabular-nums;
}
.tier{position:absolute;left:0;bottom:0;height:3px;width:100%;z-index:2}
.tier.must_read{background:#ff2442}
.tier.worth_reading{background:#ffab2e}
.tier.other{background:rgba(255,255,255,.6)}

.body{padding:12px 14px 11px}
.title{font-size:14.5px;font-weight:700;line-height:1.42;margin:0 0 7px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.excerpt{font-size:12.5px;line-height:1.62;color:var(--ink2);margin:0;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.excerpt.none{color:var(--ink3);font-style:italic;font-size:12px;-webkit-line-clamp:2}
.translation{margin-top:9px;padding:8px 9px;border-left:2px solid #4d8c72;background:#f2f7f4;color:#385548}
.translation-label{font-size:10.5px;font-weight:800;color:#47755f;margin:0 0 4px}
.translation-title{font-size:12.5px;font-weight:700;line-height:1.5;margin:0 0 3px}
.translation-abstract{font-size:11.5px;line-height:1.55;margin:0;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.translation-pending{font-size:11px;color:var(--ink3);margin:0}
.tagrow{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.tag{font-size:11px;padding:2px 8px;border-radius:6px;background:#f4f5f7;color:var(--ink2);font-weight:600;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag.must_read{background:#ffe9ed;color:#e01b39}
.tag.worth_reading{background:#fff4e3;color:#c67a00}
.tag.other{background:#f0f1f4;color:#7c8090}
.tag.match{background:#eef4ff;color:#3a5ce0}
.tag.cross{background:#e6f7f5;color:#0d8f9e}
.tag.record{background:#edf7f1;color:#26734d}
.tag.saved{background:#fff3dc;color:#986400}

.foot{display:flex;align-items:center;gap:8px;padding:9px 14px;border-top:1px solid var(--line);background:#fcfcfd}
.av{width:22px;height:22px;border-radius:50%;flex:none;color:#fff;display:grid;place-items:center;font-size:11px;font-weight:800}
.t-air .av{background:linear-gradient(135deg,var(--air-a),var(--air-b))}
.t-rs .av{background:linear-gradient(135deg,var(--rs-a),var(--rs-b))}
.t-chem .av{background:linear-gradient(135deg,var(--chem-a),var(--chem-b))}
.t-bgc .av{background:linear-gradient(135deg,var(--bgc-a),var(--bgc-b))}
.t-ghg .av{background:linear-gradient(135deg,var(--ghg-a),var(--ghg-b))}
.t-wx .av{background:linear-gradient(135deg,var(--wx-a),var(--wx-b))}
.t-gis .av{background:linear-gradient(135deg,var(--gis-a),var(--gis-b))}
.t-other .av{background:linear-gradient(135deg,var(--other-a),var(--other-b))}
.au{font-size:12px;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.dt{font-size:11.5px;color:var(--ink3);white-space:nowrap;font-variant-numeric:tabular-nums}

.empty{max-width:1560px;margin:70px auto;text-align:center;color:var(--ink3);font-size:14px}
.empty svg{width:44px;height:44px;margin:0 auto 12px;stroke-width:1.5;opacity:.5;display:block}

.mask{position:fixed;inset:0;background:rgba(20,20,26,.5);z-index:100;display:none;align-items:center;justify-content:center;padding:24px;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.mask.on{display:flex;animation:fade .16s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{background:#fff;border-radius:20px;max-width:760px;width:100%;max-height:86vh;overflow:auto;box-shadow:0 24px 70px rgba(0,0,0,.3);animation:pop .2s cubic-bezier(.2,.9,.3,1.2)}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
.mhead{position:relative;padding:18px 22px 16px;color:#fff;overflow:hidden}
.mhead::after{content:"";position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(rgba(255,255,255,.26) 1px,transparent 1px);background-size:16px 16px;opacity:.4}
.mhead .mj{font-size:12.5px;font-weight:700;opacity:.95;position:relative;z-index:2;letter-spacing:.3px}
.mhead h3{font-size:18px;line-height:1.42;margin:8px 0 0;position:relative;z-index:2;font-weight:800;text-shadow:0 1px 8px rgba(0,0,0,.18);padding-right:26px}
.mmeta{display:flex;gap:8px;flex-wrap:wrap;position:relative;z-index:2;margin-top:11px}
.mmeta span{background:rgba(255,255,255,.95);color:#2a2a30;font-size:11.5px;font-weight:700;padding:3px 10px;border-radius:999px}
.mclose{position:absolute;right:14px;top:14px;z-index:3;border:0;cursor:pointer;width:30px;height:30px;border-radius:50%;background:rgba(0,0,0,.22);color:#fff;font-size:16px;line-height:1;display:grid;place-items:center;font-family:inherit}
.mclose:hover{background:rgba(0,0,0,.36)}
.mbody{padding:18px 22px 22px}
.sec-t{font-size:11.5px;font-weight:800;color:var(--ink3);letter-spacing:.8px;margin:0 0 8px}
.abs{font-size:14px;line-height:1.78;color:#33333a;margin:0 0 20px;white-space:pre-wrap}
.authors{font-size:13.5px;line-height:1.7;color:var(--ink2);margin:0 0 18px}
.kv{font-size:12.5px;color:var(--ink2);line-height:1.9;margin:0 0 18px}
.kv code{background:#f4f5f7;padding:2px 7px;border-radius:5px;font-size:12px;color:#3a3a44}
.linkrow{display:flex;gap:9px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;font-weight:700;padding:9px 17px;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer;font-family:inherit;transition:.16s}
.btn:hover{border-color:#d8d8e0;transform:translateY(-1px)}
.btn.pri{background:var(--red);border-color:var(--red);color:#fff;box-shadow:0 3px 12px rgba(255,36,66,.28)}
.btn.pri:hover{background:#f01a38}
.personal-actions{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 18px}
.note-label{display:block;font-size:12px;font-weight:700;color:var(--ink2);margin:0 0 7px}
.note-input{display:block;width:100%;min-height:96px;resize:vertical;border:1px solid var(--line);border-radius:8px;padding:10px 12px;font:inherit;font-size:13px;line-height:1.6;color:var(--ink);outline:none;margin-bottom:18px}
.note-input:focus{border-color:#a9c6bb;box-shadow:0 0 0 3px rgba(38,115,77,.08)}
</style>
</head>
<body>

  <div class="topbar-in">
    <div class="brand">
      <div class="logo">J</div>

      <div class="kpi">

      </div>
      <span class="local-note">阅读状态与笔记保存在此浏览器</span>
    </div>
  </div>
</div>

<div id="wall-wrap"></div>

<div class="mask" id="mask">
  <div class="modal" id="modal" onclick="event.stopPropagation()"></div>
</div>

gis","id":2,"titleZh":"","abstractZh":""},{"title":"Whither the climate movement (and what comes next)?","url":"https://iopscience.iop.org/article/10.1088/1748-9326/aeba02","doi":"10.1088/1748-9326/aeba02","journal":"Environmental Research Letters","jabbr":"ERL","pubdate":"2026-11-04","topic":"气候变化与极端天气","topics":["气候变化与极端天气"],"matchTerm":"climate change","matchWhere":"摘要：climate change","score":3,"authors":["Dana R Fisher"],"authorMore":false,"abstract":"Abstract Perspectives do not contain abstracts, excerpt from the perspective: In this perspective, I provide evidence about how the climate movement has redirected its efforts given the current “nonreceptive political and social environment” to maintain some level of continuity [7]. After presenting data about how the climate movement has shifted its focus, I consider what it will take to reinvigorate the movement so it can help motivated the changes we need to address the climate crisis. Since the US is the top historical contributor to climate change and has been home to a vibrant climate movement, I present data collected from activists in the US to provide empirical context","abstractTruncated":false,"tier":"other","tierLabel":"其他相关","reportDate":"2026-11-05","tkey":"wx","id":3,"titleZh":"","abstractZh":""},{"title":"Deep learning reveals severe shelterbelt degradation in eastern Ukraine due to the war","url":"https://iopscience.iop.org/article/10.1088/1748-9326/aebaa1","doi":"10.1088/1748-9326/aebaa1","journal":"Environmental Research Letters","jabbr":"ERL","pubdate":"2026-11-04","topic":"能源地理与全球空间布局","topics":["能源地理与全球空间布局"],"matchTerm":"spatially explicit","matchWhere":"摘要：spatially explicit","score":3,"authors":["Viktor Myroniuk","Yevhenii Khan","Oleksandr Sovakov","Maksym Matsala","Andrii Lashchenko","Anatolii Makarevych"],"authorMore":false,"abstract":"Abstract Russia’s full-scale invasion of Ukraine in February 2022 has caused extensive damage to forests, particularly in eastern and southern regions with sustained combat, where field shelterbelts have often been used as cover and subsequently heavily destroyed. This study presents a systematic region-scale assessment of pre-war shelterbelt area and war-related loss between 2021 and 2025 using 3 m PlanetScope imagery and deep learning. We evaluated three input datasets – monthly PlanetScope RGB mosaics, multiseasonal PlanetScope RGB stacks, and surface reflectance PlanetScope imagery – in combination with two semantic segmentation architectures: a convolutional U-Net with a ResNet-34 …","abstractTruncated":true,"tier":"other","tierLabel":"其他相关","reportDate":"2026-11-05","tkey":"gis","id":4,"titleZh":"","abstractZh":""},{"title":"Towards high-resolution forecasting of tropical deforestation with deep learning","url":"https://doi.org/10.1088/1748-9326/aebda8","doi":"10.1088/1748-9326/aebda8","journal":"Environmental Research Letters","jabbr":"ERL","pubdate":"2026-11-04","topic":"能源地理与全球空间布局","topics":["能源地理与全球空间布局"],"matchTerm":"spatially explicit","matchWhere":"摘要：spatially explicit","score":3,"authors":["Jan Pisl","Gencer Sumbul","Gaston Lenczner","Jan Dirk Wegner","Devis Tuia"],"authorMore":false,"abstract":"Abstract Reducing tropical deforestation effectively requires spatially explicit data on deforestation dynamics. While past deforestation is now detected and mapped with high accuracy, producing reliable future forecasts remains a challenge. We present a deep learning approach for high-resolution deforestation forecasting in the Brazilian Amazon. We train a spatio-temporal ConvLSTM model on past deforestation maps and other covariates. Our model achieves an F1 score of 0.47 when forecasting one year ahead, substantially improving over comparable prior work. For multi-year predictions, we obtain promising results within a 3-year horizon, while sensitivity to shifts in deforestation dynamics …","abstractTruncated":true,"tier":"other","tierLabel":"其他相关","reportDate":"2026-11-05","tkey":"gis","id":5,"titleZh":"","abstractZh":""},{"title":"Brazil’s data-driven plan for climate-resilient healthcare","url":"https://www.nature.com/articles/s41558-026-02779-7","doi":"10.1038/s41558-026-02779-7","journal":"Nature Climate Change","jabbr":"Nat Clim Chang","pubdate":"2026-11-03","topic":"气候变化与极端天气","topics":["气候变化与极端天气"],"matchTerm":"climate change","matchWhere":"摘要：climate change","score":3,"authors":["Lisa Palmer"],"authorMore":false,"abstract":"Nature Climate Change, Published online: 03 November 2026; doi:10.1038/s41558-026-02779-7 By integrating climate risk into health planning, Brazil is redesigning healthcare to withstand floods, heatwaves and other climate shocks.","abstractTruncated":false,"tier":"other","tierLabel":"其他相关","reportDate":"2026-11-05","tkey":"wx","id":6,"titleZh":"","abstractZh":""},{"title":"Time to drop the no-policy business-as-usual baselines","url":"https://www.nature.com/articles/s41558-026-02787-7","doi":"10.1038/s41558-026-02787-7","journal":"Nature Climate Change","jabbr":"Nat Clim Chang","pubdate":"2026-11-03","topic":"气候变化与极端天气","topics":["气候变化与极端天气"],"matchTerm":"climate change","matchWhere":"摘要：climate change","score":3,"authors":["Mel George","Anand Patwardhan"],"authorMore":false,"abstract":"Nature Climate Change, Published online: 03 November 2026; doi:10.1038/s41558-026-02787-7 Baseline construction shapes estimates of mitigation cost, ambition and progress, while no-policy counterfactuals could vary with choices about policy, technology and development. Rather than relying on one constructed baseline, assessments and related conclusions should be compared across plausible baselines.","abstractTruncated":false,"tier":"other","tierLabel":"其他相关","reportDate":"2026-11-05","tkey":"wx","id":7,"titleZh":"","abstractZh":""},{"title":"Copper-modified nickel membrane reactor for electrochemical hydrogenation in low-conductivity water","url":"https://doi.org/10.1038/s41467-026-78930-x","doi":"10.1038/s41467-026-78930-x","journal":"Nature Communications","jabbr":"Nat Commun","pubdate":"2026-11-03","topic":"生命周期与技术经济评价","topics":["生命周期与技术经济评价"],"matchTerm":"life-cycle analysis","matchWhere":"摘要：life-cycle analysis","score":3,"authors":["Weijian Duan","Zhiwei Feng","Jianan Gao","Bo Jiang","Li Tian","Yihui Zhu"],"authorMore":false,"abstract":"Electrochemical hydrogenation (ECH) for wastewater treatment is often limited by its reliance on high-conductivity media, restricting applications such as nitrate-contaminated groundwater remediation. Here we show that a copper-modified electrochemical nickel membrane reactor (Cu/eNMR) can remove nitrate from deionized water. For water containing 50 mg/L NO3−-N, Cu/eNMR achieves 90.5% nitrate removal at 5 mA/cm2 within 3 h, with an energy consumption of 0.139 kWh/g-N, compared with 12.8% removal and 8.6 kWh/g-N for a conventional reactor using the same cathode. Mechanistic analysis reveals that nitrate hydrogenation is enabled by direct electron transfer to the reaction chamber, coupled …","abstractTruncated":true,"tier":"other","tierLabel":"其他相关","reportDate":"2026-11-05","tkey":"other","id":8,"titleZh":"","abstractZh":""},{"title":"Fire risk to U.S. structures nearly triples by mid-century","url":"https://doi.org/10.1038/s41467-026-78904-z","doi":"10.1038/s41467-026-78904-z","journal":"Nature Communications","jabbr":"Nat Commun","pubdate":"2026-11-03","topic":"气候变化与极端天气","topics":["气候变化与极端天气"],"matchTerm":"climate change","matchWhere":"摘要：climate change","score":3,"authors":["Virginia Iglesias","William Riebsame Travis","E. Natasha Stavros","Jilmarie Stephens","Stefan Leyk","John Wardman"],"authorMore":false,"abstract":"Fire is a nationwide crisis, driven by climate change, land use, and continued development into fire-prone landscapes. As these processes blur the boundary between wildland fuels and the built environment, living with fire is becoming a reality for a growing number of communities. We reconstruct fire risk to structures from 1945-2023 and project its evolution through 2060 across the U.S. using high-resolution historical data on area burned, settlement patterns, and fire impacts. Under business-as-usual conditions with no adaptation, structural losses are projected to nearly triple nationwide, with 133,200–449,100 buildings expected to be damaged or destroyed by mid-century. The West remains …","abstractTruncated":true,"tier":"other","tierLabel":"其他相关","reportDate":"2026-11-05","tkey":"wx","id":9,"titleZh":"","abstractZh":""},{"title":"Climate-Driven Sink-to-Source Transitions for Microplastics in Terrestrial Systems","url":"https://doi.org/10.1021/acs.est.6c05158","doi":"10.1021/acs.est.6c05158","journal":"Environmental Science \u0026 Technology","jabbr":"ES\u0026T","pubdate":"2026-11-03","topic":"气候变化与极端天气","topics":["气候变化与极端天气"],"matchTerm":"climate change","matchWhere":"摘要：climate change","score":3,"authors":["Wenqing Zeng","Boya Li","Lijia Lu","Zhuoran Duan","Jingzhi Wang","Si Li"],"authorMore":false,"abstract":"Abstract Microplastics (MPs) are increasingly recognized as pervasive contaminants in terrestrial environments, where soils act as major dynamic reservoirs that retain particles but can also release them through hydrological, erosional, and atmospheric pathways. Climate change is altering the physical, hydrological, and biogeochemical controls that govern the MP retention-release balance. This review develops a climate-driven sink-to-source transition framework in which terrestrial systems shift episodically from retention-dominated to export-active states. We synthesize evidence that changes in freeze–thaw regimes and drought-rewetting reorganize pore networks and preferential flow; …","abstractTruncated":true,"tier":"other","tierLabel":"其他相关","reportDate":"2026-11-05","tkey":"wx","id":10,"titleZh":"","abstractZh":""},{"title":"Market-Average Data Can Misrepresent Supply Chain Environmental Impacts and Their Uncertainty","url":"https://doi.org/10.1021/acs.est.6c11530","doi":"10.1021/acs.est.6c11530","journal":"Environmental Science \u0026 Technology","jabbr":"ES\u0026T","pubdate":"2026-11-03","topic":"生命周期与技术经济评价","topics":["生命周期与技术经济评价"],"matchTerm":"life cycle assessment","matchWhere":"摘要：life cycle assessment","score":3,"authors":["Cormac P.J. Dineen","Rick Lupton","Stephen R. Allen"],"authorMore":false,"abstract":"Abstract Market-average data sets are often used in life cycle assessment and carbon accounting when the production route of a procured good is unknown. The uncertainty this introduces is commonly characterized using generic pedigree matrix factors, which do not reflect how variability across production geographies and technologies differs between goods. Here, we develop a hybrid method that combines pedigree matrix uncertainty characterization within individual production routes with market-share-weighted Monte Carlo sampling between known production routes to represent uncertainty about which route supplied the good. We compare it with conventional market-average uncertainty analysis for …","abstractTruncated":true,"tier":"other","tierLabel":"其他相关","reportDate":"2026-11-05","tkey":"other","id":11,"titleZh":"","abstractZh":""},{"title":"Biogeochemical Control Points for Mitigating Metal(loid) Risk in Rice under Global Change","url":"https://doi.org/10.1021/acs.est.6c07344","doi":"10.1021/acs.est.6c07344","journal":"Environmental Science \u0026 Technology","jabbr":"ES\u0026T","pubdate":"2026-11-03","topic":"气候变化与极端天气","topics":["气候变化与极端天气"],"matchTerm":"climate change","matchWhere":"摘要：climate change","score":3,"authors":["Angelia L. Seyfferth","Sean Fettrow","E. Marie Muehe","Liping Fang","Andreas A. Kappler","Scott E. Fendorf"],"authorMore":false,"abstract":"Abstract The uptake of arsenic (As), cadmium (Cd), and mercury (Hg) in rice is a global health concern. The variable biogeochemical processes that govern contamination risk, along with increased anthropogenic pressures, present significant obstacles to implementing mitigation strategies. This perspective highlights the biogeochemical processes governing the mobility and rice uptake of metal(loid)s across the soil-rice continuum and provides recent insights into mitigation strategies. An overview of anthropogenic stressors that may further exacerbate rice contamination, particularly climate change, is also provided. Finally, in the context of historical knowledge, we identify and discuss a …","abstractTruncated":true,"tier":"other","tierLabel":"其他相关","reportDate":"2026-11-05","tkey":"wx","id":12,"titleZh":"","abstractZh":""},{"title":"Constructing Prospective Multiregional Input-Output Tables via Scenario-Constrained Optimization for Future Environmental Footprint Assessment","url":"https://doi.org/10.1021/acs.est.6c10592","doi":"10.1021/acs.est.6c10592","journal":"Environmental Science \u0026 Technology","jabbr":"ES\u0026T","pubdate":"2026-11-03","topic":"综合评估模型（GCAM/IAM）（摘要：integrated assessment models）（摘要：）","topics":["综合评估模型（GCAM/IAM）（摘要：integrated assessment models）（摘要：）"],"matchTerm":"","matchWhere":"","score":3,"authors":["Sidi Peng","Vassilis Daioglou","Konstantin Stadler","Ramin Roshandel","Martin Brückner","Stephan Pfister"],"authorMore":false,"abstract":"Abstract Prospective multiregional input-output (MRIO) tables that integrate scenarios from integrated assessment models (IAMs) support forward-looking environmental footprint analysis, but the trade-off between historical structural fidelity and scenario compliance has not been quantified. We constructed 12 prospective MRIO tables from EXIOBASE 2019 and the IMAGE SSP2 scenario for 2035, including a Leontief-based projection and 11 optimization-based projections under different combinations of scenario constraints on GDP, value added, sector outputs, as well as energy and agriculture consumption. Among the constraints, those on energy and agriculture consumption were satisfied at the …","abstractTruncated":true,"tier":"other","tierLabel":"其他相关","reportDate":"2026-11-05","tkey":"other","id":13,"titleZh":"","abstractZh":""},{"title":"Increase of tropical cyclone-induced coastal flooding due to historical sea level rise","url":"https://iopscience.iop.org/article/10.1088/1748-9326/ae962b","doi":"10.1088/1748-9326/ae962b","journal":"Environmental Research Letters","jabbr":"ERL","pubdate":"2026-11-03","topic":"气候变化与极端天气","topics":["气候变化与极端天气"],"matchTerm":"flood","matchWhere":"摘要：flood","score":3,"authors":["Matthias Mengel","Inga Sauer","Christian Otto","Simon Treu","Lisa Novak and Katja Frieler"],"authorMore":false,"abstract":"Abstract Surges from tropical cyclones (TCs) cause significant damage in coastal areas. However, the contribution of historical sea level rise (SLR) to surge heights and thus the flooded areas has not been quantified on a global scale. Here, we use an open-source shallow water equation solver to estimate the impact of historical SLR on coastal flooding induced by all historical TCs with landfall from 1950 to 2025, according to the International Best Tracks Archive. We isolate the SLR effect through the comparison of factual simulations accounting for observed changes in sea level to counterfactual simulations without long term trends in sea levels. Results show that SLR has steadily …","abstractTruncated":true,"tier":"other","tierLabel":"其他相关","reportDate":"2026-11-05","tkey":"wx","id":14,"titleZh":"","abstractZh":""},{"title":"GEDI spaceborne lidar for protected areas monitoring","url":"https://iopscience.iop.org/article/10.1088/1748-9326/aea352","doi":"10.1088/1748-9326/aea352","journal":"Environmental Research Letters","jabbr":"ERL","pubdate":"2026-11-03","topic":"能源地理与全球空间布局","topics":["能源地理与全球空间布局"],"matchTerm":"geospatial","matchWhere":"摘要：geospatial","score":3,"authors":["Alexander Cotrina-Sanchez","Vitezslav Moudry","Gaia Vaglio Laurin","David Coomes","Issam Boukhris","Christopher R Hakkenberg"],"authorMore":false,"abstract":"Abstract Protected areas (PAs) are the cornerstone of global terrestrial biodiversity conservation, yet systematic, scalable assessment of their vegetation structural condition remains limited. NASA’s Global Ecosystem Dynamics Investigation (GEDI), a spaceborne full-waveform lidar mission, offers a unique opportunity to consistently quantify vegetation structure within PA boundaries at near-global scales. This review synthesises 45 peer-reviewed studies published between January 2018 and May 2026 that use GEDI to study PAs within 26 countries on five continents. Estimates of canopy height, canopy cover, and vertical structure from GEDI’s L2A and L2B products were most widely used. …","abstractTruncated":true,"tier":"other","tierLabel":"其他相关","reportDate":"2026-11-05","tkey":"gis","id":15,"titleZh":"","abstractZh":""},{"title":"Evaluating inter- and intra-regional air pollution inequalities in a decarbonized world","url":"https://iopscience.iop.org/article/10.1088/1748-9326/aea9ad","doi":"10.1088/1748-9326/aea9ad","journal":"Environmental Research Letters","jabbr":"ERL","pubdate":"2026-11-03","topic":"减排政策与能源战略","topics":["减排政策与能源战略"],"matchTerm":"climate policy","matchWhere":"摘要：climate policy","score":3,"authors":["Jon Sampedro","Clàudia Rodés-Bachs","Dirk-Jan Van de Ven","Cathryn Tonne","Claudio Belis","Sara Ciarlantini"],"authorMore":false,"abstract":"Abstract Ambient PM2.5 exposure remains a major global health challenge. While pollution has declined in developed economies, it has increased in developing regions, exacerbating cross-country inequalities. Within-country disparities have narrowed in some contexts but remain significant. This study assesses how these inequalities evolve under alternative decarbonization futures, co-designed with stakeholders and aligned with current climate policy. Using an integrated assessment and air quality modelling framework, we find that international inequality in mortality burden widens over time even as income inequality across countries narrows, and that a country’s emission contribution is only …","abstractTruncated":true,"tier":"other","tierLabel":"其他相关","reportDate":"2026-11-05","tkey":"ghg","id":16,"titleZh":"","abstractZh":""},{"title":"Delayed seasonal march of East Asian summer monsoonal rain belt during Heinrich Stadials","url":"https://doi.org/10.1088/1748-9326/aebcfb","doi":"10.1088/1748-9326/aebcfb","journal":"Environmental Research Letters","jabbr":"ERL","pubdate":"2026-11-03","topic":"气候变化与极端天气","topics":["气候变化与极端天气"],"matchTerm":"climate change","matchWhere":"摘要：climate change","score":3,"authors":["Jinzhe Zhang","Ting Wei","Chuncheng Guo","Qing You Yan"],"authorMore":false,"abstract":"Abstract The timing and duration of monsoon rainfall shape regional hydroclimate, yet their response to abrupt climate change remains poorly constrained. Here, we use 25-km-resolution climate simulations to investigate the seasonal migration of the East Asian summer monsoon rain belt during Heinrich Stadials, periods associated with collapsed Atlantic meridional overturning circulation (AMOC). We find that the rain belt migrated northward 18 days later than during interstadials. This delay kept the monsoon front longer over central China, prolonging early-summer rainfall despite an overall weaker monsoon. The delayed migration was linked to later northward advances of the western North …","abstractTruncated":true,"tier":"other","tierLabel":"其他相关","reportDate":"2026-11-05","tkey":"wx","id":17,"titleZh":"","abstractZh":""},{"title":"Recent Slowing Arctic‐Amplified Warming Drives an Unprecedented Water Recovery in the World's Most Voluminous Freshwater Lake","url":"https://agupubs.onlinelibrary.wiley.com/doi/10.1029/2026GL124400?af=R","doi":"10.1029/2026gl124400","journal":"Geophysical Research Letters","jabbr":"GRL","pubdate":"2026-11-03","topic":"气候变化与极端天气","topics":["气候变化与极端天气"],"matchTerm":"climate change","matchWhere":"摘要：climate change","score":3,"authors":["Shijie Wang","Zulfiyor Bakhtiyorov","Feng Chen","Jan Esper","Junhui Guo","Max C. A. Torbenson"],"authorMore":false,"abstract":"Abstract The Lake Baikal, containing one-fifth of Earth's unfrozen surface freshwater, faces increasing hydrological uncertainty under climate change. Its water balance depends on Selenga River inflow and Angara River outflow. We present a 343-year combined Selenga and Angara streamflow reconstruction using a tree-ring network to provide a multi-century hydroclimatic baseline. The reconstruction captures intermittent drying trends throughout the 20th century, including a ∼90% streamflow decline from high levels, consistent with long-term regional aridification. This trend has reversed sharply over the last decade showing a most sustained ∼80% increase. The recent hydrological recovery is …","abstractTruncated":true,"tier":"other","tierLabel":"其他相关","reportDate":"2026-11-05","tkey":"wx","id":18,"titleZh":"","abstractZh":""},{"title":"Environmental forcing, individual repeatability, and mother–daughter resemblance shape the phenology of a long-lived seabird","url":"https://doi.org/10.1073/pnas.2533000123","doi":"10.1073/pnas.2533000123","journal":"Proceedings of the National Academy of Sciences","jabbr":"PNAS","pubdate":"2026-11-02","topic":"气候变化与极端天气","topics":["气候变化与极端天气"],"matchTerm":"climate change","matchWhere":"摘要：climate change","score":3,"authors":["Sofia Bolumar Roda","José Mariano Igual","Andreu Rotger","Andrea Santangeli","Meritxell Genovart","Daniel Oró"],"authorMore":false,"abstract":"Climate change and variability push species to shift their distributions and phenology to track their climatic niche. Predicting population responses requires identifying the environmental cues that trigger reproduction, their fitness consequences, and the intrinsic factors that shape individual breeding decisions. In long-lived species with deferred breeding, extrinsic (environmental) and intrinsic (individual/maternal) factors may interact in shaping responses to environmental change, but direct empirical evidence remains scarce. We use 2065 breeding events collected over 22 y on a wide-ranging seabird, the Scopoli’s Shearwater. We quantify the effects on population mean laying date of a …","abstractTruncated":true,"tier":"other","tierLabel":"其他相关","reportDate":"2026-11-05","tkey":"wx","id":19,"titleZh":"","abstractZh":""},{"title":"Using high-frequency data to quantify how urban nature affects air temperature and energy consumption","url":"https://doi.org/10.1073/pnas.2619288123","doi":"10.1073/pnas.2619288123","journal":"Proceedings of the National Academy of Sciences","jabbr":"PNAS","pubdate":"2026-11-02","topic":"能源地理与全球空间布局","topics":["能源地理与全球空间布局"],"matchTerm":"spatially explicit","matchWhere":"摘要：spatially explicit","score":3,"authors":["Baolong Han","Tong Wu","Stephen Polasky","Zhengwu Cai","Xuelian Pan","Haoqi Wang"],"authorMore":false,"abstract":"Globally, cities account for 78% of energy consumption and 70~75% of greenhouse gas emissions. Using spatially explicit data on urban vegetation, water bodies, and buildings, combined with extensive daily observations of air temperature and electricity consumption for the subtropical megacity of Shenzhen, China, this study shows that urban nature contributes to urban cooling, reducing energy consumption and associated greenhouse gas emissions. We found that green and blue spaces in the city’s built-up area had a pronounced influence on air temperature, ranging from a cooling effect of 1.27 °C to a warming effect of 0.29 °C, with the cooling effect being dominant over the course of a year. …","abstractTruncated":true,"tier":"other","tierLabel":"其他相关","reportDate":"2026-11-05","tkey":"gis","id":20,"titleZh":"","abstractZh":""},{"title":"On-site, subannual climate records decouple Neolithic expansion from climate instability","url":"https://doi.org/10.1073/pnas.2607859123","doi":"10.1073/pnas.2607859123","journal":"Proceedings of the National Academy of Sciences","jabbr":"PNAS","pubdate":"2026-11-02","topic":"气候变化与极端天气","topics":["气候变化与极端天气"],"matchTerm":"climate change","matchWhere":"摘要：climate change","score":3,"authors":["Niklas Hausmann","Danai Theodoraki"],"authorMore":false,"abstract":"How the life of prehistoric people was influenced by climate change and extreme events often remains elusive. Finding appropriate spatiotemporal scales is the major challenge for studies with socioenvironmental questions. This challenge can be overcome by sourcing climatic information from archaeological sites, alongside traces of human agency. For instance, extreme cold-events have been proposed as causing a standstill in early farming expansion across the Mediterranean 8600-8000 years ago. However, there is no immediate (local/short-term) evidence of such events and how they might have influenced people's lives, nor have previous records been sufficiently resolved to test this robustly. …","abstractTruncated":true,"tier":"other","tierLabel":"其他相关","reportDate":"2026-11-05","tkey":"wx","id":21,"titleZh":"","abstractZh":""},{"title":"Rising temperatures, shifting population: Changes in children’s ambient heat exposure in China","url":"https://doi.org/10.1073/pnas.2615409123","doi":"10.1073/pnas.2615409123","journal":"Proceedings of the National Academy of Sciences","jabbr":"PNAS","pubdate":"2026-11-02","topic":"能源地理与全球空间布局","topics":["能源地理与全球空间布局"],"matchTerm":"geospatial","matchWhere":"摘要：geospatial","score":3,"authors":["Kai Feng","Marco M. Laghi","Jere Richard Behrman","Emily Carroll Hannum","Fan Wang"],"authorMore":false,"abstract":"The frequency and intensity of heat waves are increasing, but how these trends translate to changes in the ambient heat to which children are potentially exposed (hereafter, exposures) is not well established. One complicating factor is that it is not only extreme temperatures that change over time, but also the geospatial distribution of children. Another limitation in our understanding is that existing studies often summarize exposure as person-time accumulated above a temperature cutoff, a quantity that confounds the choice of cutoff, the duration of individual exposure, and the share of the population affected. Our study addresses these gaps by developing a double-dual-distributional …","abstractTruncated":true,"tier":"other","tierLabel":"其他相关","reportDate":"2026-11-05","tkey":"gis","id":22,"titleZh":"","abstractZh":""},{"title":"Genome-anchored foundation model embeddings improve molecular prediction from histology images","url":"https://doi.org/10.1038/s41467-026-78947-2","doi":"10.1038/s41467-026-78947-2","journal":"Nature Communications","jabbr":"Nat Commun","pubdate":"2026-11-02","topic":"能源地理与全球空间布局","topics":["能源地理与全球空间布局"],"matchTerm":"high-resolution spatial","matchWhere":"摘要：high-resolution spatial","score":3,"authors":["Cheng Jin","Fengtao Zhou","Yunfang Yu","Jiabo Ma","Yihui Wang","Yingxue Xu"],"authorMore":false,"abstract":"Precision oncology requires accurate molecular insights, yet obtaining these directly from genomics is costly and time-consuming for broad clinical use. Predicting complex molecular features and patient prognosis directly from routine whole-slide images (WSIs) remains a major challenge for current deep learning methods. Here we introduce PathLUPI, which uses transcriptomic privileged information during training to extract genome-anchored histological embeddings, enabling effective molecular prediction using only WSIs at inference. Through extensive evaluation across 49 molecular oncology tasks using 11,361 cases from 20 cohorts, PathLUPI demonstrates superior performance compared to …","abstractTruncated":true,"tier":"other","tierLabel":"其他相关","reportDate":"2026-11-05","tkey":"gis","id":23,"titleZh":"","abstractZh":""},{"title":"Environmental, circularity, and criticality assessment of end-of-life lithium-ion batteries: Implications for management strategies in Mexico","url":"https://doi.org/10.1016/j.jclepro.2026.149831","doi":"10.1016/j.jclepro.2026.149831","journal":"Journal of Cleaner Production","jabbr":"Journal of Cleaner Production","pubdate":"2026-11-01","topic":"生命周期与技术经济评价","topics":["生命周期与技术经济评价"],"matchTerm":"life cycle assessment","matchWhere":"摘要：life cycle assessment","score":3,"authors":["Hilda Andrea Román Barajas","Alejandro Padilla‐Rivera","Maribel Adriana Caballero Castrillo","Susana Suárez Paniagua"],"authorMore":false,"abstract":"Mexico's rapid growth in battery electric vehicle (BEV) adoption has not been accompanied by a regulatory framework for the end-of-life management of lithium-ion batteries (LIBs), creating environmental risks and limiting the recovery of strategic materials. This study evaluates four end-of-life management strategies for BEV LIBs in Mexico (controlled disposal, hydrometallurgical recycling, pyrometallurgical recycling, and repurposing) using an integrated framework that combines Life Cycle Assessment (LCA), the Material Circularity Indicator (MCI), and a criticality-weighted extension (MCI-c). The proposed MCI-c incorporates material criticality into the circularity assessment, allowing …","abstractTruncated":true,"tier":"other","tierLabel":"其他相关","reportDate":"2026-11-05","tkey":"other","id":24,"titleZh":"","abstractZh":""},{"title":"Evaluation‐Constrained Projections Reveal a Potentially Navigable Arctic by the 2030s","url":"https://doi.org/10.1029/2026gl123566","doi":"10.1029/2026gl123566","journal":"Geophysical Research Letters","jabbr":"GRL","pubdate":"2026-11-01","topic":"遥感","topics":["遥感"],"matchTerm":"satellite","matchWhere":"摘要：satellite","score":3,"authors":["Yu Zhang","Changxing Li","Huan Li","Changsheng Chen","Weizeng Shao","Wenyun Guo"],"authorMore":true,"abstract":"Abstract The rapid decline in Arctic sea ice thickness (SIT) is reshaping Arctic navigation prospects. However, large uncertainties in climate model skill hinder robust projections of future navigability. Here we evaluate SIT simulated by the CMIP6 using satellite, airborne, reanalysis, and in situ data sets across freezing and melting seasons. To better constrain projections, we develop two evaluation‐based model selection schemes. We introduce the climatological concept of a potentially navigable Arctic (PNA), defined as a state in which more than 80% of the Arctic Ocean north of 60°N exhibits SIT below 0.15 m, making most of the Arctic Ocean potentially navigable for vessels with no ice …","abstractTruncated":true,"tier":"other","tierLabel":"其他相关","reportDate":"2026-11-02","tkey":"other","id":25,"titleZh":"","abstractZh":""},{"title":"Model‐Data Comparison of Electron Energization Associated With Kinetic Alfvén Waves in the Near Earth Magnetotail","url":"https://doi.org/10.1029/2026gl124997","doi":"10.1029/2026gl124997","journal":"Geophysical Research Letters","jabbr":"GRL","pubdate":"2026-11-01","topic":"遥感","topics":["遥感"],"matchTerm":"satellite","matchWhere":"摘要：satellite","score":3,"authors":["A. J. Hull","P. A. Damiano","J. R. Johnson","C. C. Chaston"],"authorMore":false,"abstract":"Abstract A model‐data comparison between Gyrofluid‐Kinetic Electron simulations and MMS satellite observations of kinetic Alfvén waves (KAW) and associated electron energization in the near Earth magnetotail is presented. The observations reveal 10 keV electron beams embedded within intense KAW field‐aligned currents. When constrained by observed plasma and wave parameters, simulations reproduce consistent electron signatures, establishing, for the first time, a direct link between KAWs and the production of these highly energized electrons. Most of the wave Poynting flux gets transferred to the electrons well in advance of the undriven KAW perturbation's arrival at the simulation …","abstractTruncated":true,"tier":"other","tierLabel":"其他相关","reportDate":"2026-11-02","tkey":"other","id":26,"titleZh":"","abstractZh":""},{"title":"Toughening alkali-activated construction materials using nanocarbon composites from red mud-catalyzed plastic waste upcycling","url":"https://doi.org/10.1038/s41467-026-79066-8","doi":"10.1038/s41467-026-79066-8","journal":"Nature Communications","jabbr":"Nat Commun","pubdate":"2026-10-31","topic":"温室气体","topics":["温室气体"],"matchTerm":"carbon emissions","matchWhere":"摘要：carbon emissions","score":3,"authors":["Mingyue Yan","Huiyang Bi","Yifan Lu","Zhichun Huang","Chen Sun","Zhongjian Li"],"authorMore":true,"abstract":"Plastic waste accumulation and cement industry decarbonization demand cross-sectoral solutions, with disposal-challenged red mud (RM) offering an opportunity. We couple plastic pyrolysis with RM catalysis to co-produce H2 and binder-compatible carbon nanotubes (CNTs)/RM composites, which serve as nano-toughening additives in alkali-activated materials (AAMs). We explore effects of RM-to-plastic ratio, feedstock and RM type on H2 production, CNT yield and structure. At an optimal RM-to-PE ratio of 1:4, 21.0 mmol/gplastic H2 and 262 mg/gplastic CNTs are obtained. At 1 wt% CNT dosage, CNTs/RM composite enhances AAM compressive and flexural strengths by 33.1% and 54.3%, respectively, increasing … ✅ 数据源：24 本刊、68 条通道全部正常。","abstractTruncated":false,"tier":"other","tierLabel":"其他相关","reportDate":"2026-11-02","tkey":"other","id":27,"titleZh":"","abstractZh":""},{"title":"Enhancing feasibility of cost-optimal energy systems in surrogate-assisted design optimization","url":"https://doi.org/10.1016/j.apenergy.2026.129169","doi":"10.1016/j.apenergy.2026.129169","journal":"Applied Energy","jabbr":"Applied Energy","pubdate":"2026-10-31","topic":"综合评估模型（GCAM/IAM）（摘要：energy system model）（摘要：）","topics":["综合评估模型（GCAM/IAM）（摘要：energy system model）（摘要：）"],"matchTerm":"","matchWhere":"","score":3,"authors":["Boyung Jürgens","Konrad Reents","Nils Baumeister","Hagen Seele","Hendrik Schricker","Niklas V. von der Assen"],"authorMore":false,"abstract":"Energy system design optimization often incurs high computational cost, which limits applications such as uncertainty analysis and interactive decision support. Surrogate models reduce this cost by emulating expensive original models. In surrogate-assisted design optimization (SADO), an upper-level optimization algorithm searches over designs while surrogate models emulate operational optimizations to evaluate each design. Existing SADO studies rarely enforce feasibility, defined here as the ability of an energy system to satisfy all demand constraints.This study quantifies how the choice of a feasibility predictor influences the cost and feasibility of designs obtained from SADO applied to …","abstractTruncated":true,"tier":"other","tierLabel":"其他相关","reportDate":"2026-11-05","tkey":"other","id":28,"titleZh":"","abstractZh":""},{"title":"Coarse climate model grids underestimate coastal humid-heat extremes","url":"https://doi.org/10.1126/sciadv.ael4020","doi":"10.1126/sciadv.ael4020","journal":"Science Advances","jabbr":"Sci Adv","pubdate":"2026-10-30","topic":"能源地理与全球空间布局","topics":["能源地理与全球空间布局"],"matchTerm":"kilometer-scale","matchWhere":"摘要：kilometer-scale","score":3,"authors":["Cosimo Enrico Carniel","Jonathan Wille","Lukas Brunner","Diana Francis","Erich Markus Fischer"],"authorMore":false,"abstract":"Humid-heat extremes reach intensities close to the limit of human survivability around the Arabian Peninsula. Here, we analyze fully coupled kilometer-scale Icosahedral Nonhydrostatic (ICON) and Integrated Forecasting System-FinitevolumE Sea ice-Ocean Model (IFS-FESOM) simulations from the nextGEMS project, with original resolutions of around 9 kilometers, and compare them with station observations, ERA5, and CMIP6 projections. IFS-FESOM reproduces well the observed upper-tail wet-bulb temperature (TW) and lies near the high end of the CMIP6 distribution over coastal regions, while ICON simulates weaker extremes. Spatial smoothing suppresses localized coastal maxima, reducing daily-maximum …","abstractTruncated":true,"tier":"other","tierLabel":"其他相关","reportDate":"2026-11-05","tkey":"gis","id":29,"titleZh":"","abstractZh":""},{"title":"Decoupled ore and scrap trade networks constrain low-carbon metal supply","url":"https://doi.org/10.1088/1748-9326/aebbde","doi":"10.1088/1748-9326/aebbde","journal":"Environmental Research Letters","jabbr":"ERL","pubdate":"2026-10-30","topic":"能源转型与低碳技术","topics":["能源转型与低碳技术"],"matchTerm":"energy transition","matchWhere":"摘要：energy transition","score":3,"authors":["Xu Tian","Yuyao Mao","Yong Geng","David Mark taylor"],"authorMore":false,"abstract":"Abstract Global supply chains for critical metals such as aluminium and copper are increasingly exposed to sustainability and geopolitical risks under the pressure of energy transition. In this paper we compare primary (ore) and secondary (scrap) trade networks for the United States, European Union and China using multilayer network analysis. We focus on the years 2010-2023, a period that captures intensified demand for the two metals. Results identify a marked structural decoupling: around 40% of scrap-trading countries do not participate in ore trade. Further, while about 50% of ore trade links overlap with scrap networks, only some 10–15% of scrap connections overlap with ore trade. …","abstractTruncated":true,"tier":"other","tierLabel":"其他相关","reportDate":"2026-11-05","tkey":"air","id":30,"titleZh":"","abstractZh":""},{"title":"Feedbacks between natural climate solutions and plant invasions","url":"https://doi.org/10.1088/1748-9326/aeb0b9","doi":"10.1088/1748-9326/aeb0b9","journal":"Environmental Research Letters","jabbr":"ERL","pubdate":"2026-10-30","topic":"气候变化与极端天气","topics":["气候变化与极端天气"],"matchTerm":"climate mitigation","matchWhere":"摘要：climate mitigation","score":3,"authors":["Evelyn M Beaury","Jonathan M Levine"],"authorMore":false,"abstract":"Abstract Biological invasions and carbon sequestration guide many modern-day land management decisions. However, intersections between invasions and natural climate solutions (NCS)—actions to maintain or increase the land carbon sink—have not received adequate attention in either the invasion or climate mitigation literature. We therefore review how plant invasions affect NCS and vice versa, focusing on reductions in emissions and carbon removals associated with avoided habitat conversion, restoration, forest and cropland management, agroforestry, and optimal grazing. We find that plant invasions can interfere with rapid NCS implementation and reduce the durability of carbon storage in many …","abstractTruncated":true,"tier":"other","tierLabel":"其他相关","reportDate":"2026-11-05","tkey":"wx","id":31,"titleZh":"","abstractZh":""},{"title":"Skillful subseasonal-to-seasonal ensemble forecasting with a multi-sphere coupled probabilistic model","url":"https://doi.org/10.1038/s41612-026-01572-9","doi":"10.1038/s41612-026-01572-9","journal":"npj Climate and Atmospheric Science","jabbr":"npj Climate and Atmospheric Science","pubdate":"2026-10-30","topic":"气候变化与极端天气","topics":["气候变化与极端天气"],"matchTerm":"climate change","matchWhere":"摘要：climate change","score":3,"authors":["Bin Mu","Yuxuan Chen","Shijin Yuan","Bo Qin","Hao Guo"],"authorMore":false,"abstract":"Accurate subseasonal-to-seasonal (S2S) prediction is critical for disaster mitigation under accelerating climate change, yet remains challenging due to complex multi-sphere interactions and intrinsic atmospheric uncertainty. Here we present TianXing-S2S, a multi-sphere coupled probabilistic deep learning model for global S2S ensemble forecasting. TianXing-S2S first encodes diverse multi-sphere predictors into a compact latent space, then employs a diffusion model to generate daily ensemble forecasts. A novel coupling module based on optimal transport (OT) is incorporated in the denoiser to optimize the interactions between atmospheric and multi-sphere boundary conditions. Across key …","abstractTruncated":true,"tier":"other","tierLabel":"其他相关","reportDate":"2026-11-05","tkey":"wx","id":32,"titleZh":"","abstractZh":""},{"title":"Spatial coordination in the codevelopment of the human urogenital system during organogenesis","url":"https://www.science.org/doi/abs/10.1126/science.aee5093?af=R","doi":"10.1126/science.aee5093","journal":"Science","jabbr":"Science","pubdate":"2026-10-29","topic":"能源地理与全球空间布局","topics":["能源地理与全球空间布局"],"matchTerm":"high-resolution spatial","matchWhere":"摘要：high-resolution spatial","score":3,"authors":["Yifei Guo","Hui Cai","Duan Li","Pengcheng Ren","Lina Cui","Cuifang Hao"],"authorMore":true,"abstract":"The human urogenital system originates from a common embryonic domain, yet the mechanisms guiding its spatiotemporal coordination remain understudied. Here, we combined high-resolution spatial transcriptomics with single-cell multiomics to profile human embryos from Carnegie stages 15 to 23, capturing the codevelopmental dynamics of the urogenital system. We revealed mesonephros- and adrenal primordium-derived signals that promote gonadal specification and enable efficient in vitro generation of cells resembling early gonadal lineages. We also uncovered a possible mesonephric origin of gonadal supporting cells through rete testis or ovarii linking the mesonephros. Finally, we delineate …","abstractTruncated":true,"tier":"other","tierLabel":"其他相关","reportDate":"2026-11-05","tkey":"gis","id":33,"titleZh":"","abstractZh":""},{"title":"The global geography of threats to freshwater biodiversity","url":"https://www.science.org/doi/abs/10.1126/science.aeb7910?af=R","doi":"10.1126/science.aeb7910","journal":"Science","jabbr":"Science","pubdate":"2026-10-29","topic":"能源地理与全球空间布局","topics":["能源地理与全球空间布局"],"matchTerm":"spatially explicit","matchWhere":"摘要：spatially explicit","score":3,"authors":["Christophe Brabant","Laura J. Pollock","Jonas Geldmann","Mette Bendixen","Lise Comte","Harith M. Farooq"],"authorMore":false,"abstract":"Human activities are eroding biodiversity, especially in freshwater systems. Despite major advances in quantifying species vulnerability and threats, we still lack a crucial understanding of where threats are affecting freshwater species globally. Here, we produced a species-centered spatial assessment of threats, mapping the impact of 45 threats across 21,490 freshwater species of amphibians, fish, mammals, odonates, and reptiles. We found that species in highly developed and water-managed regions are strongly affected by multiple overlapping threats. Although threats vary across taxa and regions, increasing threat probabilities elevate extinction risk and population declines, with …","abstractTruncated":true,"tier":"other","tierLabel":"其他相关","reportDate":"2026-11-05","tkey":"gis","id":34,"titleZh":"","abstractZh":""},{"title":"Pesky Metals: Historical Perspective, Advances, and Challenges for Remediation of Problematic Metal Contaminants","url":"https://doi.org/10.1021/acs.est.6c08900","doi":"10.1021/acs.est.6c08900","journal":"Environmental Science \u0026 Technology","jabbr":"ES\u0026T","pubdate":"2026-10-29","topic":"气候变化与极端天气","topics":["气候变化与极端天气"],"matchTerm":"climate resilience","matchWhere":"摘要：climate resilience","score":3,"authors":["Peggy A. O’Day","Marc W. Beutel","D. Vlassopoulos"],"authorMore":false,"abstract":"Abstract Persistent and problematic toxic metal and metalloid pollutants (in particular, As, Hg, Pb, Cd, and Cr) have long been challenging and expensive remediation targets in contaminated surface and subsurface environments. Since the advent of environmental regulations and cleanup in the late 20th century, much progress has been made to address sites of legacy metal pollution and limit new contamination. Despite this, metal pollution remains a global problem, particularly in soils and sediments, with many large legacy sites inadequately remediated, metal contamination widespread in developed and developing nations, and new pollution occurring from informal and often illegal extraction …","abstractTruncated":true,"tier":"other","tierLabel":"其他相关","reportDate":"2026-11-05","tkey":"wx","id":35,"titleZh":"","abstractZh":""},{"title":"Spatial and sectoral water demand assessment for the African continent","url":"https://doi.org/10.1038/s41586-026-11199-8","doi":"10.1038/s41586-026-11199-8","journal":"Nature","jabbr":"Nature","pubdate":"2026-10-28","topic":"能源地理与全球空间布局","topics":["能源地理与全球空间布局"],"matchTerm":"high spatial resolution","matchWhere":"摘要：high spatial resolution","score":3,"authors":["Davy Vanham","Dahami Gunathilake","Bhawani Gunasekara","Seifu Tilahun","Youssef Brouziyne","Fasikaw A. Zimale"],"authorMore":false,"abstract":"Abstract Water demand is the volume of water required by a sector to satisfy its needs 1,2. Across Africa, these demands are frequently unmet 3, yet their spatial and sectoral distribution remains incompletely characterized, limiting informed water-management decisions 4. Here, we provide an Africa-wide estimate of water demand for 2020 across six sectors and multiple subsectors at high spatial resolution. Because the analysis integrates heterogeneous datasets and modelling assumptions, the resulting values should be interpreted as harmonized estimates rather than direct observations of realized water use. We estimate total annual water demand at 347 km 3, comprising 60 km 3 (17%) for …","abstractTruncated":true,"tier":"other","tierLabel":"其他相关","reportDate":"2026-11-05","tkey":"gis","id":36,"titleZh":"","abstractZh":""},{"title":"Closing the climate–economics communication gap","url":"https://www.nature.com/articles/s41558-026-02784-w","doi":"10.1038/s41558-026-02784-w","journal":"Nature Climate Change","jabbr":"Nat Clim Chang","pubdate":"2026-10-28","topic":"气候变化与极端天气","topics":["气候变化与极端天气"],"matchTerm":"climate change","matchWhere":"摘要：climate change","score":3,"authors":["S. C. Sherwood","M. Amiot","K. Schmedders","T. Thompson","J. Sillmann","P. Alexander"],"authorMore":false,"abstract":"Nature Climate Change, Published online: 28 October 2026; doi:10.1038/s41558-026-02784-w As the IPCC is in its seventh assessment cycle, bridging the gap between physical climate science and economics has become more urgent. Estimating climate damages requires a rigorous translation of physical hazards into economic losses, highlighting the need for better communication between the disciplines.","abstractTruncated":false,"tier":"other","tierLabel":"其他相关","reportDate":"2026-11-05","tkey":"wx","id":37,"titleZh":"","abstractZh":""},{"title":"Reversal of Antarctic Intermediate Water trends triggered by sea ice decline","url":"https://www.nature.com/articles/s41558-026-02758-y","doi":"10.1038/s41558-026-02758-y","journal":"Nature Climate Change","jabbr":"Nat Clim Chang","pubdate":"2026-10-28","topic":"气候变化与极端天气","topics":["气候变化与极端天气"],"matchTerm":"climate change","matchWhere":"摘要：climate change","score":3,"authors":["Kaushik Mishra","Bishakhdatta Gayen","Alberto C. Naveira Garabato"],"authorMore":false,"abstract":"Nature Climate Change, Published online: 28 October 2026; doi:10.1038/s41558-026-02758-y This work investigates the effect of the 2016 regime shift in Antarctic sea ice on Antarctic Intermediate Water (AAIW). The authors show that decreased sea ice and reduced freshwater subduction lead to saltier and denser AAIW, with implications for wide-scale water-mass properties.","abstractTruncated":false,"tier":"other","tierLabel":"其他相关","reportDate":"2026-11-05","tkey":"wx","id":38,"titleZh":"","abstractZh":""},{"title":"Observed sub-surface warming in Northern Eurasia (1963–2022)","url":"https://doi.org/10.1088/1748-9326/aeb0b8","doi":"10.1088/1748-9326/aeb0b8","journal":"Environmental Research Letters","jabbr":"ERL","pubdate":"2026-10-28","topic":"气候变化与极端天气","topics":["气候变化与极端天气"],"matchTerm":"climate change","matchWhere":"摘要：climate change","score":3,"authors":["Yeonjin Son","Jonghun Kam"],"authorMore":false,"abstract":"Abstract Long-term soil temperature changes in high-latitude regions have been reported mainly focusing on the near-surface air and sub-surface soil temperature because of limited observational data. This gap still obscures spatiotemporal changes and associated processes of vertical thermal changes at multiple soil layers over such climate-sensitive regions. This study investigates changes of soil temperature across Northern Eurasia utilizing monthly temperature data at seven soil depth layers over 1963–2022. This study examines the past trends in the three coarse soil depth levels (up to one, two, and three meters below the surface) across seasons. Results indicate diversity in vertical …","abstractTruncated":true,"tier":"other","tierLabel":"其他相关","reportDate":"2026-11-05","tkey":"wx","id":39,"titleZh":"","abstractZh":""},{"title":"Heterogeneous impacts of temperature extremes on climate attitudes and Green voting","url":"https://www.pnas.org/doi/abs/10.1073/pnas.2321153122?af=R","doi":"10.1073/pnas.2321153122","journal":"Proceedings of the National Academy of Sciences","jabbr":"PNAS","pubdate":"2026-10-26","topic":"气候变化与极端天气","topics":["气候变化与极端天气"],"matchTerm":"climate change","matchWhere":"摘要：climate change","score":3,"authors":[],"authorMore":false,"abstract":"Proceedings of the National Academy of Sciences, Volume 123, Issue 44, November 2026. SignificanceFirsthand encounters with temperature extremes resulting from climate change not only influence attitudes toward climate issues but also foster backing of political parties that advocate environmental policies. Social groups that initially...","abstractTruncated":false,"tier":"other","tierLabel":"其他相关","reportDate":"2026-11-05","tkey":"wx","id":40,"titleZh":"","abstractZh":""},{"title":"Adaptive dynamic planning method for electric vehicle charging stations considering active interaction with EV growth","url":"https://doi.org/10.1016/j.apenergy.2026.129084","doi":"10.1016/j.apenergy.2026.129084","journal":"Applied Energy","jabbr":"Applied Energy","pubdate":"2026-10-26","topic":"电力系统与风光资源","topics":["电力系统与风光资源"],"matchTerm":"power grid","matchWhere":"摘要：power grid","score":3,"authors":["Nan Yang","Wenbin Gan","Zijian Wang","Pengcheng Liang","Xiaoyu Dai","Edris Pouresmaeil"],"authorMore":false,"abstract":"Against the backdrop of rapid development in China's electric vehicle (EV) industry, the adequacy of charging infrastructure has emerged as a critical constraint. In this context, the exploration of economical and adaptable charging station (CS) planning methods is paramount. Therefore, this paper proposes an adaptive phased planning method for electric vehicle charging stations that considers transformation and expansion, based on system dynamics (SD) theory. The method explicitly accounts for the active interaction between EV ownership and planning results. Firstly, to reflect the interests of CSs, the power grid, and users, the division of phases as well as the transformation and …","abstractTruncated":true,"tier":"other","tierLabel":"其他相关","reportDate":"2026-11-05","tkey":"wx","id":41,"titleZh":"","abstractZh":""},{"title":"Optimisation of a grid-connected electrolyser: time-ahead dispatch and energy portfolio planning","url":"https://doi.org/10.1016/j.apenergy.2026.129153","doi":"10.1016/j.apenergy.2026.129153","journal":"Applied Energy","jabbr":"Applied Energy","pubdate":"2026-10-26","topic":"电力系统与风光资源","topics":["电力系统与风光资源"],"matchTerm":"variable renewable energy","matchWhere":"摘要：variable renewable energy","score":3,"authors":["Mostafa Rezaei","Evan MacA. Gray"],"authorMore":false,"abstract":"This study investigates short-term power dispatch optimisation and long-term energy capacity planning for a grid-connected water electrolysis system (WES). It explicitly accounts for key technical characteristics often overlooked in existing studies, including dynamic specific energy consumption (SEC; incorporating both stacks and balance of plant (BoP)), minimum load, ramping, and usage-based stack degradation. To enable computationally tractable optimisation without sacrificing these key technical aspects that introduce nonlinear dynamics, a two-step approach is adopted. First, nonlinear governing relationships (e.g., between input power and SEC) are derived using a detailed cell-level …","abstractTruncated":true,"tier":"other","tierLabel":"其他相关","reportDate":"2026-11-05","tkey":"wx","id":42,"titleZh":"","abstractZh":""},{"title":"AI-driven granular LCA for apparel: Quantifying product-specific GHG emissions for sustainable design and circularity","url":"https://doi.org/10.1016/j.jclepro.2026.149664","doi":"10.1016/j.jclepro.2026.149664","journal":"Journal of Cleaner Production","jabbr":"Journal of Cleaner Production","pubdate":"2026-10-26","topic":"生命周期与技术经济评价","topics":["生命周期与技术经济评价"],"matchTerm":"life cycle assessment","matchWhere":"摘要：life cycle assessment","score":3,"authors":["Dami Moon","Sumiaki Kusahata","Yoshihiro Kawahara"],"authorMore":false,"abstract":"Product-specific Life Cycle Assessment (LCA) for apparel is hindered by generalized data, failing to quantify unique environmental burdens crucial for sustainable production and consumption. This study addresses this challenge by proposing and validating an automated methodology using a Vision-Language Model (VLM) to extract product-specific details (e.g., fabric composition) from unstructured User-Generated Content (UGC) on consumer-to-consumer (C2C) platforms and subsequently calculate corresponding product-specific greenhouse gas (GHG) emissions. The study seeks to demonstrate the significance of AI-enabled product-specific information as a tool for deriving insights into sustainable …","abstractTruncated":true,"tier":"other","tierLabel":"其他相关","reportDate":"2026-11-05","tkey":"other","id":43,"titleZh":"","abstractZh":""},{"title":"Coupled sea-level and biodiversity dynamics during the Cambrian SPICE event","url":"https://doi.org/10.1038/s41467-026-78601-x","doi":"10.1038/s41467-026-78601-x","journal":"Nature Communications","jabbr":"Nat Commun","pubdate":"2026-10-24","topic":"生物地球化学","topics":["生物地球化学"],"matchTerm":"biogeochemical","matchWhere":"摘要：biogeochemical","score":3,"authors":["Meng Wang","Yukun Shi","Aihua Yang","Haotian Zhang","Xiaoyu Zhang","Yujing Wu"],"authorMore":true,"abstract":"The prominent Cambrian Steptoean Positive Carbon Isotope Excursion (SPICE) stands as one of Earth’s largest carbon cycle perturbations, marked by widespread marine anoxia, climatic upheaval, and biotic turnover, yet the complete extent and interplay of these environmental changes remain unclear. Here, we integrate high-resolution astrochronology, carbonate carbon isotope records from the North China Block and marine species richness to investigate sedimentary and biogeochemical responses during the SPICE interval. Time series analysis reveals a distinct ~2-million-year sedimentary rhythm that aligns with cycles in reconstructed sea-level fluctuations and biodiversity dynamics. We show that …","abstractTruncated":true,"tier":"other","tierLabel":"其他相关","reportDate":"2026-10-26","tkey":"other","id":44,"titleZh":"","abstractZh":""},{"title":"Mutualistic microbes linked to broader niches but reduced diversification","url":"https://doi.org/10.1038/s41467-026-79030-6","doi":"10.1038/s41467-026-79030-6","journal":"Nature Communications","jabbr":"Nat Commun","pubdate":"2026-10-24","topic":"极端天气","topics":["极端天气"],"matchTerm":"drought","matchWhere":"摘要：drought","score":3,"authors":["Eleanor Hay","Rosana Zenil‐Ferguson","Michelle E. Afkhami","Christopher A. Searcy"],"authorMore":false,"abstract":"Mutualistic interactions are widely hypothesized to broaden ecological niches and promote diversification, yet evidence for this relationship at macroevolutionary scales remains limited. Here, we investigate how fungal seed endophytes (Epichloë) influence niche breadth and diversification across over 100 species of the globally-distributed grass genus Poa. Combining global-scale climate, environmental, phylogenetic, and symbiosis data, we construct species distribution models for suites of symbiotic and non-symbiotic plant species, and use phylogenetic comparative methods to assess the influence of these symbionts on niche breadth, niche breadth evolution, and diversification. …","abstractTruncated":true,"tier":"other","tierLabel":"其他相关","reportDate":"2026-10-26","tkey":"other","id":45,"titleZh":"","abstractZh":""},{"title":"Impacts of Nuclear War on Human Health From Changed Surface Ultraviolet Radiation","url":"https://agupubs.onlinelibrary.wiley.com/doi/10.1029/2026EF009142?af=R","doi":"10.1029/2026ef009142","journal":"Earth's Future","jabbr":"Earth's Future","pubdate":"2026-10-24","topic":"空气污染","topics":["空气污染"],"matchTerm":"aerosol","matchWhere":"摘要：aerosol","score":3,"authors":["Shu Xu","Lili Xia","Alan Robock","Charles Bardeen","Simchan Yook","Sasha Madronich","Soko Setoguchi"],"authorMore":false,"abstract":"Abstract Climate model simulations indicate that surface ultraviolet (UV) radiation would change after soot injection into the stratosphere during a nuclear war, due to the competing effects of ozone depletion and aerosol attenuation. Using climate model simulations, we evaluate UV impacts under two scenarios: a regional India-Pakistan conflict producing 5 Tg of soot and a global U.S.-Russia war producing 150 Tg. UV enhancements due to ozone depletion substantially shorten safe outdoor exposure time, particularly for individuals with lighter skin types. Applying UV dose-response relationships to the year 2000 population data, without accounting for direct conflict mortality or …","abstractTruncated":true,"tier":"other","tierLabel":"其他相关","reportDate":"2026-10-26","tkey":"other","id":46,"titleZh":"","abstractZh":""},{"title":"Intensified human pressures threaten global mountain vertebrate biodiversity","url":"https://doi.org/10.1038/s41467-026-78392-1","doi":"10.1038/s41467-026-78392-1","journal":"Nature Communications","jabbr":"Nat Commun","pubdate":"2026-10-23","topic":"城市地理信息系统","topics":["城市地理信息系统"],"matchTerm":"land-use","matchWhere":"摘要：land-use","score":3,"authors":["Jianfeng Sun","Guangdong Li","Yue Cao","Ying Zhang","James E. M. Watson","Jianguo Liu"],"authorMore":false,"abstract":"Mountain ecosystems host rich biodiversity and often act as last refuges for species under growing human pressure. However, the extent and recent trajectory of anthropogenic impacts on global mountain biodiversity remain poorly understood. Here, we evaluate spatio-temporal changes in human pressure across 6717 mountain ranges worldwide from 2000 to 2020 and assess future exposure to anthropogenic pressures under three Shared Socioeconomic Pathways (SSPs). We show that more than 60% of mountain ranges are exposed to elevated human pressure and that intensification of human pressure between 2000 and 2020 is associated with the loss of 71.69 Mha of natural mountain habitat. Protected areas …","abstractTruncated":true,"tier":"other","tierLabel":"其他相关","reportDate":"2026-10-26","tkey":"other","id":47,"titleZh":"","abstractZh":""},{"title":"Building digital pregnancies from the single cell up","url":"https://www.science.org/doi/abs/10.1126/sciadv.aen0211?af=R","doi":"10.1126/sciadv.aen0211","journal":"Science Advances","jabbr":"Sci Adv","pubdate":"2026-10-21","topic":"城市地理信息系统","topics":["城市地理信息系统"],"matchTerm":"digital twins","matchWhere":"摘要：digital twins","score":3,"authors":["Adrienne K. Scott"],"authorMore":false,"abstract":"Single-cell digital twins connect in vitro drug screening studies with clinical outcomes, providing a new framework to evaluate therapies and advance precision medicine in pregnancy.","abstractTruncated":false,"tier":"other","tierLabel":"其他相关","reportDate":"2026-10-23","tkey":"other","id":48,"titleZh":"","abstractZh":""},{"title":"Single-cell–level digital twins for preterm birth prevention strategies","url":"https://www.science.org/doi/abs/10.1126/sciadv.aed2741?af=R","doi":"10.1126/sciadv.aed2741","journal":"Science Advances","jabbr":"Sci Adv","pubdate":"2026-10-21","topic":"城市地理信息系统","topics":["城市地理信息系统"],"matchTerm":"digital twin","matchWhere":"摘要：digital twin","score":3,"authors":["Jakob Einhaus","Peter Neidlinger","Olivier Fondeur","Masaki Sato","Sasha Anronikov","Kotaro Miyazaki"],"authorMore":true,"abstract":"Digital twin models can accelerate therapeutic development by enabling low-risk testing of candidate interventions. In preterm labor (PTL), a major pregnancy complication where clinical trials face ethical and financial barriers, digital twins are especially valuable for evaluating new therapies targeting immune dysfunctions driving PTL. Yet, current models lack single-cell resolution, limiting detection of cell type–specific mechanisms, off-target effects, and the design of personalized interventions. We present Simulated Immunome Modeling of Clinical Outcomes (SIMCO), a single-cell–level digital twin framework that models immunomodulatory treatment effects on the timing of labor using …","abstractTruncated":true,"tier":"other","tierLabel":"其他相关","reportDate":"2026-10-22","tkey":"other","id":49,"titleZh":"","abstractZh":""},{"title":"Global Cropland Efficiency-Stress Divide: Typological Diagnosis and Reconciling Pathways","url":"https://doi.org/10.1021/acs.est.6c07911","doi":"10.1021/acs.est.6c07911","journal":"Environmental Science \u0026 Technology","jabbr":"ES\u0026T","pubdate":"2026-10-21","topic":"城市地理信息系统","topics":["城市地理信息系统"],"matchTerm":"land use","matchWhere":"摘要：land use","score":3,"authors":["Tingyu Hu","Junnian Song","Wei Yang","Xian’en Wang"],"authorMore":false,"abstract":"Abstract Cropland underpins food security but faces mounting resource constraints and environmental pressures. Achieving sustainable agriculture hinges on advancing land use efficiency (LUE) and alleviating land ecological stress (LES). However, a typological framework characterizing LUE and LES remains lacking, hindering the distinction between technical efficiency and ecological sustainability in cropland use. Herein, we establish a coupled LUE-LES diagnostic framework by integrating the super-efficiency slack-based measure model with land ecological footprint accounting. This framework classifies regions into efficiency-stress typologies globally for 2011, 2015, 2019, and 2022, and …","abstractTruncated":true,"tier":"other","tierLabel":"其他相关","reportDate":"2026-10-22","tkey":"other","id":50,"titleZh":"","abstractZh":""},{"title":"Measuring renewable energy droughts – A standardized framework for quantifying the “Dunkelflaute”","url":"https://doi.org/10.1016/j.renene.2026.126607","doi":"10.1016/j.renene.2026.126607","journal":"Renewable Energy","jabbr":"Renewable Energy","pubdate":"2026-10-21","topic":"能源转型与低碳技术","topics":["能源转型与低碳技术"],"matchTerm":"energy transition","matchWhere":"摘要：energy transition","score":3,"authors":["Nora Elhaus","Natalia Luna-Jaspe","Maximilian Weitzer","Sven Anders","Jürgen Karl"],"authorMore":false,"abstract":"Securing the electricity supply during renewable energy droughts (German: Dunkelflauten) constitutes a major challenge to the process renewable energy transition. However, the lack of a consistent approach to measuring renewable energy droughts, or Dunkelflauten has limited our ability to understand the magnitude of the problem and develop specific policy recommendations. This study proposes a standardized approach to quantify renewable energy (RE) droughts in direct reference to the installed capacity and the overbuilding of renewable energies using the German renewable electricity market as a case in point. The analysis identifies annual, prolonged RE droughts lasting up to 11 days, …","abstractTruncated":true,"tier":"other","tierLabel":"其他相关","reportDate":"2026-11-05","tkey":"air","id":51,"titleZh":"","abstractZh":""},{"title":"Renewable energy and storage systems for net/nearly zero energy buildings integrating electric vehicles with correlated stochastic charging: Uncertainty-aware multi-objective optimization and dynamic analysis","url":"https://doi.org/10.1016/j.renene.2026.126608","doi":"10.1016/j.renene.2026.126608","journal":"Renewable Energy","jabbr":"Renewable Energy","pubdate":"2026-10-21","topic":"CO2减排与碳排放","topics":["CO2减排与碳排放"],"matchTerm":"carbon dioxide emission","matchWhere":"摘要：carbon dioxide emission","score":3,"authors":["Menglong Lu","Wanbin Dou","Yongjun Sun","Zhenjun Ma"],"authorMore":false,"abstract":"Integrating electric vehicles (EVs) with net/nearly zero energy buildings (NZEBs) is crucial for advancing sustainable, resilient, and low-carbon energy infrastructures. However, this integration introduces additional complexity and uncertainty due to the unpredictable nature of EV charging behaviors, which further complicates system design. This study proposes a multi-objective optimization approach for designing renewable energy systems (RESs) in NZEBs, accounting for stochastic EV charging behaviors and uncertainty correlations. By employing a multivariate copula model, this study effectively captured the dependence structures in EV charging events, preserving the inherent complexity and …","abstractTruncated":true,"tier":"other","tierLabel":"其他相关","reportDate":"2026-11-05","tkey":"ghg","id":52,"titleZh":"","abstractZh":""},{"title":"Systematic mapping of academic literature on REDD+ in Mexico: research gaps and ways forward","url":"https://doi.org/10.1088/1748-9326/aea870","doi":"10.1088/1748-9326/aea870","journal":"Environmental Research Letters","jabbr":"ERL","pubdate":"2026-10-21","topic":"能源地理与全球空间布局","topics":["能源地理与全球空间布局"],"matchTerm":"geographic distribution","matchWhere":"摘要：geographic distribution","score":3,"authors":["Jovanka Špirić","María Liliana Ávalos Rodríguez","Edgar Gregorio Leija Loredo"],"authorMore":false,"abstract":"Abstract Academic literature has extensively analyzed REDD+, with some studies criticizing its effectiveness, efficiency, and equity, and others proposing recommendations to improve implementation and outcomes. Mexico was among the pioneering countries in REDD+ implementation, introducing legislative reforms (2008), launching pilot initiatives (2011–2015), and publishing its national REDD+ strategy (2017). However, the country did not progress toward the performance-based payment phase as pla
