"id":207,"titleZh":"","abstractZh":""},{"title":"Human mobility-associated ambient PM2.5 differences and inequality in China","url":"https://doi.org/10.1088/1748-9326/aeb683","doi":"10.1088/1748-9326/aeb683","journal":"Environmental Research Letters","jabbr":"ERL","pubdate":"2026-10-20","topic":"空气污染","topics":["空气污染"],"matchTerm":"pm2.5","matchWhere":"标题：pm2.5","score":9,"authors":["Heming Bai","Minghuai Wang","Jing Wei","Steve Hung Lam Yim","Dasa Gu","Yang Cao"],"authorMore":false,"abstract":"Abstract Ambient PM2.5 conditions can differ between origins and destinations during both long-term migration and short-term population mobility, but the magnitude and heterogeneity of these differences remain unclear. Here we quantify migration- and mobility-associated differences in ambient PM2.5 concentrations in China using a nationally representative survey of ~170,000 internal migrants and daily inter-city mobility flows derived from Baidu location-based services. We further examine socioeconomic associations using linear regression model. Overall, the survey-weighted mean origin–destination PM2.5 difference was −3.29 μg m-3, and 57.15% of migrants moved to destinations with lower …","abstractTruncated":true,"tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-21","tkey":"other","id":208,"titleZh":"","abstractZh":""},{"title":"Analysis of the Potential Mediating Role of Plasma Proteins in the Association Between Air Pollution Exposure and Lung Cancer Risk Among Ever-Smokers","url":"https://doi.org/10.1021/acs.est.6c07407","doi":"10.1021/acs.est.6c07407","journal":"Environmental Science \u0026 Technology","jabbr":"ES\u0026T","pubdate":"2026-10-19","topic":"空气污染","topics":["空气污染"],"matchTerm":"air pollution","matchWhere":"标题：air pollution","score":9,"authors":["Ziyin Tang","Donghai Liang","Jeremy A. Sarnat","W. Ryan Diver","Todd M. Everson","Emily Deubler"],"authorMore":true,"abstract":"Abstract The biological mechanisms linking air pollution to lung carcinogenesis remain underexplored. This study aimed to identify key proteins and pathways involved in mediating the effects of air pollutants on lung cancer risk. We analyzed 95 matched lung cancer case–control pairs of ever-smokers with prediagnosis plasma protein profiles measured in the Cancer Prevention Study-II Nutrition Cohort. We assessed associations between protein levels and six individual air pollutants, air pollution mixture, and lung cancer risk, adjusting for confounders and multiple testing. We identified overlapping proteins and enriched pathways associated with both exposures and lung cancer risk, followed …","abstractTruncated":true,"tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-20","tkey":"other","id":209,"titleZh":"","abstractZh":""},{"title":"Associations of PM2.5 and Its Oxidative Potential with Childhood Allergy-Related Symptoms: A Cross-Sectional Study in Guangdong Province, China","url":"https://doi.org/10.1021/acs.est.6c05462","doi":"10.1021/acs.est.6c05462","journal":"Environmental Science \u0026 Technology","jabbr":"ES\u0026T","pubdate":"2026-10-19","topic":"空气污染","topics":["空气污染"],"matchTerm":"pm2.5","matchWhere":"标题：pm2.5","score":9,"authors":["Siqi Wang","Dan Cai","Jinshan Ge","Qian Yao","Xihua Lin","Yunhui Shao"],"authorMore":true,"abstract":"Abstract Evidence linking PM2.5 exposure to allergic symptoms remains limited and inconsistent, partly because most studies rely on mass-based metrics alone. We conducted a population-based study among 131,346 children aged 6–18 years in six cities of Guangdong, China, to compare associations of PM2.5 mass concentration, oxidative potential (OP), and chemical components (metals, carbonaceous components, and ions) with rhinitis, rhinoconjunctivitis, and eczema symptoms. OP was assessed using the dithiothreitol assay and expressed as volume-normalized (DTTv) and mass-normalized (DTTm) metrics. PM2.5 mass and OP were generally positively associated with the three allergy-related symptoms. OP, …","abstractTruncated":true,"tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-20","tkey":"other","id":210,"titleZh":"","abstractZh":""},{"title":"Regional Impacts of Unconventional Oil and Gas Operations on Ozone and Air Toxics","url":"https://doi.org/10.1021/acs.est.6c03632","doi":"10.1021/acs.est.6c03632","journal":"Environmental Science \u0026 Technology","jabbr":"ES\u0026T","pubdate":"2026-10-19","topic":"空气污染","topics":["空气污染"],"matchTerm":"ozone","matchWhere":"标题：ozone","score":9,"authors":["Yongtao Hu","Kamal Jyoti Maji","M. Talat Odman","Jennifer Kaiser","Armistead G. Russell"],"authorMore":false,"abstract":"Abstract Unconventional oil and gas development (UOGD) has expanded over the past three decades and now accounts for most of U.S. oil and natural gas production. Although prior studies link local UOGD activity to health outcomes, they provide limited evidence directly attributing ambient pollutant levels to UOGD emissions. We address this gap by quantifying UOGD impacts on ozone and air toxics using the Community Multiscale Air Quality (CMAQ) model with the Integrated Source Apportionment Method (ISAM), enabling an explicit linkage between UOGD emissions and ambient concentrations. UOGD activities produce substantial local contributions to primary air toxics and continental-scale influences …","abstractTruncated":true,"tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-20","tkey":"other","id":211,"titleZh":"","abstractZh":""},{"title":"Early Life Ambient Air Pollution, Sex Steroids and Neurodevelopment: Target Trial Emulation in a Prospective Cohort","url":"https://doi.org/10.1021/acs.est.6c09006","doi":"10.1021/acs.est.6c09006","journal":"Environmental Science \u0026 Technology","jabbr":"ES\u0026T","pubdate":"2026-10-17","topic":"空气污染","topics":["空气污染"],"matchTerm":"air pollution","matchWhere":"标题：air pollution","score":9,"authors":["Baiwen Ni","Zhongqiang Cao","Yanlong Li","Jing Wei","Yue Wu","Yuyan Wang"],"authorMore":true,"abstract":"Abstract Ambient air pollution may impair childhood neurodevelopment, but sensitive windows, mediating pathways, and the neurodevelopmental benefits of air-quality interventions remain unclear. In this prospective birth cohort of 3575 mother–child pairs in Wuhan, China (2014–2019), neurodevelopment at age two was assessed using the Bayley Scales, and cord serum sex steroids were measured in 897 pairs. Associations of air pollution exposure from preconception through the second postnatal year with neurodevelopment at age two and potential sex-steroid mediation were evaluated. Target trial emulation (TTE) was used to estimate neurodevelopmental differences associated with China’s 2013–2017 …","abstractTruncated":true,"tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-18","tkey":"other","id":212,"titleZh":"","abstractZh":""},{"title":"Satellite‐Based Estimates of Irrigation Water Use Versus Modeling Reconstructions: How Much do They Differ?","url":"https://agupubs.onlinelibrary.wiley.com/doi/10.1029/2025EF007572?af=R","doi":"10.1029/2025ef007572","journal":"Earth's Future","jabbr":"Earth's Future","pubdate":"2026-10-17","topic":"遥感","topics":["遥感"],"matchTerm":"satellite","matchWhere":"标题：satellite","score":9,"authors":["J. Dari","L. Brocca","P. Laluet","R. Morbidelli","C. Saltalippi","S. Modanesi","W. Dorigo","C. Albergel"],"authorMore":false,"abstract":"Abstract Knowing water amounts destined for agricultural practices, essentially consisting of irrigation water use (IWU), is essential for water resources management. Although explicit and consistent information on IWU is generally lacking worldwide, remote sensing and modeling platforms offer valuable solutions for estimating it. The objective of this work is to perform an intercomparison between satellite-based IWU products and modeling reconstructions over four main irrigation hotspots worldwide: the Contiguous United States (CONUS), the Ebro basin (Spain), India, and the Murray-Darling basin (Australia). Remote-sensing-based IWU estimated through Soil-Moisture-Inversion (SM-Inversion) …","abstractTruncated":true,"tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-19","tkey":"other","id":213,"titleZh":"","abstractZh":""},{"title":"Electrifying the factory and beyond: The impact of digital proximity on energy transition","url":"https://doi.org/10.1016/j.eneco.2026.109651","doi":"10.1016/j.eneco.2026.109651","journal":"Energy Economics","jabbr":"Energy Economics","pubdate":"2026-10-17","topic":"能源转型与低碳技术","topics":["能源转型与低碳技术"],"matchTerm":"energy transition","matchWhere":"标题：energy transition","score":9,"authors":["Yijia Song","Qinyi Huang","Jiaqi Chen","Xitao Li"],"authorMore":false,"abstract":"","abstractTruncated":false,"tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-11-05","tkey":"air","id":214,"titleZh":"","abstractZh":""},{"title":"Cold shocks in a warming world: Regional disparities in household climate adaptation and electricity demand","url":"https://doi.org/10.1016/j.eneco.2026.109656","doi":"10.1016/j.eneco.2026.109656","journal":"Energy Economics","jabbr":"Energy Economics","pubdate":"2026-10-17","topic":"气候变化与极端天气","topics":["气候变化与极端天气"],"matchTerm":"climate adaptation","matchWhere":"标题：climate adaptation","score":9,"authors":["Zihan He","Jiayang Shi","Qi Wang","Bing Zhang"],"authorMore":false,"abstract":"","abstractTruncated":false,"tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-11-05","tkey":"wx","id":215,"titleZh":"","abstractZh":""},{"title":"Political affiliation impacts climate attention and choice beyond extreme weather exposure","url":"https://doi.org/10.1038/s41558-026-02765-z","doi":"10.1038/s41558-026-02765-z","journal":"Nature Climate Change","jabbr":"Nat Clim Chang","pubdate":"2026-10-16","topic":"气候变化与极端天气","topics":["气候变化与极端天气"],"matchTerm":"extreme weather","matchWhere":"标题：extreme weather","score":9,"authors":["Annika M. Wyss","Emmanuel Guizar Rosales","Michael Schulte‐Mecklenbeck","Julie Buchs","Ulf J.J. Hahnel","Daria Knoch"],"authorMore":false,"abstract":"Abstract Political polarization and increasing exposure to extreme weather can shape public engagement with climate change, yet the underlying psychological mechanisms remain unclear. In this Registered Report, we examine how political affiliation, extreme weather exposure and subjective attribution influence climate-relevant information search and decision-making in a US sample (N = 1,451). We combined a process-tracing paradigm within an incentivized decision task involving real carbon emissions with objective data on extreme weather exposure. Democrats attended more to carbon emission information and made more pro-climate choices than Republicans, with no evidence of moderation by …","abstractTruncated":true,"tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-11-05","tkey":"wx","id":216,"titleZh":"","abstractZh":""},{"title":"Forcing closure suggests stronger aerosol forcing and higher climate sensitivity than the consensus","url":"https://www.science.org/doi/abs/10.1126/sciadv.aeh6401?af=R","doi":"10.1126/sciadv.aeh6401","journal":"Science Advances","jabbr":"Sci Adv","pubdate":"2026-10-16","topic":"空气污染","topics":["空气污染"],"matchTerm":"aerosol","matchWhere":"标题：aerosol","score":9,"authors":["Tianle Yuan","Hua Song","Senne Van Loon","Ryan Kramer","Lazaros Oreopoulos","Piers M. Forster"],"authorMore":false,"abstract":"Science Advances, Volume 12, Issue 42, October 2026.","abstractTruncated":false,"tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-17","tkey":"other","id":217,"titleZh":"","abstractZh":""},{"title":"A new pillar of climate policy? Stabilization, interventions, and solar radiation modification","url":"https://www.cell.com/one-earth/fulltext/S2590-3322(26","doi":"10.1016/j.oneear.2026.101868","journal":"One Earth","jabbr":"One Earth","pubdate":"2026-10-16","topic":"减排政策与能源战略","topics":["减排政策与能源战略"],"matchTerm":"climate policy","matchWhere":"标题：climate policy","score":9,"authors":["Joshua Horton","Peter Irvine"],"authorMore":false,"abstract":"Interest in the concept of “climate stabilization,” defined as using climate interventions like solar radiation modification (SRM) to stabilize key Earth system processes, is growing, with some proposing that stabilization be regarded as a new pillar of climate policy. We assess whether climate stabilization merits such promotion by considering climate interventions as building blocks of stabilization and evaluating the distinctiveness, coherence, and potential contributions of stabilization measures. We conclude that SRM, not climate stabilization, warrants treatment as a new pillar of climate policy.","abstractTruncated":false,"tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-11-05","tkey":"ghg","id":218,"titleZh":"","abstractZh":""},{"title":"Climate change impacts on global pest pressure and pesticide pollution","url":"https://www.cell.com/one-earth/fulltext/S2590-3322(26","doi":"10.1016/j.oneear.2026.101804","journal":"One Earth","jabbr":"One Earth","pubdate":"2026-10-16","topic":"气候变化与极端天气","topics":["气候变化与极端天气"],"matchTerm":"climate change","matchWhere":"标题：climate change","score":9,"authors":["Lu Wang","Jingcheng Yang","Lewis H. Ziska","Leo Posthuma","Yu Xiang","Peter Fantke"],"authorMore":true,"abstract":"Synthesizing evidence from over 250 studies, this study demonstrates that climate change intensifies pest pressure while reducing pesticide effectiveness, creating a compounding cycle likely to drive increased pesticide use worldwide. These findings highlight the urgent need for sustainable, climate-resilient pest management strategies to safeguard both food security and environmental health.","abstractTruncated":false,"tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-11-05","tkey":"wx","id":219,"titleZh":"","abstractZh":""},{"title":"Demand-side strategies unlock gigaton-scale GHG mitigation beyond supply-side limits in the global lithium-ion battery supply chain","url":"https://www.cell.com/one-earth/fulltext/S2590-3322(26","doi":"10.1016/j.oneear.2026.101863","journal":"One Earth","jabbr":"One Earth","pubdate":"2026-10-16","topic":"能源转型与低碳技术","topics":["能源转型与低碳技术","气候变化与极端天气","生命周期与技术经济评价"],"matchTerm":"energy transition","matchWhere":"摘要：energy transition、摘要：climate mitigation、摘要：life cycle assessment","score":9,"authors":["Haiwei Zhou","Wen Li","Peng Wang","Prakash J. Singh","Fanran Meng"],"authorMore":false,"abstract":"Lithium-ion batteries (LIBs) underpin the clean energy transition, yet their supply chains remain carbon-intensive and risk becoming a major source of greenhouse gas (GHG) emissions. Supply-side decarbonization is therefore crucial, but can it curb emissions fast enough as demand grows globally? Combining dynamic material flow analysis and life cycle assessment, we show that annual GHG emissions from the global LIB supply chain could rise more than 10-fold over 2024–2050. While supply-side strategies lower GHG intensity substantially, cutting cumulative emissions by 3.5–4.7 Gt CO₂ -eq, they face mitigation limits from technical ceilings, deployment dynamics, and cross-strategy …","abstractTruncated":true,"tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-11-05","tkey":"air","id":220,"titleZh":"","abstractZh":""},{"title":"Distinct Characteristics of Convectively Induced Turbulence (CIT) and Non‐CIT in the Western Pacific Using In Situ Aircraft Data and GK‐2A Satellite Data","url":"https://doi.org/10.1029/2026gl125211","doi":"10.1029/2026gl125211","journal":"Geophysical Research Letters","jabbr":"GRL","pubdate":"2026-10-16","topic":"遥感","topics":["遥感"],"matchTerm":"satellite","matchWhere":"标题：satellite","score":9,"authors":["Sung‐Ho Baek","Jung‐Hoon Kim","Yoo‐Jeong Noh","Sang‐Moo Lee","Daehyun Kim","Hye‐Yeong Chun"],"authorMore":false,"abstract":"Abstract This study introduces a newly defined turbulence patch that includes continuous turbulence reports of in situ aircraft data, separating at least 5‐min from others. This enables the individual turbulence patch to be characterized more easily by their possible sources than by an isolated data point. Using 5 years of satellite observations, we classified new turbulence patches into convectively induced turbulence (CIT) and non‐CIT. We also classified patches into long‐ and short‐duration events. Patch duration shows clear latitudinal differences, especially for CIT. CIT duration is linked to the size of underlying convective systems and strength of background winds. Signal analysis …","abstractTruncated":true,"tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-17","tkey":"other","id":221,"titleZh":"","abstractZh":""},{"title":"Combining climate policy instruments for a just transition to a climate-neutral economy","url":"https://doi.org/10.1038/s41558-026-02757-z","doi":"10.1038/s41558-026-02757-z","journal":"Nature Climate Change","jabbr":"Nat Clim Chang","pubdate":"2026-10-15","topic":"减排政策与能源战略","topics":["减排政策与能源战略"],"matchTerm":"climate policy","matchWhere":"标题：climate policy","score":9,"authors":[],"authorMore":false,"abstract":"","abstractTruncated":false,"tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-11-05","tkey":"ghg","id":222,"titleZh":"","abstractZh":""},{"title":"A Unified Quantitative Framework for Assessing Uncertainty in Microbial-Explicit Soil Carbon Models under Diverse Data Availability of Field Observations","url":"https://doi.org/10.1021/acs.est.6c01490","doi":"10.1021/acs.est.6c01490","journal":"Environmental Science \u0026 Technology","jabbr":"ES\u0026T","pubdate":"2026-10-15","topic":"生物地球化学","topics":["生物地球化学"],"matchTerm":"soil carbon","matchWhere":"标题：soil carbon","score":9,"authors":["Liang Dong","Rong Li","Yijin Lv","Zhifang Xiao","Qianting Ye","Chongxuan Liu"],"authorMore":true,"abstract":"Abstract Microbial-explicit soil carbon models offer mechanistic representations of soil carbon turnover, but their application to the field remains limited, which is commonly attributed to the scarce microbial observations. However, usually there are significant mismatches between model data requirements and the diverse data availability of field observations, which may greatly affect the uncertainty of soil carbon models and have been largely overlooked. Here, we developed a unified framework that systematically quantified how the field observation type, sampling frequency, and measurement uncertainty jointly constrained model parameters and long-term predictions of three representative …","abstractTruncated":true,"tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-16","tkey":"other","id":223,"titleZh":"","abstractZh":""},{"title":"Long-Term Biogeochemical Stabilization of Carbonate-Bearing Pb–Zn–Cu Mine Tailings by Amendment-Assisted Phytostabilization","url":"https://doi.org/10.1021/acs.est.6c08282","doi":"10.1021/acs.est.6c08282","journal":"Environmental Science \u0026 Technology","jabbr":"ES\u0026T","pubdate":"2026-10-15","topic":"生物地球化学","topics":["生物地球化学"],"matchTerm":"biogeochemical","matchWhere":"标题：biogeochemical","score":9,"authors":["Mariam Al-Lami","Genevieve Sutton","Kwame Awuah-Offei","Lana Alagha","Joel Burken"],"authorMore":false,"abstract":"Abstract Legacy Pb–Zn–Cu mine tailings can remain barren and geochemically reactive for decades. Although amendment-assisted revegetation can establish short-term plant growth, sustained phytostabilization requires metal attenuation and soil-like development over years after amendment-derived nutrients and organic matter decline. We evaluated seven-year biogeochemical stabilization of carbonate-bearing tailings planted with the native legume Dalea purpurea. Biosolids (BS), biochar (BC), and arbuscular mycorrhizal fungi (AMF) were incorporated into the upper 8 cm, while the underlying 12 cm remained unamended. Tailings pore water was monitored annually, and year-seven cores were analyzed by …","abstractTruncated":true,"tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-16","tkey":"other","id":224,"titleZh":"","abstractZh":""},{"title":"Geological CO2 storage and methane recovery in heterogeneous coal seams: Fractal descriptors for parameter upscaling","url":"https://doi.org/10.1016/j.rser.2026.117603","doi":"10.1016/j.rser.2026.117603","journal":"Renewable and Sustainable Energy Reviews","jabbr":"Renewable and Sustainable Energy Reviews","pubdate":"2026-10-15","topic":"CO2减排与碳排放","topics":["CO2减排与碳排放"],"matchTerm":"co2","matchWhere":"标题：co2","score":9,"authors":["Yulong Liu","Yanjun Zhang","Yuxiang Cheng","Xuefeng Gao","Guanhong Feng"],"authorMore":false,"abstract":"","abstractTruncated":false,"tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-11-05","tkey":"ghg","id":225,"titleZh":"","abstractZh":""},{"title":"Energy Transition in the Oil and Gas Sector: Decarbonization Strategies and Repurposing Infrastructure for a Net-Zero Future","url":"https://doi.org/10.1146/annurev-environ-121124-112814","doi":"10.1146/annurev-environ-121124-112814","journal":"Annual Review of Environment and Resources","jabbr":"Annu Rev Environ Resour","pubdate":"2026-10-15","topic":"能源转型与低碳技术","topics":["能源转型与低碳技术"],"matchTerm":"energy transition","matchWhere":"标题：energy transition","score":9,"authors":["Ingrid Lopes Motta","Elton Wagner Zobisch","Geltom Luís Vieira","Alessandra Brito Leal","Danielle Rodrigues Raimundo","Elisa da Costa Guida"],"authorMore":false,"abstract":"The oil and gas (O\u0026G) industry accounts for over half of global CO₂ emissions, requiring coordinated actions to align with the Net Zero Emissions scenario by 2050. Two major pathways emerge for O\u0026G companies: developing diversified energy portfolios that include renewable energy sources and decarbonizing residual O\u0026G operations. However, both strategies require, to varying degrees, the retrofitting of existing infrastructure and expertise. This critical review examines how the current O\u0026G framework can be repurposed to advance energy transition initiatives of O\u0026G companies, namely by developing renewable energy systems and reducing CO₂ emissions across upstream and downstream operations. …","abstractTruncated":true,"tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-11-05","tkey":"air","id":226,"titleZh":"","abstractZh":""},{"title":"Unsettling Energy Transitions: Toward a Critical, Anticapitalist, and Plural Perspective","url":"https://doi.org/10.1146/annurev-environ-121124-064238","doi":"10.1146/annurev-environ-121124-064238","journal":"Annual Review of Environment and Resources","jabbr":"Annu Rev Environ Resour","pubdate":"2026-10-15","topic":"能源转型与低碳技术","topics":["能源转型与低碳技术"],"matchTerm":"energy transitions","matchWhere":"标题：energy transitions","score":9,"authors":["Carlos Tornel","Alexander Dunlap","Joanna Allan","Chris Hesketh","Larry Lohmann"],"authorMore":false,"abstract":"This article examines the socioecological and justice implications of the rapid discursive global shift toward low-carbon infrastructures as a response to an accelerating civilizatory crisis. While the idea is to reduce fossil fuel dependence and mitigate this planetary crisis, evidence reveals that low-carbon technologies, or so-called renewable energy, are adding to, rather than replacing, existing fossil fuel–based energy systems. Furthermore, low-carbon technologies remain intertwined with fossil fuels, mining, and mineral extraction alongside extensive supply chains that disproportionately impact the Global South, where mineral and land use as well as environmental and social costs are …","abstractTruncated":true,"tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-11-05","tkey":"air","id":227,"titleZh":"","abstractZh":""},{"title":"Urban Informality and Climate Change: Precarity, Governance, and Pathways to Resilience","url":"https://doi.org/10.1146/annurev-environ-112624-023844","doi":"10.1146/annurev-environ-112624-023844","journal":"Annual Review of Environment and Resources","jabbr":"Annu Rev Environ Resour","pubdate":"2026-10-15","topic":"气候变化与极端天气","topics":["气候变化与极端天气"],"matchTerm":"climate change","matchWhere":"标题：climate change","score":9,"authors":["David Corbett","Pourya Salehi","Debra C. Roberts","Marcus Foth","Maryke van Staden","Aloke Barnwal"],"authorMore":false,"abstract":"Climate change is worsening long-standing inequalities for people living and working in cities’ informal systems, where exposure to heat, flooding, and other hazards intersects with insecure land rights, weak infrastructure, and unstable livelihoods. Using an informality-first approach, this review considers informal housing, economies, and governance not as leftover categories but as essential modes of urbanization and citizenship that define who is protected from climate risk. We review recent research on climate impacts, daily and community-based adaptation, and nature-based solutions in informal settings and combine this with long-standing debates on informality, marginality, and urban …","abstractTruncated":true,"tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-11-05","tkey":"wx","id":228,"titleZh":"","abstractZh":""},{"title":"Engineering Education for the Energy Transition: Shaping Up New Human Resources","url":"https://doi.org/10.1146/annurev-environ-112624-030640","doi":"10.1146/annurev-environ-112624-030640","journal":"Annual Review of Environment and Resources","jabbr":"Annu Rev Environ Resour","pubdate":"2026-10-15","topic":"能源转型与低碳技术","topics":["能源转型与低碳技术"],"matchTerm":"energy transition","matchWhere":"标题：energy transition","score":9,"authors":["Helder Queiroz Pinto","Fabio Oroski","Flavia Alves","Gilberto Jannuzzi","José Vitor Bomtempo","Marcelo Colomer"],"authorMore":false,"abstract":"This review focuses on the challenges of adapting engineering and economics training, seeking to integrate different tools related to energy transformation and transition. Academic training must incorporate multi- and interdisciplinary knowledge associated with energy transformation and transition issues, such as alternative non–fossil fuel raw materials, biofuels, and other fields based on climate sciences, engineering, economics, and environmental regulation. We highlight the main areas of knowledge so that new professionals can deal with the different dimensions—technological, economic, environmental, political, and institutional—associated with the goals of energy transformation and …","abstractTruncated":true,"tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-11-05","tkey":"air","id":229,"titleZh":"","abstractZh":""},{"title":"Rural Household Cooking Energy Transitions in the Global South: Toward Integrated User-Centered Cooking Energy Systems","url":"https://doi.org/10.1146/annurev-environ-121124-112837","doi":"10.1146/annurev-environ-121124-112837","journal":"Annual Review of Environment and Resources","jabbr":"Annu Rev Environ Resour","pubdate":"2026-10-15","topic":"能源转型与低碳技术","topics":["能源转型与低碳技术"],"matchTerm":"energy transitions","matchWhere":"标题：energy transitions","score":9,"authors":["Omar Raúl Masera","Victor Ruiz-García","Astrid Schilmann","Montserrat Serrano-Medrano","Luz Angélica de la Sierra-de la Vega"],"authorMore":false,"abstract":"Approximately 2.2 billion rural people in the Global South cook with solid biomass fuels. Despite decades of promoting the so-called clean fuels, the transition from biomass to these fuels in rural areas remains very limited. High fuel-price-to-income ratios, weak last-mile supply chains, single-fuel program designs, and strong culinary and cultural preferences limit exclusive use and lead to stacking with open fires. Drawing on representative rural household energy initiatives in the Global South, we conclude that systemic, integrated strategies—grounded in local cooking practices, designed to sustain long-term use, and enabling cleaner stacking across fuels and technologies, including …","abstractTruncated":true,"tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-11-05","tkey":"air","id":230,"titleZh":"","abstractZh":""},{"title":"Drought: Impacts, Prevention, and Adaptation Options Across Scales","url":"https://doi.org/10.1146/annurev-environ-121124-045547","doi":"10.1146/annurev-environ-121124-045547","journal":"Annual Review of Environment and Resources","jabbr":"Annu Rev Environ Resour","pubdate":"2026-10-15","topic":"气候变化与极端天气","topics":["气候变化与极端天气"],"matchTerm":"drought","matchWhere":"标题：drought","score":9,"authors":["Ermias Aynekulu","Gudeta W. Sileshi","Charles N. Wamucii","Mohamed Imam Bakarr","Ulrich Apel","Guadalupe Duron"],"authorMore":false,"abstract":"Beyond lack of water, drought means that expected levels of water availability are not realized, triggering cascading consequences across land, water, biodiversity, climate, and human systems. Drought reflects variation in water availability, including thresholds, frequency, intensity, duration, and spatial synchrony as well as how expectations and anticipation shape human actions. Drought symptoms are linked to local pressures and broader drivers of change and can induce social and ecological responses. This review synthesizes advances in understanding the biophysical and socioeconomic impacts of drought across temporal scales, from seasonal to multi-year and climatic drought, and across …","abstractTruncated":true,"tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-11-05","tkey":"wx","id":231,"titleZh":"","abstractZh":""},{"title":"Indicators for Assessing Urban Resilience to Climate Change","url":"https://doi.org/10.1146/annurev-environ-121124-015717","doi":"10.1146/annurev-environ-121124-015717","journal":"Annual Review of Environment and Resources","jabbr":"Annu Rev Environ Resour","pubdate":"2026-10-15","topic":"气候变化与极端天气","topics":["气候变化与极端天气"],"matchTerm":"climate change","matchWhere":"标题：climate change","score":9,"authors":["Ha Dinh Nghiem","Ayyoob Sharifi","Kamaleddin Aghaloo","Md. Nazmul Haque"],"authorMore":false,"abstract":"Cities face escalating climate risks, yet their resilience efforts remain fragmented and poorly measured. Our systematic review of 161 studies and 1,064 indicators provides a taxonomy of indicators and reveals critical gaps. While 96.6% of indicators are quantitative, nearly all lack time-bound targets, which are essential for tracking progress. More concerning, only one-third explicitly address climate change, with mitigation strategies underrepresented. Current indicators and assessment frameworks emphasize technical infrastructure while neglecting governance processes and equity considerations, both of which are vital to inclusive adaptation. Geographic disparities compound these …","abstractTruncated":true,"tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-11-05","tkey":"wx","id":232,"titleZh":"","abstractZh":""},{"title":"Citizens’ assemblies propose ambitious climate policy but impacts remain limited","url":"https://doi.org/10.1038/s41558-026-02755-1","doi":"10.1038/s41558-026-02755-1","journal":"Nature Climate Change","jabbr":"Nat Clim Chang","pubdate":"2026-10-14","topic":"减排政策与能源战略","topics":["减排政策与能源战略"],"matchTerm":"climate policy","matchWhere":"标题：climate policy","score":9,"authors":["J.T. Pfeffer","Hannah Einhauser","Johanna Hauke","Kira Hoffmann","Lisa Ruf","Milena Weber"],"authorMore":false,"abstract":"Abstract Climate citizens’ assemblies convene randomly selected citizens who, after structured learning and deliberation, develop policy recommendations. Yet, whether they produce more ambitious recommendations and influence political decisions remains contested. Here we conduct a comparative, counterfactual assessment of 488 recommendations from five national and one state-level assembly in Western Europe, drawing on document analysis and expert interviews. The results show that citizens consistently proposed more ambitious climate measures than existing government policy. Recommendations sometimes influenced policy by adding momentum, enriching plans, breaking deadlocks or introducing …","abstractTruncated":true,"tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-11-05","tkey":"ghg","id":233,"titleZh":"","abstractZh":""},{"title":"Species hybridization belongs on the climate change agenda","url":"https://doi.org/10.1038/s41558-026-02780-0","doi":"10.1038/s41558-026-02780-0","journal":"Nature Climate Change","jabbr":"Nat Clim Chang","pubdate":"2026-10-14","topic":"气候变化与极端天气","topics":["气候变化与极端天气"],"matchTerm":"climate change","matchWhere":"标题：climate change","score":9,"authors":["Isabel Marques"],"authorMore":false,"abstract":"","abstractTruncated":false,"tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-11-05","tkey":"wx","id":234,"titleZh":"","abstractZh":""},{"title":"Decadal Biochar Legacy Stabilizes Paddy Soil Carbon by Reshaping Redox-Driven Reactive Oxygen Species Dynamics","url":"https://doi.org/10.1021/acs.est.6c10422","doi":"10.1021/acs.est.6c10422","journal":"Environmental Science \u0026 Technology","jabbr":"ES\u0026T","pubdate":"2026-10-14","topic":"生物地球化学","topics":["生物地球化学"],"matchTerm":"soil carbon","matchWhere":"标题：soil carbon","score":9,"authors":["Wendan Luo","Yalan Chen","Zequn Liu","Hengyi Fu","Mengmeng Zhao","Shishu Zhu"],"authorMore":true,"abstract":"Abstract Biochar (BC) displays great potential in stabilizing soil organic carbon, yet its decadal legacy for carbon preservation under redox oscillations remains unclear. The study comprehensively investigated how decadal BC (D-BC) application restrained carbon mineralization of paddy soil via reshaping reactive oxygen species (ROS) dynamics. In situ fluorescence imaging and quantification results showed that D-BC soil inhibited hydroxyl radical (•OH) generation by 22.3% than fresh BC (F-BC) input soil, but elevating hydrogen peroxide (H2O2) and superoxide (O2•–) accumulation by 36.2% and 25.4% during redox oscillation, respectively. This resulted from its weakened microbial iron reduction …","abstractTruncated":true,"tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-15","tkey":"other","id":235,"titleZh":"","abstractZh":""},{"title":"Microbially Mediated Soil Carbon Sequestration Under Long‐Term Increased Snow Cover: Divergent Mechanisms Between Topsoil and Subsoil in a Temperate Grassland","url":"https://agupubs.onlinelibrary.wiley.com/doi/10.1029/2025EF007819?af=R","doi":"10.1029/2025ef007819","journal":"Earth's Future","jabbr":"Earth's Future","pubdate":"2026-10-14","topic":"生物地球化学","topics":["生物地球化学"],"matchTerm":"soil carbon","matchWhere":"标题：soil carbon","score":9,"authors":["Linna Ma","Chunyue Yao","Zhiyong Li","Na Li","Jinchao Feng","Jinan Gao","Qilimuge","Jincan Ma","Xiaofeng Xu","Yunhai Zhang"],"authorMore":false,"abstract":"Abstract Climate-driven changes in winter snow cover alter soil microclimate and hydrology, affecting soil organic carbon (SOC) dynamics, whereas the mechanisms by which long-term deepened snow influences SOC sequestration across soil profiles remain unclear. Through a 7-year snow manipulation experiment in a temperate grassland, we investigated how increased snow depth (ambient, 50, 70, 90 cm) affects SOC sequestration via microbial-mediated pathways in topsoil and subsoil. Our results showed that long-term increased snow significantly promoted total SOC accumulation by 6% (50 cm), 12% (70 cm), and 15% (90 cm) relative to ambient conditions across soil profile (0–70 cm). Increased snow did …","abstractTruncated":true,"tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-16","tkey":"other","id":236,"titleZh":"","abstractZh":""},{"title":"Reductions in Climate Zone Changes Under Stratospheric Aerosol Injection Compared to Unabated Warming","url":"https://agupubs.onlinelibrary.wiley.com/doi/10.1029/2026EF008937?af=R","doi":"10.1029/2026ef008937","journal":"Earth's Future","jabbr":"Earth's Future","pubdate":"2026-10-14","topic":"空气污染","topics":["空气污染"],"matchTerm":"aerosol","matchWhere":"标题：aerosol","score":9,"authors":["Jaylynn M. Brunelli","Michael S. Diamond"],"authorMore":false,"abstract":"Abstract As the goals of the Paris Agreement struggle to be met, interest in stratospheric aerosol injection (SAI) has increased due to its potential to reduce the impacts of anthropogenic warming. SAI would aim to cool the Earth by injecting sulfate aerosols or their precursors into the stratosphere, reflecting incoming sunlight back to space. Previous work has shown that SAI could produce regionally varying temperature and precipitation impacts, however, along with global mean drying. Climate classification systems serve as a potentially useful tool in quantifying how concerning these impacts may be. We evaluate the effectiveness of SAI by identifying the types and magnitude of climate …","abstractTruncated":true,"tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-16","tkey":"other","id":237,"titleZh":"","abstractZh":""},{"title":"Quasi‐Homologous Solar Flares and Impacts on Thermospheric Density and Satellite Orbital Drag","url":"https://doi.org/10.1029/2026gl125768","doi":"10.1029/2026gl125768","journal":"Geophysical Research Letters","jabbr":"GRL","pubdate":"2026-10-14","topic":"遥感","topics":["遥感"],"matchTerm":"satellite","matchWhere":"标题：satellite","score":9,"authors":["S. Tulasi Ram","Princy K. Dubey","S. Mondal","Denny M. Oliveira","Jayashree Bulusu","Chinmaya Nayak"],"authorMore":true,"abstract":"Abstract Quasi‐Homologous Flaring (QHF) activity from active regions on the Sun releases intense electromagnetic radiation in recurrent bursts over extended periods. In this letter, we present the effects of recurrent impulsive extreme ultraviolet (EUV) heating on thermospheric neutral density and the resulting atmospheric drag on satellites based on Swarm‐A measurements. Significant density enhancements up to 25%–30% and 50%–75% sustained for a few days, on both day and night sides, were observed at ∼460 km altitudes during QHF from AR4366 (February 2026) and AR3664 (May 2024), respectively. As a result, Swarm‐A orbital decay rate is increased from 79.43 to 96.28 m/day, and from 19.91 to …","abstractTruncated":true,"tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-15","tkey":"other","id":238,"titleZh":"","abstractZh":""},{"title":"Determining soil microbial responses to climate change with multi-omics","url":"https://doi.org/10.1038/s43017-026-00845-4","doi":"10.1038/s43017-026-00845-4","journal":"Nature Reviews Earth \u0026 Environment","jabbr":"Nature Reviews Earth \u0026 Environment","pubdate":"2026-10-13","topic":"气候变化与极端天气","topics":["气候变化与极端天气"],"matchTerm":"climate change","matchWhere":"标题：climate change","score":9,"authors":["Zongzhi Wu"],"authorMore":false,"abstract":"","abstractTruncated":false,"tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-11-05","tkey":"wx","id":239,"titleZh":"","abstractZh":""},{"title":"In situ bauxite residue catalysis enables profitable mixed plastic waste upcycling into carbon nanotubes for net-negative emission cement","url":"https://www.cell.com/one-earth/fulltext/S2590-3322(26","doi":"10.1016/j.oneear.2026.101867","journal":"One Earth","jabbr":"One Earth","pubdate":"2026-10-13","topic":"CDR碳移除与负排放","topics":["CDR碳移除与负排放"],"matchTerm":"negative emission","matchWhere":"标题：negative emission","score":9,"authors":["Mingyue Yan","Yingna Jia","Huiyang Bi","Chen Sun","Zhongjian Li","Yang Hou"],"authorMore":true,"abstract":"Plastic waste, bauxite residue, and carbon-intensive cement production are major sustainability challenges. The addressing of these issues is often siloed. Here, we use bauxite residue as an in situ catalyst to upcycle mixed plastic wastes into carbon-nanotube-containing cement additives, avoiding costly catalyst synthesis and product separation, resulting in net-negative life-cycle emissions (−5.3 ∼ −6.8 t/tplastic) and profits (ca. $169.1/tplastic) for cement production. This process offers a viable and sustainable circular route toward waste-to-construction materials.","abstractTruncated":false,"tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-11-05","tkey":"bgc","id":240,"titleZh":"","abstractZh":""},{"title":"Catalyst or Bystander? Disentangling True Catalytic Effects from Confounding Phenomena in Ozone-Based Wastewater Treatment","url":"https://doi.org/10.1021/acs.est.6c10819","doi":"10.1021/acs.est.6c10819","journal":"Environmental Science \u0026 Technology","jabbr":"ES\u0026T","pubdate":"2026-10-13","topic":"空气污染","topics":["空气污染"],"matchTerm":"ozone","matchWhere":"标题：ozone","score":9,"authors":["Shikha Garg","T. David Waite"],"authorMore":false,"abstract":"Abstract Heterogeneous catalytic ozonation has generated thousands of publications over two decades, with these publications articulating a consistent narrative: catalysts enhance ozone decomposition, generate hydroxyl radicals (or other reactive species), and improve contaminant removal beyond that achievable by use of ozone alone. Despite this narrative, performance gains demonstrated at laboratory scale are routinely inconsistent and poorly reproduced at pilot and industrial scale. This perspective argues that the field suffers from a systematic attribution problem with observed enhancements frequently misattributed to catalytic activity when, instead, they arise from gas–liquid mass …","abstractTruncated":true,"tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-14","tkey":"other","id":241,"titleZh":"","abstractZh":""},{"title":"Seawall‐Induced Isolation Alters Hydrological‐Biogeochemical Conditions in Coastal Wetlands","url":"https://doi.org/10.1029/2026gl125301","doi":"10.1029/2026gl125301","journal":"Geophysical Research Letters","jabbr":"GRL","pubdate":"2026-10-13","topic":"生物地球化学","topics":["生物地球化学"],"matchTerm":"biogeochemical","matchWhere":"标题：biogeochemical","score":9,"authors":["Bingnan Zhao","Zhijun Dai","Xixing Liang","Wensheng Zhang","Fangbing Xu","Xuefei Mei"],"authorMore":true,"abstract":"Abstract Coastal wetlands are increasi "abstractTruncated":true,"tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-04","tkey":"other","id":268,"titleZh":"","abstractZh":""},{"title":"Sustainable Management of Global Platinum Group Resources in the Energy Transition: A Group Metabolism Perspective","url":"https://doi.org/10.1029/2026ef009070","doi":"10.1029/2026ef009070","journal":"Earth's Future","jabbr":"Earth's Future","pubdate":"2026-10-01","topic":"能源转型与低碳技术","topics":["能源转型与低碳技术"],"matchTerm":"energy transition","matchWhere":"标题：energy transition","score":9,"authors":["Wang Gu","Jinze Li","Yue Xu","Peixue Xing","Ziyan Gao","Yong Geng"],"authorMore":false,"abstract":"Abstract As the transition toward carbon neutrality accelerates, platinum group metals (PGMs) have emerged as indispensable resources for the low‐carbon transformation. However, the supply of this PGM supply chain is very concentrated, with 99% of primary production coming from South Africa and Russia. This study employs dynamic material flow analysis (MFA) to quantify the global metabolism of five PGMs (Pt, Pd, Rh, Ir, Ru) across five major regions from 2011 to 2025. A significant spatiotemporal mismatch was identified, with demand centers shifting toward East Asia, North America, and Europe where Pd and Rh shares reached 81.00% and 88.47% respectively. The global in‐use stocks of Pt and …","abstractTruncated":true,"tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-11-05","tkey":"air","id":269,"titleZh":"","abstractZh":""},{"title":"Climate Change Increases Water Scarcity Risks and Adaptation Needs in China","url":"https://doi.org/10.1029/2025ef007712","doi":"10.1029/2025ef007712","journal":"Earth's Future","jabbr":"Earth's Future","pubdate":"2026-10-01","topic":"气候变化与极端天气","topics":["气候变化与极端天气"],"matchTerm":"climate change","matchWhere":"标题：climate change","score":9,"authors":["Yuqian Zhang","Yunhe Yin","Mijia Yin","Xuezheng Zong"],"authorMore":false,"abstract":"Abstract Increasing droughts are exacerbating the i he roles of moisture, melting level and updraft kinematics","url":"https://doi.org/10.1038/s41612-026-01519-0","doi":"10.1038/s41612-026-01519-0","journal":"npj Climate and Atmospheric Science","jabbr":"npj Climate and Atmospheric Science","pubdate":"2026-09-07","topic":"气候变化与极端天气","topics":["气候变化与极端天气"],"matchTerm":"climate change","matchWhere":"标题：climate change","score":9,"authors":["Jannick Fischer","Matthew R. Kumjian","Yuzhu Lin","Kelly A. Lombardo"],"authorMore":false,"abstract":"Abstract Large hail is expected to become more frequent under climate change. However, uncertainties remain because storm dynamics and hail formation are imperfectly captured by environmental hail proxies and in convection-permitting models, which are the two most frequently used approaches. We address this using a nonspherical hail-trajectory model in an ensemble of 171 idealized cloud model simulations. Melting level, cloud water, updraft intensity, and updraft width are varied independently. The results largely confirm previous work: rising melting levels (+3-K warming) reduce hail size spectra via enhanced melting and shorter residence times, but increased cloud water dominates, …","abstractTruncated":true,"tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-11-05","tkey":"wx","id":301,"titleZh":"","abstractZh":""},{"title":"Techno-economic and environmental assessment of next-generation battery-powered farming robots","url":"https://doi.org/10.1038/s41467-026-78281-7","doi":"10.1038/s41467-026-78281-7","journal":"Nature Communications","jabbr":"Nat Commun","pubdate":"2026-11-02","topic":"城市与环境空间建模","topics":["城市与环境空间建模","生命周期与技术经济评价"],"matchTerm":"environmental assessment","matchWhere":"标题：environmental assessment、摘要：life cycle assessment","score":12,"authors":["Simon Schlehuber","Moritz Gutsch","Luca Stegemann","Thomas P. Hendrickson","Stephan von Delft"],"authorMore":false,"abstract":"Decarbonizing agriculture without compromising productivity is a major challenge under rising input costs and labor scarcity. Autonomous battery-powered agricultural robots (ABARs) could help by reducing dependence on conventional machinery and enabling more precise application of inputs, but their system-level economic and environmental performance remains unclear. Here, we integrate total cost of ownership and life cycle assessment to evaluate a small ABAR for cradle-to-farm-gate crop production of strawberries, onions, lettuce, and peanuts under organic and non-organic management. Across modeled scenarios, benchmarked costs range from 76% below to 17% above literature-based reference …","abstractTruncated":true,"tier":"must_read","tierLabel":"必读","reportDate":"2026-11-05","tkey":"gis","id":302,"titleZh":"","abstractZh":""},{"title":"Modeling Decadal Organosulfates in Particulate Matter to Improve Estimations of Aerosol Hygroscopicity in the United States","url":"https://doi.org/10.1021/acs.est.6c08752","doi":"10.1021/acs.est.6c08752","journal":"Environmental Science \u0026 Technology","jabbr":"ES\u0026T","pubdate":"2026-11-02","topic":"空气污染","topics":["空气污染","大气化学"],"matchTerm":"particulate matter","matchWhere":"标题：particulate matter、摘要：secondary organic aerosol","score":12,"authors":["Alan R. Gonzalez","Heewon Yim","Kyle P. McCary","Xiangxinyue Meng","Ajith Thenoor Chandran","Yue Zhang"],"authorMore":true,"abstract":"Abstract Organosulfates (OSs) can comprise a substantial fraction of secondary organic aerosol and exhibit significantly different hygroscopicity than inorganic sulfates, yet their spatiotemporal prevalence and climatic impacts remain poorly constrained because speciated measurements are sparse and common chemical transport models do not explicitly represent OS formation. This study develops a flexible and robust modeling framework to quantify isoprene-derived OS (iOS) concentrations and OS impacts on aerosol hygroscopicity (κ) across the contiguous United States (U.S.) for summers spanning 2013–2022. Using the Community Multiscale Air Quality (CMAQ) model with updated iOS chemistry, …","abstractTruncated":true,"tier":"must_read","tierLabel":"必读","reportDate":"2026-11-03","tkey":"other","id":303,"titleZh":"","abstractZh":""},{"title":"Environmental and economic assessment of olefin synthesis from waste as an emerging alternative to conventional light olefin production routes","url":"https://doi.org/10.1016/j.jclepro.2026.149793","doi":"10.1016/j.jclepro.2026.149793","journal":"Journal of Cleaner Production","jabbr":"Journal of Cleaner Production","pubdate":"2026-11-01","topic":"气候变化与极端天气","topics":["气候变化与极端天气","生命周期与技术经济评价"],"matchTerm":"climate change","matchWhere":"摘要：climate change、标题：economic assessment","score":12,"authors":["Semra Bakkaloglu","Aurora Cavaliere","Andrea Paulillo","Massimiliano Materazzi","Nilay Shah"],"authorMore":false,"abstract":"Light olefins such as ethylene and propylene are essential petrochemical intermediates but remain highly energy- and carbon-intensive to produce using conventional fossil-based technologies. We conduct the life-cycle environmental and economic assessment (LCA/LCC) of seven olefin production pathways, such as coal-based, natural gas-based, shale gas-based, crude oil-based, bio-based, waste-to-olefins and waste-to-olefins with sorption-enhanced olefin synthesis, to understand trade-offs and identify decarbonisation opportunities. A cradle-to-gate LCA employs nine EF 3.1 midpoint indicators, using foreground data from industrial sources, Aspen Plus V14 modelling, and ecoinvent v3.10 …","abstractTruncated":true,"tier":"must_read","tierLabel":"必读","reportDate":"2026-11-05","tkey":"wx","id":304,"titleZh":"","abstractZh":""},{"title":"Assessment of carbon emissions and life cycle cost in railway infrastructure: comparison between steel slag ballast and natural aggregate","url":"https://doi.org/10.1016/j.jclepro.2026.149789","doi":"10.1016/j.jclepro.2026.149789","journal":"Journal of Cleaner Production","jabbr":"Journal of Cleaner Production","pubdate":"2026-10-31","topic":"城市与环境空间建模","topics":["城市与环境空间建模","生命周期与技术经济评价"],"matchTerm":"environmental assessment","matchWhere":"摘要：environmental assessment、标题：life cycle cost","score":12,"authors":["Katrine Setfânia Couto","Laura Coura Soranço","Edna Possan","Kathleen Dall Bello de Souza Risson","Geraldo Luciano de Oliveira Marques","Júlia Castro Mendes"],"authorMore":false,"abstract":"This paper evaluates the use of steel slag aggregates (SSA) as ballast for railways, from environmental and financial perspectives. The environmental assessment employs the Life Cycle Assessment (LCA) methodology framework to compare steel slag ballast (SSB) with natural aggregate ballast. The study focuses on the Global Warming Potential (GWP) impact category (also known as carbon footprint), measured in kg of CO₂ equivalent. The study considers a functional unit of 1 km of railway track over an 8-year reference service period, from a case study in the Southeast region of Brazil. The CO₂ uptake through the natural carbonation of the SSA was obtained through thermogravimetric analysis, …","abstractTruncated":true,"tier":"must_read","tierLabel":"必读","reportDate":"2026-11-05","tkey":"gis","id":305,"titleZh":"","abstractZh":""},{"title":"Elevated CO2 mitigated warming-enhanced carbon loss from northern peatland","url":"https://www.science.org/doi/abs/10.1126/sciadv.aek1491?af=R","doi":"10.1126/sciadv.aek1491","journal":"Science Advances","jabbr":"Sci Adv","pubdate":"2026-10-30","topic":"生物地球化学","topics":["生物地球化学","温室气体"],"matchTerm":"methane","matchWhere":"摘要：methane、标题：co2","score":12,"authors":["Jian Zhou","Quan Quan","Wenjuan Huang","Paul J. Hanson","Daniel Ricciuto","Melanie A. Mayes"],"authorMore":true,"abstract":"Peatlands store one-third of the global soil carbon (C) on only ∼3% of Earth’s land surface but risk becoming C sources to accelerate climate change due to warming-induced C loss. Elevated CO₂ (eCO₂) may mitigate this loss by boosting plant C uptake. However, how eCO₂ and climate warming interact to influence peatland C dynamics remains unclear. Here, we investigated peatland C fate at five warming levels (+0°, +2.25°, +4.5°, +6.75°, and + 9°C), each under ambient CO₂ (aCO₂) and eCO₂ (+500 parts per million), by model-guided synthesis of 18 measured variables for each of the 10 treatments from an experiment. Our results showed that the peatland C loss increased with warming at a …","abstractTruncated":true,"tier":"must_read","tierLabel":"必读","reportDate":"2026-10-31","tkey":"other","id":306,"titleZh":"","abstractZh":""},{"title":"Unraveling the Differentiated Roles of Reactive Chlorine in Regulating Atmospheric Oxidation and Secondary Formation","url":"https://doi.org/10.1021/acs.est.6c06457","doi":"10.1021/acs.est.6c06457","journal":"Environmental Science \u0026 Technology","jabbr":"ES\u0026T","pubdate":"2026-10-30","topic":"空气污染","topics":["空气污染","大气化学"],"matchTerm":"air quality","matchWhere":"摘要：air quality、标题：atmospheric oxidation","score":12,"authors":["Gaojie Chen","Yunning Ren","Xiaolong Fan","Yunxiang Zhang","Xiaoting Ji","Ziyi Lin"],"authorMore":true,"abstract":"Abstract Reactive chlorine species significantly perturb atmospheric oxidation, yet systematic observations of multiple chlorine species and comprehensive assessments of their distinct photochemical roles remain limited. Here, we present concurrent field measurements of four reactive chlorine species (ClNO2, Cl2, HOCl, and NCl3) in a coastal urban atmosphere. Cl2 photolysis dominated Cl• production (40.2%), whereas HOCl photolysis served as a dual source of Cl• and OH•, a mechanism previously overlooked, and most effectively elevated ROx• levels. Temporally, ClNO2 photolysis enhanced early morning oxidation, Cl2 prevailed around noon, and HOCl dominated the afternoon radical budgets, while …","abstractTruncated":true,"tier":"must_read","tierLabel":"必读","reportDate":"2026-10-31","tkey":"other","id":307,"titleZh":"","abstractZh":""},{"title":"Characterizing drinking-water facility exposure to historical wildfires in Northern Colorado","url":"https://doi.org/10.1088/1748-9326/aebb4c","doi":"10.1088/1748-9326/aebb4c","journal":"Environmental Research Letters","jabbr":"ERL","pubdate":"2026-10-29","topic":"空气污染","topics":["空气污染","极端天气"],"matchTerm":"exposure assessment","matchWhere":"摘要：exposure assessment、标题：wildfires","score":12,"authors":["Danika Leigh Mosher","Ge Sun","Peter V. Caldwell","Yulong Zhang","Stephen D. Sebestyen"],"authorMore":false,"abstract":"Abstract Wildfire increasingly threatens forested headwater watersheds that supply drinking water to downstream communities, yet wildfire exposure is often characterized at regional scales that do not identify which historical fires are most impactful to specific intake facilities. This limitation is especially important in managed water systems where inter-basin transfers (IBTs) expand source-water footprints beyond natural watershed boundaries. Here, we developed a reproducible spatial framework to quantify historical wildfire exposure for drinking-water intakes and applied it in northern Colorado as a case study. The analysis integrated historical (1984–2024) wildfire perimeters, burn …","abstractTruncated":true,"tier":"must_read","tierLabel":"必读","reportDate":"2026-10-30","tkey":"other","id":308,"titleZh":"","abstractZh":""},{"title":"Additionality of climate benefits from emission reduction and carbon dioxide removal","url":"https://doi.org/10.1088/1748-9326/aebb4e","doi":"10.1088/1748-9326/aebb4e","journal":"Environmental Research Letters","jabbr":"ERL","pubdate":"2026-10-29","topic":"生物地球化学","topics":["生物地球化学","温室气体"],"matchTerm":"carbon cycle","matchWhere":"摘要：carbon cycle、标题：carbon dioxide","score":12,"authors":["Terra Ganey","Mathis Hain","Andrew Ridgwell","Adina Paytan"],"authorMore":false,"abstract":"Abstract Carbon dioxide removal (CDR) has been identified as a necessary complement to industrial\u0026#xD;decarbonization for climate change mitigation. Marine CDR (mCDR) ":310,"titleZh":"","abstractZh":""},{"title":"Imminent Emergence of Permanent Surface Marine Heatwave States Across Global Oceans","url":"https://agupubs.onlinelibrary.wiley.com/doi/10.1029/2026EF008642?af=R","doi":"10.1029/2026ef008642","journal":"Earth's Future","jabbr":"Earth's Future","pubdate":"2026-10-28","topic":"温室气体","topics":["温室气体","极端天气"],"matchTerm":"greenhouse gas","matchWhere":"摘要：greenhouse gas、标题：heatwave","score":12,"authors":["Najmus Sadat Khan","Hamza Ibn Mujib","Zahid Imtiaz","A. K. M Saiful Islam","Thomas L. Frölicher","Robert Wilson"],"authorMore":true,"abstract":"Abstract Marine heatwaves (MHWs) can devastate ocean ecosystems, yet the timing at which anthropogenic changes in MHW characteristics permanently emerge from natural variability at the global scale remains poorly quantified. Here, we present the first global time of emergence analysis of MHW characteristics of the ocean surface using simulations from 21 Earth system models from the sixth Coupled Model Intercomparison Project under moderate (SSP2-4.5) and high (SSP5-8.5) greenhouse gas emissions scenarios. Relative to a 1985–2014 baseline, we find that almost 48% of the global ocean has already experienced significant trends in both annual MHW days and frequency. Across tropical oceans, MHW …","abstractTruncated":true,"tier":"must_read","tierLabel":"必读","reportDate":"2026-10-30","tkey":"other","id":311,"titleZh":"","abstractZh":""},{"title":"Diagnosing the Influence of Southern Ocean Storms on Air‐Sea Carbon Dioxide Flux From Synthetic Floats: A Modeling Study","url":"https://doi.org/10.1029/2026gl125540","doi":"10.1029/2026gl125540","journal":"Geophysical Research Letters","jabbr":"GRL","pubdate":"2026-10-28","topic":"生物地球化学","topics":["生物地球化学","温室气体"],"matchTerm":"biogeochemical","matchWhere":"摘要：biogeochemical、标题：carbon dioxide","score":12,"authors":["Katy M. Christensen","Nicole S. Lovenduski","LeAnn Conlon","Mathew Maltrud","Cara Nissen"],"authorMore":false,"abstract":"Abstract The Southern Ocean is the stormiest place on Earth, but sparse observations challenge our ability to understand the influence of storms on air‐sea fluxes. Here we quantify storm‐driven Southern Ocean fluxes using synthetic floats that mimic real‐world platforms in a physical‐biogeochemical simulation of the Energy Exascale Earth System Model between 2014 and 2023. By subsampling our array at the same resolution as real‐world arrays, we diagnose the capability of current observations in capturing fluxes in storms. We find that storms induce anomalous outgassing, with an average flux anomaly of 0.87 mmol C. However, when the synthetic float array is reduced to match observations, …","abstractTruncated":true,"tier":"must_read","tierLabel":"必读","reportDate":"2026-10-29","tkey":"other","id":312,"titleZh":"","abstractZh":""},{"title":"Substantial Emerging Impact of Amine-Based Carbon Capture on Atmospheric Particle Formation under Carbon Neutrality","url":"https://doi.org/10.1021/acs.est.6c12903","doi":"10.1021/acs.est.6c12903","journal":"Environmental Science \u0026 Technology","jabbr":"ES\u0026T","pubdate":"2026-10-27","topic":"空气污染","topics":["空气污染","温室气体"],"matchTerm":"ultrafine particles","matchWhere":"摘要：ultrafine particles、标题：carbon neutrality","score":12,"authors":["Zeqi Li","Jiewen Shen","Bin Zhao","Shuxiao Wang","Jingfan Xu","Yisheng Sun"],"authorMore":true,"abstract":"Abstract Carbon capture (CC) is indispensable to carbon neutrality, and amine-based absorption using monoethanolamine (MEA) is among the most mature CC technologies. MEA can enhance atmospheric new particle formation (NPF), the primary source of atmospheric particles. However, the atmospheric impacts of MEA escaping from future large-scale CC deployment remain unknown. Here, we develop a three-dimensional model that represents MEA sources, sinks, and H2SO4-MEA nucleation based on quantum chemical and cluster dynamics calculations, to evaluate atmospheric MEA and its impacts from CC deployment at China’s coal-fired power plants under carbon-neutrality scenarios. By 2060, even moderate CC …","abstractTruncated":true,"tier":"must_read","tierLabel":"必读","reportDate":"2026-10-28","tkey":"other","id":313,"titleZh":"","abstractZh":""},{"title":"Sector-detailed urban greenhouse gas emission futures derived from the ScenarioMIP-CMIP7 ensemble","url":"https://iopscience.iop.org/article/10.1088/1748-9326/aea34f","doi":"10.1088/1748-9326/aea34f","journal":"Environmental Research Letters","jabbr":"ERL","pubdate":"2026-10-27","topic":"温室气体","topics":["温室气体","城市地理信息系统"],"matchTerm":"greenhouse gas","matchWhere":"标题：greenhouse gas、摘要：urbanization","score":12,"authors":["Gunnar Luderer","Pascal Weigmann","Mark Roelfsema","Felix Creutzig","Angel Hsu","Jarmo S Kikstra"],"authorMore":true,"abstract":"Abstract Emission reductions required to meet the goals of the Paris Agreement have been extensively analyzed using integrated assessment modeling scenarios. However, the contribution of urban areas in aggregate, globally, by region and by city type, remains underexplored. Here, we develop a spatially explicit framework to downscale global emissions pathways to urban areas, differentiated by region and city type. Ambitious climate change mitigation could deliver 21 GtCO₂ e of greenhouse gas emission reductions in urban areas by 2050 relative to a continuation of current policies and trends, primarily by transitioning away from fossil fuels in electricity and heat supply, deep …","abstractTruncated":true,"tier":"must_read","tierLabel":"必读","reportDate":"2026-10-28","tkey":"other","id":314,"titleZh":"","abstractZh":""},{"title":"Climate risk assessment in tropical wetlands through integrated hydroclimatic, land cover, and community knowledge","url":"https://doi.org/10.1088/1748-9326/aeba00","doi":"10.1088/1748-9326/aeba00","journal":"Environmental Research Letters","jabbr":"ERL","pubdate":"2026-10-27","topic":"极端天气","topics":["极端天气","城市地理信息系统"],"matchTerm":"drought","matchWhere":"摘要：drought、标题：land cover","score":12,"authors":["Juliana M. Estrada-Zuleta","Julián E Meneses Bernal","Alvaro Avila-Diaz","Benjamin Quesada"],"authorMore":false,"abstract":"Abstract Climate-risk assessments in tropical wetlands increasingly combine hydroclimatic and land-cover data, but rarely integrate them with structured community evidence on experienced impacts and adaptation priorities. We address this gap in six communities around the Complejo Cenagoso de Zapatosa, a Ramsar site, and the Morales wetland in the Colombian Caribbean. We integrated hydroclimatic records and climate-extreme indices (1991-2020), land-cover change and runoff-potential analysis (1991-2020), flood-susceptibility modelling, and structured participatory evidence from 106 participants. Mean annual temperature increased by 0.4 °C decade⁻¹, while warm nights and warm days increased by …","abstractTruncated":true,"tier":"must_read","tierLabel":"必读","reportDate":"2026-10-28","tkey":"other","id":315,"titleZh":"","abstractZh":""},{"title":"Building materials and emissions from rebuilding under increasing climate-driven flood hazards","url":"https://doi.org/10.1038/s41467-026-79185-2","doi":"10.1038/s41467-026-79185-2","journal":"Nature Communications","jabbr":"Nat Commun","pubdate":"2026-10-26","topic":"温室气体","topics":["温室气体","极端天气"],"matchTerm":"greenhouse gas","matchWhere":"摘要：greenhouse gas、标题：flood","score":12,"authors":["Xiaoyang Zhong","Tomer Fishman","Timothy Tiggeloven","Yoav Peled","Yi Jin","Philip J. Ward"],"authorMore":true,"abstract":"Abstract Floods threaten lives and infrastructure, while recovery and reconstruction require materials whose production generates greenhouse gas emissions. These material needs and emissions remain insufficiently quantified. Here we assess the impacts of riverine and coastal flooding on building materials across Europe under climate change and land subsidence. Baseline annual replacement demand is about 30 million tonnes of materials, generating about 9 million tonnes of carbon dioxide equivalent emissions. With flood protection maintained but not upgraded, both could increase more than tenfold by 2080 under a moderate emissions scenario, driven by coastal flooding. Impacts could be about …","abstractTruncated":true,"tier":"must_read","tierLabel":"必读","reportDate":"2026-10-27","tkey":"other","id":316,"titleZh":"","abstractZh":""},{"title":"Landslide‐Channel Coupling Controls Asymmetric Flash Flood—Debris Flow Transitions: Insights From an Extreme Rainfall‐Induced Hazard Chain in Yuzhong of China in 2025","url":"https://doi.org/10.1029/2026gl124036","doi":"10.1029/2026gl124036","journal":"Geophysical Research Letters","jabbr":"GRL","pubdate":"2026-10-26","topic":"遥感","topics":["遥感","极端天气"],"matchTerm":"satellite","matchWhere":"摘要：satellite、标题：extreme rainfall","score":12,"authors":["Guan Chen","Yan Chong","Xinghua Zhu","Zhelin Liu","Yi Yan","Yajun Li"],"authorMore":true,"abstract":"Abstract Extreme rainfall‐triggered landslide–flash flood–debris flow hazard chains (LFFDF) are increasingly responsible for hydroclimatic losses worldwide. Although dynamics of individual hazards are established, transition mechanisms within LFFDF governed by coupled landslide–channel responses remain unresolved. Taking a catastrophic LFFDF event in northwestern China in 2025, we reconstructed the transition dynamics of the hazard chain using satellite data, seismic records, and numerical modeling. The results show that the LFFDF cascade operates as asymmetric transition processes, in which the dominant controls are state‐dependent. Rainfall‐induced landslides supplied one‐third of the …","abstractTruncated":true,"tier":"must_read","tierLabel":"必读","reportDate":"2026-10-27","tkey":"other","id":317,"titleZh":"","abstractZh":""},{"title":"How Does Extreme Weather Reshape the Time Allocation Among Rural Population? Evidence From China","url":"https://agupubs.onlinelibrary.wiley.com/doi/10.1029/2026EF008445?af=R","doi":"10.1029/2026ef008445","journal":"Earth's Future","jabbr":"Earth's Future","pubdate":"2026-10-25","topic":"极端天气","topics":["极端天气","城市地理信息系统"],"matchTerm":"extreme weather","matchWhere":"标题：extreme weather、摘要：geographic information system","score":12,"authors":["Yunli Bai","Xiaohua Yu","Linxiu Zhang"],"authorMore":false,"abstract":"Abstract Extreme weather poses significant threats to rural livelihoods globally. Time allocation serves as a critical short-term adaptation strategy for rural populations, yet the specific effect of extreme weather on the time allocation remains underexplored. This study examines the effects of four major types of extreme weather—frost, heatwave, heavy rainfall, and drought—on the time allocation among farming, off-farm work, and leisure activities in rural China. Using an integrated data set combining nationally representative rural household survey data (2019–2023), township-level geographic information system, and meteorological station observations, this study employs a Tobit random …","abstractTruncated":true,"tier":"must_read","tierLabel":"必读","reportDate":"2026-10-27","tkey":"other","id":318,"titleZh":"","abstractZh":""},{"title":"EMIT Reveals Elevated Calcite Signatures in Shorelines of Lake Powell and Lake Mead Exposed by Drought and Colorado River Management","url":"https://agupubs.onlinelibrary.wiley.com/doi/10.1029/2026GL122195?af=R","doi":"10.1029/2026gl122195","journal":"Geophysical Research Letters","jabbr":"GRL","pubdate":"2026-10-25","topic":"遥感","topics":["遥感","极端天气"],"matchTerm":"hyperspectral","matchWhere":"摘要：hyperspectral、标题：drought","score":12,"authors":["Michael Raymond Fischella","Joel B. Sankey","Ray Kokaly","Amy E. East","Alan Kasprak","Joshua J. Caster"],"authorMore":true,"abstract":"Abstract Nearly half of Earth’s seasonal freshwater storage variability occurs in human-managed reservoirs, resulting in large areas of reservoir-bed that are episodically inundated or subaerially exposed. Here we use hyperspectral data from NASA’s Earth Surface Mineral Dust Source Investigation (EMIT) mission to map calcite mineral assemblages across exposed surfaces in two large U.S. reservoirs, Lake Mead and Lake Powell. Results show distinct patterns in the occurrence of carbonate, clay, and mica minerals. Reservoir-deposited sediments exhibited significantly higher calcite proportions than adjacent, lithologically similar, non-inundated terrestrial surfaces. These differences likely …","abstractTruncated":true,"tier":"must_read","tierLabel":"必读","reportDate":"2026-10-27","tkey":"other","id":319,"titleZh":"","abstractZh":""},{"title":"Urbanization Amplifies Regional Precipitation Contrasts but not Urban‐Core Precipitation Extremes","url":"https://agupubs.onlinelibrary.wiley.com/doi/10.1029/2026EF008860?af=R","doi":"10.1029/2026ef008860","journal":"Earth's Future","jabbr":"Earth's Future","pubdate":"2026-10-24","topic":"极端天气","topics":["极端天气","城市地理信息系统"],"matchTerm":"extreme precipitation","matchWhere":"摘要：extreme precipitation、标题：urbanization","score":12,"authors":[],"authorMore":false,"abstract":"Abstract Urbanization is often assumed to intensify precipitation and concentrate flood-relevant extremes in city centers, yet clear observational evidence remains limited. Here, we analyze warm-season sub-daily precipitation during 2000–2024 across 20 urban agglomerations and 61 representative cities in China, partitioning built-up areas into three urban-intensity zones based on impervious surface fraction. Total precipitation generally increases more rapidly in urban areas than in nearby non-urban reference regions, with about 75% of urban agglomerations showing faster urban wetting. However, this enhancement is primarily driven by light-to-moderate precipitation, for which urbanization …","abstractTruncated":true,"tier":"must_read","tierLabel":"必读","reportDate":"2026-10-25","tkey":"other","id":320,"titleZh":"","abstractZh":""},{"title":"Long-term impacts of climate change on electricity demand and household expenditure in Saudi Arabia","url":"https://doi.org/10.1016/j.eneco.2026.109648","doi":"10.1016/j.eneco.2026.109648","journal":"Energy Economics","jabbr":"Energy Economics","pubdate":"2026-10-24","topic":"气候变化与极端天气","topics":["气候变化与极端天气"],"matchTerm":"climate change","matchWhere":"标题：climate change","score":12,"authors":["Ansir Ilyas","Puneet Kamboj","Fahad Alswaina","Dr Pavithra Kumar Shetty","Mohamad Issa Hejazi","Yoshihide Wada"],"authorMore":false,"abstract":"With regional warming across the Arabian Peninsula occurring at twice the global average and driving summer peak electricity loads to nearly 80% of total system capacity, understanding long-term energy implications is critical for Saudi Arabia’s national climate resilience. Consequently, this study assesses the impacts of climate change on thermal comfort, energy demand, and household electricity expenditure through 2100. Using the multi-sectoral Global Change Assessment Model for the Kingdom of Saudi Arabia (GCAM-KSA), we integrated three regionally updated Shared Socioeconomic Pathways (SSP1-3) with two climate pathways: RCP7.0 (high impact) and RCP2.6 (low impact). Our results indicate a …","abstractTruncated":true,"tier":"must_read","tierLabel":"必读","reportDate":"2026-11-05","tkey":"wx","id":321,"titleZh":"","abstractZh":""},{"title":"Attribution of Changes in European Flood and Drought Magnitudes to Climatic and Socioeconomic Drivers","url":"https://agupubs.onlinelibrary.wiley.com/doi/10.1029/2025EF007858?af=R","doi":"10.1029/2025ef007858","journal":"Earth's Future","jabbr":"Earth's Future","pubdate":"2026-10-22","topic":"极端天气","topics":["极端天气","城市地理信息系统"],"matchTerm":"drought","matchWhere":"标题：drought、摘要：land use","score":12,"authors":["Aloïs Tilloy","Dominik Paprotny","Lorenzo Mentaschi","Stefania Grimaldi","Diego Gomez‐Aragon","Luc Feyen"],"authorMore":false,"abstract":"Abstract Hydrological extremes display long-term trends and natural oscillations in response to climatic and socioeconomic factors. Knowing how and why these extremes are shifting is crucial for increasing water resilience in Europe. This work analyses trends in floods and droughts in European catchments between 1951 and 2020. Using the OS LISFLOOD hydrological model and non-stationary extreme value analysis, we disentangle the effects of dynamics in climate, encompassing climate variability and climate change, land use, water abstraction and reservoirs on river flow extremes. Our results reveal spatial and temporal variations in magnitude of hydrological extremes. Land use changes have …","abstractTruncated":true,"tier":"must_read","tierLabel":"必读","reportDate":"2026-10-23","tkey":"other","id":322,"titleZh":"","abstractZh":""},{"title":"Emission Mitigation and Climate Warming Increase China’s Ozone Responsiveness to Soil NOₓ Relative to Biogenic VOCs","url":"https://doi.org/10.1021/acs.est.6c09645","doi":"10.1021/acs.est.6c09645","journal":"Environmental Science \u0026 Technology","jabbr":"ES\u0026T","pubdate":"2026-10-21","topic":"空气污染","topics":["空气污染","大气化学"],"matchTerm":"ozone","matchWhere":"标题：ozone、摘要：photochemical","score":12,"authors":["Ling Huang","Xinyu Liu","Zhihui Kong","Greg Yarwood","Chris Emery","Katie Tuite"],"authorMore":false,"abstract":"Abstract Surface ozone (O3) remains a major air quality challenge in China despite recent reductions in anthropogenic emissions. Here, we use regional photochemical modeling to quantify changes in summertime O3 responses to relative perturbations in biogenic volatile organic compounds (BVOCs) and soil nitrogen oxides (NOx) under historical emission conditions and future mitigation and climate scenarios through 2060. Declining anthropogenic emissions increase ozone production efficiency and produce divergent response patterns: the modeled O3 response magnitude to BVOCs perturbations generally decreases, whereas the response magnitude to soil NOx perturbations increases. Under the 2060 …","abstractTruncated":true,"tier":"must_read","tierLabel":"必读","reportDate":"2026-10-22","tkey":"other","id":323,"titleZh":"","abstractZh":""},{"title":"Efficient Formation of Atmospheric Triplets and Organosulfur from Photochemistry of Non/weakly Light-absorbing Biomass Burning Tracers and S(IV)","url":"https://doi.org/10.1021/acs.est.6c08387","doi":"10.1021/acs.est.6c08387","journal":"Environmental Science \u0026 Technology","jabbr":"ES\u0026T","pubdate":"2026-10-21","topic":"空气污染","topics":["空气污染","大气化学"],"matchTerm":"aerosol","matchWhere":"摘要：aerosol、标题：photochemistry","score":12,"authors":["Junjie Gu","Yaoyu Guan","Salim Sioud","Ruifeng Zhang","Brix Raphael Go","Man Nin Chan"],"authorMore":false,"abstract":"Abstract Biomass burning (BB) events emit S(IV) and biomass-burning organic aerosol (BBOA). While some BBOA constituents generate atmospheric oxidants through photosensitization, a major fraction of BBOA consists of phenolics with negligible or weak absorption of solar radiation. Therefore, these phenolics, together with S(IV), have generally been viewed as atmospheric substrates of other oxidants. Here, we show that their photochemical interactions constitute an efficient source of brown carbon (BrC) and organosulfur products. Under simulated solar irradiation, aqueous S(IV) photochemistry initiates the decay of non/weakly light-absorbing phenolic BB tracers, including phenols, …","abstractTruncated":true,"tier":"must_read","tierLabel":"必读","reportDate":"2026-10-22","tkey":"other","id":324,"titleZh":"","abstractZh":""},{"title":"Influence of natural and anthropogenic forcings on western US winter fire weather and the 2025 Los Angeles wildfires","url":"https://doi.org/10.1088/1748-9326/aeb710","doi":"10.1088/1748-9326/aeb710","journal":"Environmental Research Letters","jabbr":"ERL","pubdate":"2026-10-21","topic":"温室气体","topics":["温室气体","极端天气"],"matchTerm":"greenhouse gas","matchWhere":"摘要：greenhouse gas、标题：wildfires","score":12,"authors":["Abhishekh Kumar Srivastava","Mark D Risser","Paul Ullrich","Michael Wehner"],"author
