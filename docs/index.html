nned. Despite substantial scholarly attention and several topical review articles, no systematic review of academic literature on REDD+ has focused exclusively on Mexico. This study addresses this gap …","abstractTruncated":true,"tier":"other","tierLabel":"其他相关","reportDate":"2026-11-05","tkey":"gis","id":53,"titleZh":"","abstractZh":""},{"title":"National and city-level greenhouse gas inventories in developing countries: status, gaps, and pathways forward","url":"https://doi.org/10.1038/s41612-026-01493-7","doi":"10.1038/s41612-026-01493-7","journal":"npj Climate and Atmospheric Science","jabbr":"npj Climate and Atmospheric Science","pubdate":"2026-10-21","topic":"气候变化与极端天气","topics":["气候变化与极端天气"],"matchTerm":"climate mitigation","matchWhere":"摘要：climate mitigation","score":3,"authors":["Binyuan Liu","Xiaofan Yang","Yuli Shan","Jinghang Xu","Xiande Ji","Yuru Guan"],"authorMore":false,"abstract":"Accurate greenhouse gas (GHG) inventories are essential for tracking climate mitigation. While many developed countries now publish comprehensive and timely emission inventories, developing countries still face data, time and resource constraints that hinder inventory development. This paper reviews the status of national and city-level GHG inventories in developing countries. We outline the main GHG accounting methods and examine their application in developing countries. We then assess the uneven geographic coverage of inventories at national and city scales and analyze the challenges faced in these contexts. Sparse city-level coverage across developing countries reflects gaps in basic …","abstractTruncated":true,"tier":"other","tierLabel":"其他相关","reportDate":"2026-11-05","tkey":"wx","id":54,"titleZh":"","abstractZh":""},{"title":"A snow-jet bridging mechanism driving the Afro-Asian summer monsoon precipitation dipole","url":"https://doi.org/10.1038/s41612-026-01582-7","doi":"10.1038/s41612-026-01582-7","journal":"npj Climate and Atmospheric Science","jabbr":"npj Climate and Atmospheric Science","pubdate":"2026-10-21","topic":"气候变化与极端天气","topics":["气候变化与极端天气"],"matchTerm":"drought","matchWhere":"摘要：drought","score":3,"authors":["Chao Zhang","Anmin Duan"],"authorMore":false,"abstract":"The Afro-Asian summer monsoon precipitation sustains billions of people across the two continents, and its variability strongly affects water supply, irrigation, and drought-flood risks. While this variability has been linked to air-sea interactions, its connection with land-surface signals remains unclear. Using large-ensemble snow perturbation experiments and information flow causal analysis, we show that reduced Tibetan Plateau snow cover (TPS) contributes to a dipole pattern in Afro-Asian summer monsoon precipitation: positive anomalies over tropical Africa and negative anomalies over South Asia. This relationship is modulated by an accelerated tropical easterly jet (TEJ). Reduced TPS …","abstractTruncated":true,"tier":"other","tierLabel":"其他相关","reportDate":"2026-11-05","tkey":"wx","id":55,"titleZh":"","abstractZh":""},{"title":"High-risk antimicrobial resistance genomic traits in multidrug-resistant Salmonella across China’s food chain: projections to 2050","url":"https://doi.org/10.1038/s41467-026-78346-7","doi":"10.1038/s41467-026-78346-7","journal":"Nature Communications","jabbr":"Nat Commun","pubdate":"2026-10-20","topic":"城市地理信息系统","topics":["城市地理信息系统"],"matchTerm":"urbanisation","matchWhere":"摘要：urbanisation","score":3,"authors":["Michelle Baker","Xin Lu","Chengchang Luo","Ge Wu","Alexandre Maciel-Guerra","Komkiew Pinpimai"],"authorMore":true,"abstract":"Abstract Antimicrobial resistance (AMR) is rising globally, yet factors shaping its genomic evolution remain poorly understood. We investigated how socioeconomic, climate, and health factors are associated with AMR spread in multi-drug resistant (MDR) Salmonella enterica across China’s food chain, mapped hotspots and forecasted genomic trait prevalence to 2050. We analysed 2,536 MDR genomes from 15 provinces over 16 years, covering patients, food and non-food workers, meat, livestock, and environmental sources. A machine learning framework integrated genomic surveillance with risk assessment to identify high-risk AMR traits (clinically relevant, MDR, mobile). Regression models linked trait …","abstractTruncated":true,"tier":"other","tierLabel":"其他相关","reportDate":"2026-10-21","tkey":"other","id":56,"titleZh":"","abstractZh":""},{"title":"Resource-Oriented Wastewater Treatment through Quorum Quenching─Integration of AnMBR and Donnan Dialysis","url":"https://doi.org/10.1021/acs.est.6c05848","doi":"10.1021/acs.est.6c05848","journal":"Environmental Science \u0026 Technology","jabbr":"ES\u0026T","pubdate":"2026-10-20","topic":"生物地球化学","topics":["生物地球化学"],"matchTerm":"methane","matchWhere":"摘要：methane","score":3,"authors":["Hongyu Zhang","Yuxuan Wan","Liqiu Zhang","Huarong Yu","Haiyang Yang","Fangshu Qu"],"authorMore":false,"abstract":"Abstract Aligned with United Nations Sustainable Development Goal 6, water treatment is shifting from pollution removal to resource recovery and circularity. An integration of AnMBR and a Donnan dialysis (DD) (AnMBR-DD) was proposed to simultaneously recover methane and ammonium, and quorum quenching (QQ) was further incorporated to mitigate membrane fouling and enhance process efficiency. The COD removal efficiency was stably maintained above 80%, and the methane conversion efficiency reached 51.6%. The effluent NH4+-N concentration was controlled at 3–5 mg/L, with a recovery efficiency of 47.1% in the AnMBR-DD. The QQ effectively alleviated biofouling on the ultrafiltration membrane in …","abstractTruncated":true,"tier":"other","tierLabel":"其他相关","reportDate":"2026-10-21","tkey":"other","id":57,"titleZh":"","abstractZh":""},{"title":"How increasing green hydrogen blending affects techno-economic and environmental performance of renewable energy communities across Italian climates","url":"https://doi.org/10.1016/j.renene.2026.126588","doi":"10.1016/j.renene.2026.126588","journal":"Renewable Energy","jabbr":"Renewable Energy","pubdate":"2026-10-20","topic":"生命周期与技术经济评价","topics":["生命周期与技术经济评价"],"matchTerm":"levelized cost","matchWhere":"摘要：levelized cost","score":3,"authors":["Laura Pompei","Axel Riccardo Massulli","Gianluigi Lo Basso","Livio de Santoli"],"authorMore":false,"abstract":"Renewable Energy Communities (RECs) can support the decarbonization of local energy systems by promoting renewable generation and sector coupling. This study evaluates the effect of increasing the hydrogen blending ratio from 10% to 20% by volume within an already hydrogen-integrated REC framework. Twelve scenarios are analysed across three Italian climatic zones-Reggio Calabria, Rome, and Turin-considering Combined Heat and Power (CHP) and Gas Absorption Heat Pump (GAHP) configurations coupled with photovoltaic generation, hydrogen production and storage, and hydrogen-natural gas blending. Results show that the response to higher hydrogen blending strongly depends on climate, thermal …","abstractTruncated":true,"tier":"other","tierLabel":"其他相关","reportDate":"2026-11-05","tkey":"other","id":58,"titleZh":"","abstractZh":""},{"title":"Rebels in a changing climate: insurgent perspectives on disasters and the rise or fall of rebellion","url":"https://doi.org/10.1016/j.gloenvcha.2026.103250","doi":"10.1016/j.gloenvcha.2026.103250","journal":"Global Environmental Change","jabbr":"Global Environmental Change","pubdate":"2026-10-20","topic":"气候变化与极端天气","topics":["气候变化与极端天气"],"matchTerm":"climate change","matchWhere":"摘要：climate change","score":3,"authors":["Tobias Ide","Dahlia Simangan","Debendra Prasad Adhikari","Isabella Romero Ángel","Pablo Andres Ramos Baron","Dennis F. Quilala"],"authorMore":false,"abstract":"The nexus between climate change and armed conflict has received considerable attention by scientists and decision makers. Existing evidence highlights that the impact of climate disasters on insurgencies is not unidirectional. Droughts, floods, and storms can have positive as well as negative impacts on armed groups. We study why and under what circumstances rebel groups benefit from or are constrained by climate disasters. To do so, we draw on unique empirical material that brings forth the perspectives of those affected by climate extremes and engaged in insurgencies. Specifically, we conducted 55 interviews with former rebels in Colombia (FARC/EP), Nepal (CPN-M/PLA), and the Philippines …","abstractTruncated":true,"tier":"other","tierLabel":"其他相关","reportDate":"2026-11-05","tkey":"wx","id":59,"titleZh":"","abstractZh":""},{"title":"Fe3 + Activation of Metal Sulfides for High-Performance Mercury Removal from Nonferrous Smelting Gas: A Dual Mercury Adsorption Mechanism","url":"https://doi.org/10.1021/acs.est.6c09451","doi":"10.1021/acs.est.6c09451","journal":"Environmental Science \u0026 Technology","jabbr":"ES\u0026T","pubdate":"2026-10-19","topic":"空气污染","topics":["空气污染"],"matchTerm":"so2","matchWhere":"摘要：so2","score":3,"authors":["Zixi Zhang","Chaolong Liu","Zhixing Huang","Kaisong Xiang","Fenghua Shen","Hui Liu"],"authorMore":false,"abstract":"Abstract Atmospheric elemental mercury (Hg0) emitted from the nonferrous metallurgy industry poses severe risks to ecosystems. Although metal sulfides are promising in Hg0 adsorption under high-concentration SO2 conditions, they typically suffer from poor performance at elevated temperatures due to weak binding affinity. Herein, a trivalent iron (Fe3+) activation strategy to boost Hg0 adsorption activity of metal sulfides was developed for the first time, which leverages electron-deficient Fe3+ to induce electronic reconstruction. This Fe3+ activation strategy is applicable to various metal sulfides, generating Fe sites with high activity and stability. Among the various candidates, the …","abstractTruncated":true,"tier":"other","tierLabel":"其他相关","reportDate":"2026-10-20","tkey":"other","id":60,"titleZh":"","abstractZh":""},{"title":"Submarine Groundwater Discharge Acts as a Significant Vector for Coastal Organophosphate Esters: Joint Evidence from Pollution Surveys and Radionuclide Analysis","url":"https://doi.org/10.1021/acs.est.6c11341","doi":"10.1021/acs.est.6c11341","journal":"Environmental Science \u0026 Technology","jabbr":"ES\u0026T","pubdate":"2026-10-19","topic":"生物地球化学","topics":["生物地球化学"],"matchTerm":"biogeochemical","matchWhere":"摘要：biogeochemical","score":3,"authors":["Li Zhang","Xiang Li","Xinhui He","Xuemin Feng","Bochao Xu","Shuo Yu"],"authorMore":true,"abstract":"Abstract Organophosphate esters (OPEs) are ubiquitous marine contaminants that raise global concern. While surface inputs are well-studied, the role of subsurface transport remains poorly constrained. Submarine groundwater discharge (SGD) drives seawater-groundwater interactions, yet its impact on OPEs behavior remains overlooked. This study comprehensively investigates the distribution, transport property and sources of OPEs from coastal groundwater to seawater in the Beibu Gulf, China. No statistically significant difference in Σ19OPEs levels was found between groundwater and tidal flat porewater, while both matrices exhibited significantly higher levels than seawater. The high …","abstractTruncated":true,"tier":"other","tierLabel":"其他相关","reportDate":"2026-10-20","tkey":"other","id":61,"titleZh":"","abstractZh":""},{"title":"Policy‐Driven Evolution of Sediment in the Yellow River Basin over the Past 2000 Years","url":"https://agupubs.onlinelibrary.wiley.com/doi/10.1029/2026EF009243?af=R","doi":"10.1029/2026ef009243","journal":"Earth's Future","jabbr":"Earth's Future","pubdate":"2026-10-19","topic":"城市地理信息系统","topics":["城市地理信息系统"],"matchTerm":"land use","matchWhere":"摘要：land use","score":3,"authors":["Anle Yang","Xiaohui Jiang","Yuxin Lei","Tong Nie","Xujing Li","Shengdong Yang","Fusen Nan","Liangbin Lan"],"authorMore":false,"abstract":"Abstract River sediment load serves as a typical indicator of the interaction between human activities and the natural environment, and historical policies have profoundly altered basin sediment transport processes. In this study, we constructed a quantitative analytical framework based on the policy index to systematically trace the evolutionary trajectories of ecological conservation, land use, and taxation policies in the Yellow River Basin over the past two millennia. We reveal how policy-driven human activities have reshaped land use patterns, and how these changes are linked to the long-term response mechanism of sediment load from the Yellow River. We find that prior to the 1970s, …","abstractTruncated":true,"tier":"other","tierLabel":"其他相关","reportDate":"2026-10-21","tkey":"other","id":62,"titleZh":"","abstractZh":""},{"title":"Evaluating mangrove establishment trajectories and carbon recovery potential using a spatial age-based framework","url":"https://doi.org/10.1088/1748-9326/aeb621","doi":"10.1088/1748-9326/aeb621","journal":"Environmental Research Letters","jabbr":"ERL","pubdate":"2026-10-19","topic":"遥感","topics":["遥感"],"matchTerm":"landsat","matchWhere":"摘要：landsat","score":3,"authors":["Yuxuan Zhao","Tong Li","Bohan Zheng","Xinyu Wang","Yifan Wang","Qiyue Zhang"],"authorMore":true,"abstract":"Abstract Mangrove restoration is a vital nature-based solution for climate change mitigation and biodiversity conservation. However, large-scale mangrove restoration success is predominantly evaluated using area-based metrics, which fail to capture the complex temporal trajectories of forest structural and functional recovery. Stand age directly determines structural heterogeneity and carbon stocks, making it a key indicator for monitoring recovery trajectories and estimating carbon stocks. We developed a spatial age-based framework to map established mangrove stands and quantify the existing carbon stock and remaining potential. To this end, we combined an optimized LandTrendr …","abstractTruncated":true,"tier":"other","tierLabel":"其他相关","reportDate":"2026-10-20","tkey":"other","id":63,"titleZh":"","abstractZh":""},{"title":"Projected weakening of Northern Hemisphere summertime high-latitude waveguide and teleconnection variability","url":"https://doi.org/10.1038/s41612-026-01577-4","doi":"10.1038/s41612-026-01577-4","journal":"npj Climate and Atmospheric Science","jabbr":"npj Climate and Atmospheric Science","pubdate":"2026-10-19","topic":"气候变化与极端天气","topics":["气候变化与极端天气"],"matchTerm":"climate extremes","matchWhere":"摘要：climate extremes","score":3,"authors":["Jin-Yong Kim","Changhyun Yoo","Qinghua Ding","Kyong‐Hwan Seo"],"authorMore":false,"abstract":"Summertime high-latitude teleconnections shape persistent circulation anomalies and surface climate extremes across the Northern Hemisphere, yet their future evolution under anthropogenic warming remains poorly constrained. Using 31 CMIP6 models under SSP5-8.5, we examine projected changes in the high-latitude waveguide, teleconnection variability, and the resulting surface air temperature (SAT) response. The CMIP6 ensemble projects an ~20.3% weakening of the 250 hPa meridional potential vorticity (PV) gradient over 50°–80°N during 2050–2099 relative to 1965–2014. This weakening is driven primarily by the projected warming pattern itself: enhanced upper-tropospheric warming at low-to-mid …","abstractTruncated":true,"tier":"other","tierLabel":"其他相关","reportDate":"2026-11-05","tkey":"wx","id":64,"titleZh":"","abstractZh":""},{"title":"Modeled Groundwater Decline is Associated with Lower Arsenic Concentrations in Hanoi","url":"https://doi.org/10.1021/acs.est.6c07700","doi":"10.1021/acs.est.6c07700","journal":"Environmental Science \u0026 Technology","jabbr":"ES\u0026T","pubdate":"2026-10-18","topic":"生物地球化学","topics":["生物地球化学"],"matchTerm":"biogeochemical","matchWhere":"摘要：biogeochemical","score":3,"authors":["David Haaf","Michael McGlade","Athena A. Nghiem","Duyen Thi Vu","Tobias Steinert","Viet Hung Pham"],"authorMore":true,"abstract":"Abstract Elevated arsenic concentrations in groundwater pose health risks. Geogenic arsenic contamination is driven by biogeochemical mobilization and groundwater dynamics. Intensive pumping can initially exacerbate contamination by drawing arsenic or mobilizing organic matter into aquifers, but over longer time scales may also promote dilution and flushing in some settings. To better understand the mechanisms controlling arsenic concentrations, we examined changes over two decades in Hanoi (Vietnam), a hotspot of geogenic arsenic contamination and groundwater pumping. Arsenic concentrations from 470 wells sampled in the year 2000 were compared with 434 wells sampled in the same area in … ✅ 数据源：24 本刊、68 条通道全部正常。","abstractTruncated":false,"tier":"other","tierLabel":"其他相关","reportDate":"2026-10-19","tkey":"other","id":65,"titleZh":"","abstractZh":""},{"title":"ITLN1 suppresses colorectal cancer progression by orchestrating neutrophil maturation and spatial organization","url":"https://doi.org/10.1038/s41467-026-78599-2","doi":"10.1038/s41467-026-78599-2","journal":"Nature Communications","jabbr":"Nat Commun","pubdate":"2026-10-16","topic":"城市地理信息系统","topics":["城市地理信息系统"],"matchTerm":"spatial analysis","matchWhere":"摘要：spatial analysis","score":3,"authors":["Li Chen","Xiangwei Zhai","Shaoxiang Chen","Jie Luo","Jing Sun","Guibing Qiao"],"authorMore":true,"abstract":"Abstract Epithelial-derived intelectin-1 (ITLN1) is frequently downregulated in colorectal cancer, but whether it actively shapes anti-tumor immunity remains unclear. We integrate multiplex immunohistochemistry, spatial analysis, single-cell transcriptomics, chromatin-accessibility profiling, and perturbation models to define how ITLN1 regulates neutrophil maturation and spatial anti-tumor immunity. In treatment-naïve human colorectal cancer, higher ITLN1 expression associates with greater neutrophil infiltration, shorter distances between mature S100A9 + CXCR2 + neutrophils and ITLN1 + tumor epithelial cells, and improved survival. In mouse colorectal cancer models, Itln1 silencing …","abstractTruncated":true,"tier":"other","tierLabel":"其他相关","reportDate":"2026-10-17","tkey":"other","id":66,"titleZh":"","abstractZh":""},{"title":"Explainable artificial intelligence reveals spatially divergent effects of global change on mammals","url":"https://doi.org/10.1038/s41467-026-78677-5","doi":"10.1038/s41467-026-78677-5","journal":"Nature Communications","jabbr":"Nat Commun","pubdate":"2026-10-16","topic":"城市地理信息系统","topics":["城市地理信息系统"],"matchTerm":"land cover","matchWhere":"摘要：land cover","score":3,"authors":["Lei Song","Amy E. Frazier","Peter Kedron","Diogo S. A. Araujo","Diyang Cui","Brian J. Enquist"],"authorMore":true,"abstract":"Abstract Understanding how global change reshapes species distributions remains a central challenge in ecology, yet most global assessments treat environmental drivers as static, uniform, or aggregate influences. This obscures where, why, and how specific drivers generate ecological risk or opportunity. Here, we apply explainable machine learning to assess how climate averages, variability, extremes, and land cover are projected to reshape future distributions of 1,992 terrestrial mammals. Using Shapley Additive Explanations with species distribution models, we quantify the directional contribution of 16 environmental drivers and track how these contributions change over space and time. We …","abstractTruncated":true,"tier":"other","tierLabel":"其他相关","reportDate":"2026-10-17","tkey":"other","id":67,"titleZh":"","abstractZh":""},{"title":"Uncertain yields: The challenge of predicting solar radiation management impacts on agricultural productivity","url":"https://www.cell.com/one-earth/fulltext/S2590-3322(26","doi":"10.1016/j.oneear.2026.101870","journal":"One Earth","jabbr":"One Earth","pubdate":"2026-10-16","topic":"气候变化与极端天气","topics":["气候变化与极端天气"],"matchTerm":"climate change","matchWhere":"摘要：climate change","score":3,"authors":["Peter Huybers","Jonathan Proctor","Wolfram Schlenker"],"authorMore":false,"abstract":"Solar radiation management (SRM) is an increasingly discussed approach to counteracting anthropogenic climate change and its impacts on human and ecological well-being. Here, we argue that while the effect of SRM on temperatures is relatively well understood, there are substantial uncertainties in the agricultural benefits and costs of SRM deployment.","abstractTruncated":false,"tier":"other","tierLabel":"其他相关","reportDate":"2026-11-05","tkey":"wx","id":68,"titleZh":"","abstractZh":""},{"title":"Medium-Entropy LDH-Driven Electronic Coupling of MnO x for Preferential Oxidation of Formaldehyde","url":"https://doi.org/10.1021/acs.est.6c10822","doi":"10.1021/acs.est.6c10822","journal":"Environmental Science \u0026 Technology","jabbr":"ES\u0026T","pubdate":"2026-10-16","topic":"空气污染","topics":["空气污染"],"matchTerm":"air pollutant","matchWhere":"摘要：air pollutant","score":3,"authors":["Xuanning Wu","Haiyan Li","Tao Dong","Tao Ban","Michael K.H. Leung","Haibao Huang"],"authorMore":false,"abstract":"Abstract Preferential oxidation of formaldehyde (HCHO) in natural gas engine exhaust is pivotal to prevent NH3–SCR catalyst deactivation and inhibit highly toxic hydrogen cyanide (HCN) formation. Although manganese-based catalysts exhibit prominent activity for HCHO oxidation, complete mineralization is still hindered by poor electron-transfer efficiency and insufficient reactive oxygen species (ROS) generation. Herein, we fabricate hierarchical medium-entropy LDH nanoflower-anchored MnOx catalysts (MnO2@NiMgAl-MELH) via a facile in situ growth strategy, enabling 100% mineralization of HCHO at room temperature. Structural characterizations and DFT calculations verify that Ni–Mn electronic …","abstractTruncated":true,"tier":"other","tierLabel":"其他相关","reportDate":"2026-10-17","tkey":"other","id":69,"titleZh":"","abstractZh":""},{"title":"Perspectives and Mitigation Methods for Underappreciated Amine Escape from CO2 Desorption","url":"https://doi.org/10.1021/acs.est.6c08471","doi":"10.1021/acs.est.6c08471","journal":"Environmental Science \u0026 Technology","jabbr":"ES\u0026T","pubdate":"2026-10-16","topic":"空气污染","topics":["空气污染"],"matchTerm":"aerosol","matchWhere":"摘要：aerosol","score":3,"authors":["Lingyu Shao","Yanlei Meng","Zhengda Yang","Yao Shen","Jingkai Zhao","Jiexu Ye"],"authorMore":true,"abstract":"Abstract Amine-based CO2 capture is increasingly limited by amine escape and aerosol emissions that drive solvent loss and secondary pollution. Research has focused on the absorber, leaving the desorption section─where intensive CO2 release, water-vapor entrainment, and rapid cooling coincide─overlooked as an escape source. Here, we combine molecular dynamics simulations with bench-scale experiments to resolve the mechanism and control of amine escape during CO2 desorption. Counter to absorber-side expectations, a CO2-rich atmosphere suppresses rather than promotes aerosol nucleation: elevated CO2 competitively disrupts the H2O–H2O hydrogen-bond network stabilizing water-centered nuclei, …","abstractTruncated":true,"tier":"other","tierLabel":"其他相关","reportDate":"2026-10-17","tkey":"other","id":70,"titleZh":"","abstractZh":""},{"title":"Dynamic Nature of Soil Iron Minerals: Recent Advances Using Iron Isotope Tracers and Mössbauer Spectroscopy","url":"https://doi.org/10.1021/acs.est.6c07339","doi":"10.1021/acs.est.6c07339","journal":"Environmental Science \u0026 Technology","jabbr":"ES\u0026T","pubdate":"2026-10-16","topic":"生物地球化学","topics":["生物地球化学"],"matchTerm":"biogeochemistry","matchWhere":"摘要：biogeochemistry","score":3,"authors":["Luiza Notini","Andrew R. C. Grigg","L. Joëlle Kubeneck","Michelle M. Scherer","Ruben Kretzschmar"],"authorMore":false,"abstract":"Abstract Iron plays a central role in defining the redox and surface chemical environment of soils and sediments, by mediating the behavior of nutrients, pollutants, and carbon compounds. However, the mechanisms that drive dynamic changes in Fe speciation and mineral composition can be difficult to trace. Over three decades, technical advances in spectroscopy and theoretical modeling techniques have revealed detailed mechanisms of Fe mineral recrystallization and transformation. Here, we provide a perspective on the application of iron isotopic tracers to the development of atomic-scale mechanistic understanding of Fe mineral dynamics. We review key milestones in the advancement of 57Fe …","abstractTruncated":true,"tier":"other","tierLabel":"其他相关","reportDate":"2026-10-17","tkey":"other","id":71,"titleZh":"","abstractZh":""},{"title":"Molecular Size Mediates Sunlight Effects on the Biodegradation of Aquatic Dissolved Organic Matter: Insights from the Reservoir Wetland and Incubation Experiment","url":"https://doi.org/10.1021/acs.est.6c07764","doi":"10.1021/acs.est.6c07764","journal":"Environmental Science \u0026 Technology","jabbr":"ES\u0026T","pubdate":"2026-10-16","topic":"大气化学","topics":["大气化学"],"matchTerm":"photochemical","matchWhere":"摘要：photochemical","score":3,"authors":["Peng Zhou","Long Tian","Shian Song","Muhammad Saboor Siddique","Kurt Friese","Peter Herzsprung"],"authorMore":true,"abstract":"Abstract Dissolved organic matter (DOM) in aquatic ecosystems is crucial to climate, water quality, and water sanitation. However, little is known about how photochemical and biological processes interact to regulate the cycling of DOM in water environments. Here, we investigate the photobiochemical processing of different molecular weight (MW) fractions of aquatic DOM by incubating them with microbes in the dark and light/dark cycling environments via microcosm experiments. Light exposure has distinct effects on the medium (MMW; 1–20 kDa) and low (LMW; \u0026lt;1 kDa) MW fractions and can enrich photoautotrophic bacteria and taxa that could benefit the utilization of aromatic compounds. The …","abstractTruncated":true,"tier":"other","tierLabel":"其他相关","reportDate":"2026-10-17","tkey":"other","id":72,"titleZh":"","abstractZh":""},{"title":"Assessing processes and evidence for highest possible ambition in Nationally Determined Contributions under the Paris Agreement","url":"https://doi.org/10.1088/1748-9326/aeb55f","doi":"10.1088/1748-9326/aeb55f","journal":"Environmental Research Letters","jabbr":"ERL","pubdate":"2026-10-16","topic":"气候变化与极端天气","topics":["气候变化与极端天气"],"matchTerm":"climate change","matchWhere":"摘要：climate change","score":3,"authors":["Julia Katharina Schönfeld","Setu Pelz","Hamish Beath","Joeri Rogelj"],"authorMore":false,"abstract":"Abstract The Paris Agreement establishes that Parties’ Nationally Determined Contributions (NDCs) will represent a progression, a country’s highest possible ambition (HPA), and an equitable contribution to the collective long-term temperature goal. However, the agreement provides no guidance on how the HPA standard should be interpreted, assessed, or operationalised in practice. In response to this gap, initial scholarship has proposed frameworks to interpret HPA based on the treaty’s text and the wider international environmental law context, which includes the 2025 Advisory Opinion on Obligations of States in Respect of Climate Change from the International Court of Justice. Altogether, …","abstractTruncated":true,"tier":"other","tierLabel":"其他相关","reportDate":"2026-11-05","tkey":"wx","id":73,"titleZh":"","abstractZh":""},{"title":"A century of streamwater quality degradation by input from urban water infrastructure as revealed by tree-ring records","url":"https://doi.org/10.1088/1748-9326/aeb560","doi":"10.1088/1748-9326/aeb560","journal":"Environmental Research Letters","jabbr":"ERL","pubdate":"2026-10-16","topic":"城市地理信息系统","topics":["城市地理信息系统"],"matchTerm":"urban growth","matchWhere":"摘要：urban growth","score":3,"authors":["Josiah Marie Sananda","Jay L Banner","Sneha Nachimuthu","Bryan A Black","Jose Abella-Gutiérrez","Kasey Faust"],"authorMore":true,"abstract":"Abstract The transfer of water from urban water networks to natural streams is a driver of streamwater quality degradation that likely occurs worldwide. We develop a new proxy using tree-ring strontium isotope ratios (87 Sr/ 86 Sr) to reconstruct multidecadal histories of municipal-water contributions to natural streams. We apply this approach to three watersheds spanning highly urbanized, rapidly urbanizing, and rural conditions in central Texas, USA. Municipal water has persistently dominated streamflow (\u003e90%) in the urban watershed since at least 1945, only 25 years after the initial expansion of Austin’s municipal water infrastructure network. In the rapidly urbanizing watershed, the …","abstractTruncated":true,"tier":"other","tierLabel":"其他相关","reportDate":"2026-10-17","tkey":"other","id":74,"titleZh":"","abstractZh":""},{"title":"Projecting potential population exposure to the invasive malaria vector Anopheles stephensi","url":"https://doi.org/10.1088/1748-9326/aeb558","doi":"10.1088/1748-9326/aeb558","journal":"Environmental Research Letters","jabbr":"ERL","pubdate":"2026-10-16","topic":"城市地理信息系统","topics":["城市地理信息系统"],"matchTerm":"urban land","matchWhere":"摘要：urban land","score":3,"authors":["Yelin Sun","Weihang Liu","Yuanyuan Jing","Tian Liu","Meng Shang","Yujuan Yue"],"authorMore":true,"abstract":"Abstract Malaria remains a major global public health threat, and the recent invasion and rapid spread of Anopheles stephensi across Africa pose new challenges for disease control. To assess future risks, we estimated the distribution of An. stephensi habitat suitability under four Shared Socioeconomic Pathways (SSPs, SSP126, SSP245, SSP370 and SSP585) across 2021-2100 using a boosted regression tree (BRT) model, and quantified population exposure through a contribution decomposition framework separating environmental, population and joint effects. The results showed that the proportion of urban land was the most important predictor (17.17%), followed by mean temperature of the wettest …","abstractTruncated":true,"tier":"other","tierLabel":"其他相关","reportDate":"2026-10-17","tkey":"other","id":75,"titleZh":"","abstractZh":""},{"title":"Ammonia Air‐Sea Exchange in Southwest UK","url":"https://agupubs.onlinelibrary.wiley.com/doi/10.1029/2025GL120401?af=R","doi":"10.1029/2025gl120401","journal":"Geophysical Research Letters","jabbr":"GRL","pubdate":"2026-10-16","topic":"生物地球化学","topics":["生物地球化学"],"matchTerm":"biogeochemistry","matchWhere":"摘要：biogeochemistry","score":3,"authors":["S. Louw","T. G. Bell","E. M. S. Woodward","M. Yang"],"authorMore":false,"abstract":"Abstract Ammonia (NH₃) measurements are challenging to make, and air-sea flux estimates are sparse, with coastal observations complicated by overlapping marine and terrestrial signals. Here we present high-resolution NH₃ air-sea flux estimates based on two years (2022–2023) of atmospheric and seawater measurements at the Penlee Point Atmospheric Observatory (PPAO), on the southwest UK coast. NH₃ concentrations peak in spring and summer and were strongly influenced by terrestrial air masses from the UK and Continental Europe. Net NH₃ deposition occurred across all seasons, with seasonal median deposition ranging from 20.5 to 34.5 μmol m −2 d −1 or 1.0 to 1.8 kg NH₃ -N ha −1 yr −1. The …","abstractTruncated":true,"tier":"other","tierLabel":"其他相关","reportDate":"2026-10-18","tkey":"other","id":76,"titleZh":"","abstractZh":""},{"title":"Interpretable Machine Learning Reveals Global Nonlinear Responses of Soil Respiration to Climate","url":"https://agupubs.onlinelibrary.wiley.com/doi/10.1029/2026GL124051?af=R","doi":"10.1029/2026gl124051","journal":"Geophysical Research Letters","jabbr":"GRL","pubdate":"2026-10-16","topic":"生物地球化学","topics":["生物地球化学"],"matchTerm":"carbon cycle","matchWhere":"摘要：carbon cycle","score":3,"authors":["Benjamin Laffitte","Zhihan Yang","Tao Zhou","Xiangjun Pei","Xiaolu Tang"],"authorMore":false,"abstract":"Abstract Soil respiration (R s) is a major component of the global carbon cycle, yet its responses to environmental drivers remain poorly constrained. Using 8,111 observations and a SHAP-interpreted Random Forest model, we identified global response patterns for key environmental drivers of R s. Temperature contributions showed a peaked association with a descriptive maximum of 27.7°C, precipitation contributions plateaued at high values, and leaf area index contributions increased approximately linearly. These results provide a global, data-driven characterization of peaked temperature and saturating precipitation associations, including how their shapes and supported ranges vary among …","abstractTruncated":true,"tier":"other","tierLabel":"其他相关","reportDate":"2026-10-18","tkey":"other","id":77,"titleZh":"","abstractZh":""},{"title":"Shifting Sands: Past, Present, and Future of Coastal Dunes","url":"https://doi.org/10.1146/annurev-environ-112624-014822","doi":"10.1146/annurev-environ-112624-014822","journal":"Annual Review of Environment and Resources","jabbr":"Annu Rev Environ Resour","pubdate":"2026-10-15","topic":"气候变化与极端天气","topics":["气候变化与极端天气"],"matchTerm":"climate change","matchWhere":"摘要：climate change","score":3,"authors":["M. Luisa Martínez","Patrick A. Hesp","Rodolfo Silva","Juan B. Gallego-Fernández","Alicia T.R. Acosta","Joana Gaspar de Freitas"],"authorMore":false,"abstract":"Sandy beaches and coastal dunes are ecologically and culturally valuable environments that support unique biodiversity and provide essential ecosystem services, including recreation, scenic beauty, and storm protection. This review summarizes dune formation processes, global distribution, and plant adaptations to sandy environments (psammophilous vegetation). Coastal dunes are increasingly threatened by direct impacts such as urbanization, mining, and dune stabilization, as well as by indirect pressures from climate change, including sea-level rise, erosion, and vegetation growth driven by warming and changes in precipitation. These combined effects lead to habitat loss, degradation, and …","abstractTruncated":true,"tier":"other","tierLabel":"其他相关","reportDate":"2026-11-05","tkey":"wx","id":78,"titleZh":"","abstractZh":""},{"title":"Blue Carbon in an Era of Carbon Accounting","url":"https://doi.org/10.1146/annurev-environ-121522-043142","doi":"10.1146/annurev-environ-121522-043142","journal":"Annual Review of Environment and Resources","jabbr":"Annu Rev Environ Resour","pubdate":"2026-10-15","topic":"气候变化与极端天气","topics":["气候变化与极端天气"],"matchTerm":"climate mitigation","matchWhere":"摘要：climate mitigation","score":3,"authors":["M. Ward","M.T. Costa","A.M. Ricart","S. Crooks","L.M. Wedding","P.I. Macreadie"],"authorMore":false,"abstract":"Blue carbon ecosystems—mangroves, tidal marshes, seagrass meadows, and, increasingly, seaweeds—are being rapidly integrated into climate mitigation frameworks. Yet, despite their prominence in global carbon offset discourse, blue carbon projects remain dominated by mangroves (∼89% of projects). Here, we synthesize recent developments in blue carbon science, carbon accounting, and market integrity. Global restoration potential could deliver annual removals of ∼109 (98–119; 95% CI) million tonnes of organic carbon, while habitat loss causes annual emissions of up to ∼63 (55–71) million tonnes. Realizing carbon benefits is constrained by monitoring, reporting, and verification costs, data …","abstractTruncated":true,"tier":"other","tierLabel":"其他相关","reportDate":"2026-11-05","tkey":"wx","id":79,"titleZh":"","abstractZh":""},{"title":"Animal Pollination Under Human-Induced Rapid Environmental Change","url":"https://doi.org/10.1146/annurev-environ-121224-092446","doi":"10.1146/annurev-environ-121224-092446","journal":"Annual Review of Environment and Resources","jabbr":"Annu Rev Environ Resour","pubdate":"2026-10-15","topic":"气候变化与极端天气","topics":["气候变化与极端天气"],"matchTerm":"climate change","matchWhere":"摘要：climate change","score":3,"authors":["Ignasi Bartomeus","Blanca Arroyo-Correa","Nerea Montes-Pérez"],"authorMore":false,"abstract":"Pollination is a key ecological function that ensures plant reproductive success and has important implications at multiple levels of biological organization. Animal pollination emerged 280 million years ago and promoted the diversification of angiosperms and pollinators. Currently, 90% of flowering plant species, including most crops, require animals to maximize their reproduction. However, human-induced rapid environmental change is threatening these mutualistic interactions. Pressures such as land use and climate change are modifying the probability of interaction between plants and pollinators as they impact species abundances, timing, and space use. Moreover, the interaction efficiency …","abstractTruncated":true,"tier":"other","tierLabel":"其他相关","reportDate":"2026-11-05","tkey":"wx","id":80,"titleZh":"","abstractZh":""},{"title":"Managing Groundwater Salinization Toward Sustainability","url":"https://doi.org/10.1146/annurev-environ-022725-105946","doi":"10.1146/annurev-environ-022725-105946","journal":"Annual Review of Environment and Resources","jabbr":"Annu Rev Environ Resour","pubdate":"2026-10-15","topic":"气候变化与极端天气","topics":["气候变化与极端天气"],"matchTerm":"climate change","matchWhere":"摘要：climate change","score":3,"authors":["Dongmei Han","Matthew J. Currell","Yoseph Yechieli","Ryan T. Bailey","Abhijit Mukherjee","Xuan Yu"],"authorMore":false,"abstract":"Groundwater, a crucial freshwater source worldwide, is under threat of salinization due to the combined pressures of climate change and human activities, hindering sustainable development. This review explores both natural and anthropogenic sources and mechanisms of groundwater salinization (GWS). We describe the impacts of GWS on environmental and socioeconomic systems, highlighting the risks to agriculture, water quality, and public health. We also discuss monitoring and assessment techniques and knowledge gaps essential for effective management. We present successful case studies of interventions in seven countries, showcasing the feasibility and difficulty of effective management and …","abstractTruncated":true,"tier":"other","tierLabel":"其他相关","reportDate":"2026-11-05","tkey":"wx","id":81,"titleZh":"","abstractZh":""},{"title":"Planning for a Net-Zero Future: Evolution of Electricity System Models","url":"https://doi.org/10.1146/annurev-environ-121124-025353","doi":"10.1146/annurev-environ-121124-025353","journal":"Annual Review of Environment and Resources","jabbr":"Annu Rev Environ Resour","pubdate":"2026-10-15","topic":"能源转型与低碳技术","topics":["能源转型与低碳技术"],"matchTerm":"energy transitions","matchWhere":"摘要：energy transitions","score":3,"authors":["Tarun Sharma","Praveen P.","Abhishek Das","Balachandra Patil"],"authorMore":false,"abstract":"Over the last few decades, electric power systems globally have been undergoing a rapid transition toward carbon-free energy resources, primarily driven by environmental concerns, technological innovations, economic advantages, and shifts in socioeconomic patterns. The integration of carbon-free electricity generators introduces challenges related to complexity, variability, and uncertainty of system operations. With mainstreaming and upscaling of these solutions, stranded assets, social acceptance, geopolitics of critical material security, disaster resilience, resilience to medium- to long-term variations in climate, constraints on availability of land, and end-of-life disposal issues …","abstractTruncated":true,"tier":"other","tierLabel":"其他相关","reportDate":"2026-11-05","tkey":"air","id":82,"titleZh":"","abstractZh":""},{"title":"Biological Invasions: Trends, Drivers, Impacts, Management, and Governance","url":"https://doi.org/10.1146/annurev-environ-121224-093418","doi":"10.1146/annurev-environ-121224-093418","journal":"Annual Review of Environment and Resources","jabbr":"Annu Rev Environ Resour","pubdate":"2026-10-15","topic":"气候变化与极端天气","topics":["气候变化与极端天气"],"matchTerm":"climate change","matchWhere":"摘要：climate change","score":3,"authors":["David M. Richardson","Sven Bacher","Philip E. Hulme","Laura A. Meyerson","Helen E. Roy","Ellen Ryan-Colton"],"authorMore":false,"abstract":"Invasion science has matured rapidly into a vibrant interdisciplinary field addressing threats posed by biological invasions to people and nature. Nearly 40,000 species have established alien populations somewhere. For most taxonomic groups, numbers of alien species are increasing faster now than ever before, with introductions driven indirectly by economic development and human movement. Direct drivers (notably climate change and land- and sea-use change) facilitate alien species establishment and spread. Understanding the impacts of alien species has progressed from qualitative descriptions to structured quantification, culminating in the development of global frameworks. Negative impacts …","abstractTruncated":true,"tier":"other","tierLabel":"其他相关","reportDate":"2026-11-05","tkey":"wx","id":83,"titleZh":"","abstractZh":""},{"title":"Governing Long Problems: Challenges and Solutions","url":"https://doi.org/10.1146/annurev-environ-121124-011717","doi":"10.1146/annurev-environ-121124-011717","journal":"Annual Review of Environment and Resources","jabbr":"Annu Rev Environ Resour","pubdate":"2026-10-15","topic":"气候变化与极端天气","topics":["气候变化与极端天气"],"matchTerm":"climate change","matchWhere":"摘要：climate change","score":3,"authors":["Thomas N. Hale"],"authorMore":false,"abstract":"The world confronts a growing number of “long problems,” such as climate change, demographic shifts, or building and maintaining critical infrastructure, which span more than one human generation. This article reviews how scholars of governance from a range of disciplines have thought about such problems and their solutions. It considers three questions. How are long-term governance challenges conceptualized? What barriers to effective governance do they present? What tools and strategies may help address those challenges, and how and under what conditions might they be effective? The literature has paid significant, but uneven, attention to these issues, highlighting the need to build the …","abstractTruncated":true,"tier":"other","tierLabel":"其他相关","reportDate":"2026-11-05","tkey":"wx","id":84,"titleZh":"","abstractZh":""},{"title":"Between public space and private living: social infrastructure as a demand-side strategy for compact living","url":"https://iopscience.iop.org/article/10.1088/1748-9326/aeaf69","doi":"10.1088/1748-9326/aeaf69","journal":"Environmental Research Letters","jabbr":"ERL","pubdate":"2026-10-15","topic":"城市地理信息系统","topics":["城市地理信息系统"],"matchTerm":"urban form","matchWhere":"摘要：urban form","score":3,"authors":["Tamar Meshulam and Shoshanna Saxe"],"authorMore":false,"abstract":"Abstract Cities must balance the housing needs of growing populations with planetary boundaries. Technological improvements alone cannot meet climate targets, and demand-side strategies that reduce private dwelling size are critical for achieving absolute reductions in material and energy demand. However, the socio-spatial conditions that enable compact living remain poorly understood. Prior theoretical work suggests that social infrastructure, including cafés, parks, libraries, and community centres, can reduce demand for private residential space, but empirical evidence linking social infrastructure to dwelling size has been virtually absent. We address this gap through a large-scale, …","abstractTruncated":true,"tier":"other","tierLabel":"其他相关","reportDate":"2026-10-17","tkey":"other","id":85,"titleZh":"","abstractZh":""},{"title":"Urban vegetation experienced less damage than rural vegetation during the 2022 compound hot–dry event in eastern China","url":"https://doi.org/10.1088/1748-9326/aeb435","doi":"10.1088/1748-9326/aeb435","journal":"Environmental Research Letters","jabbr":"ERL","pubdate":"2026-10-14","topic":"城市地理信息系统","topics":["城市地理信息系统"],"matchTerm":"land-use","matchWhere":"摘要：land-use","score":3,"authors":["Zhihan Zhao","Bo Qiu","Jiuyi Chen","Yueyang Ni","Chen Chen"],"authorMore":false,"abstract":"Abstract Compound hot–dry events (CHDEs) increasingly threaten vegetation growth, but whether urban environments amplify or buffer vegetation responses to such extremes remains unclear. This study examined urban–rural contrasts in vegetation responses by integrating standardized enhanced vegetation index (EVI) anomalies with resistance and recovery metrics during the 2022 CHDE over the Yangtze River Basin (YZB) in China. Our results show that the CHDE caused widespread declines in EVI across the YZB, but urban vegetation showed weaker declines than rural vegetation and croplands, together with a smaller damaged area and higher resistance among affected pixels. By contrast, post-event …","abstractTruncated":true,"tier":"other","tierLabel":"其他相关","reportDate":"2026-10-15","tkey":"other","id":86,"titleZh":"","abstractZh":""},{"title":"Enhancing fairness in climate action through policy packages","url":"https://doi.org/10.1038/s41558-026-02751-5","doi":"10.1038/s41558-026-02751-5","journal":"Nature Climate Change","jabbr":"Nat Clim Chang","pubdate":"2026-10-13","topic":"减排政策与能源战略","topics":["减排政策与能源战略"],"matchTerm":"climate policy","matchWhere":"摘要：climate policy","score":3,"authors":["Toon Vandyck","Umed Temursho","Florian Landis","David Klenert","Matthias Weitzel"],"authorMore":false,"abstract":"Abstract Achieving a fair transition to climate neutrality requires a careful balancing of policy options. Here we quantitatively evaluate the equity implications of different European Union climate policy packages, considering pricing, regulation via standards, subsidies and transfers. Leveraging an integrated modelling framework, we show that standards limit impact variability within income groups, whereas carbon pricing with transfer-based revenue recycling offsets regressive impacts between income groups. Restricting climate policy implementation to either option, therefore, gives rise to a trade-off between horizontal and vertical equity. We then demonstrate numerically how a …","abstractTruncated":true,"tier":"other","tierLabel":"其他相关","reportDate":"2026-11-05","tkey":"ghg","id":87,"titleZh":"","abstractZh":""},{"title":"Reinforcement learning guided robotic platform that investigates and discovers asymmetric reactions","url":"https://www.nature.com/articles/s41467-026-78271-9","doi":"10.1038/s41467-026-78271-9","journal":"Nature Communications","jabbr":"Nat Commun","pubdate":"2026-10-13","topic":"城市地理信息系统","topics":["城市地理信息系统"],"matchTerm":"digital twin","matchWhere":"摘要：digital twin","score":3,"authors":["Patryk Klochowicz","Ahmad F. Kassir","Chandrakanta Parida","Jarosław M. Granda"],"authorMore":false,"abstract":"Abstract Autonomous robotic platforms accelerate chemical discovery by coupling automated experimentation with algorithmic decision-making, but most lack integrated support for chirality and the sequential decision-making required to explore asymmetric reaction spaces with unknown reactivity and stereochemical outcomes. Here, we report a bespoke robotic platform guided by deep reinforcement learning that autonomously navigates a defined asymmetric reaction space by scouting reaction conditions, discovering chiral products, screening catalysts and mapping substrate scope. The structure-agnostic workflow is enabled by a digital twin of asymmetric catalysis, in which control policies are …","abstractTruncated":true,"tier":"other","tierLabel":"其他相关","reportDate":"2026-10-14","tkey":"other","id":88,"titleZh":"","abstractZh":""},{"title":"An integrated model of climate and environmental pathways to violent extremism","url":"https://doi.org/10.1016/j.gloenvcha.2026.103240","doi":"10.1016/j.gloenvcha.2026.103240","journal":"Global Environmental Change","jabbr":"Global Environmental Change","pubdate":"2026-10-12","topic":"气候变化与极端天气","topics":["气候变化与极端天气"],"matchTerm":"climate change","matchWhere":"摘要：climate change","score":3,"authors":["Nora C. G. Benningstad","Milan Obaidi","Gulnaz Anjum","Jonas R. Kunst"],"authorMore":false,"abstract":"Climate change and violent extremism represent intersecting global threats, yet their relationship remains under-examined. This preregistered systematic review synthesizes 45 studies across disciplines to develop an integrated conceptual model of climate-extremism pathways based on the current literature. Our synthesis shows that climate variability correlates with terrorist attack frequency, climate shocks create governance vacuums exploited by extremist organizations, environmental degradation fuels extremist narratives, and climate threat cues increase authoritarian attitudes and out-group hostility. These pathways are moderated by various factors including state capacity, community …","abstractTruncated":true,"tier":"other","tierLabel":"其他相关","reportDate":"2026-11-05","tkey":"wx","id":89,"titleZh":"","abstractZh":""},{"title":"Recent change in northward migration of the East Asian summer front and increased compound wet–hot conditions","url":"https://doi.org/10.1038/s41612-026-01570-x","doi":"10.1038/s41612-026-01570-x","journal":"npj Climate and Atmospheric Science","jabbr":"npj Climate and Atmospheric Science","pubdate":"2026-10-11","topic":"气候变化与极端天气","topics":["气候变化与极端天气"],"matchTerm":"climate risk","matchWhere":"摘要：climate risk","score":3,"authors":["Suyeon Moon","OkYeon Kim","Hyungjun Kim"],"authorMore":false,"abstract":"The East Asian summer front (EASF) plays a key role in regional precipitation and heat stress, yet its long-term positional changes remain poorly understood. Using a front-tracking algorithm applied to ERA5 reanalysis (1979–2025), we identify northward migration of the EASF during both the active frontal season and late summer, with a more robust 1.92° shift in late summer. These shifts are associated with enhanced moisture transport, regional weakening of the upper-level jet, and localized sea surface temperature warming that has intensified and spatially broadened in recent decades. This poleward displacement is associated with increased frontal precipitation over Korea and enhanced heat …","abstractTruncated":true,"tier":"other","tierLabel":"其他相关","reportDate":"2026-11-05","tkey":"wx","id":90,"titleZh":"","abstractZh":""},{"title":"Institutional risk, finance, and the limits of techno-economic optimality in green hydrogen deployment","url":"https://doi.org/10.1016/j.rser.2026.117557","doi":"10.1016/j.rser.2026.117557","journal":"Renewable and Sustainable Energy Reviews","jabbr":"Renewable and Sustainable Energy Reviews","pubdate":"2026-10-09","topic":"生命周期与技术经济评价","topics":["生命周期与技术经济评价"],"matchTerm":"techno-economic analysis","matchWhere":"摘要：techno-economic analysis","score":3,"authors":["Bram R. van Rooijen","Songul Tekeli","Evrim Ursavas","Stuart X. Zhu"],"authorMore":false,"abstract":"Green hydrogen is widely positioned as a key option for deep decarbonization, yet large-scale deployment remains limited despite growing techno-economic potential. This review examines how non-technical conditions influence the feasibility of green hydrogen business models, using the Netherlands as an illustrative case. A review-driven mixed-methods framework integrates evidence from a systematic literature review, semi-structured expert interviews, and an established hourly-resolved techno-economic optimization model to examine how policy design, investment risk, infrastructure constraints, and demand formation influence both the levelized cost of hydrogen (LCOH) and deployment …","abstractTruncated":true,"tier":"other","tierLabel":"其他相关","reportDate":"2026-11-05","tkey":"other","id":91,"titleZh":"","abstractZh":""},{"title":"Earlier green-up exacerbates northern vegetation sensitivity to flash drought","url":"https://doi.org/10.1038/s41467-026-78296-0","doi":"10.1038/s41467-026-78296-0","journal":"Nature Communications","jabbr":"Nat Commun","pubdate":"2026-10-08","topic":"遥感","topics":["遥感"],"matchTerm":"satellite","matchWhere":"摘要：satellite","score":3,"authors":["Wenrui Bai","Quansheng Ge","Constantin M. Zohner","Jun Wang","Shaozhi Lin","Yani Liang"],"authorMore":true,"abstract":"Flash drought–induced relative reduction in vegetation activity and canopy functioning, referred to as vegetation sensitivity, is a crucial measure of drought impacts. While climatic factors influencing vegetation sensitivity are well recognized, the role of phenological shifts remains poorly understood. Using multiple satellite-derived vegetation proxies (NDVI, LAI, SIF, and VOD) during 2001–2021, we show that earlier green-up dates (GUD) exacerbate vegetation sensitivity to flash droughts across 61.2–84.1% of the Northern Hemisphere (\u003e23.5°N). Earlier GUDs enhance pre-drought vegetation growth, especially during the early growing season. Such amplified vegetation growth exacerbates …","abstractTruncated":true,"tier":"other","tierLabel":"其他相关","reportDate":"2026-10-11","tkey":"other","id":92,"titleZh":"","abstractZh":""},{"title":"Reduced semi-arid summer carbon dioxide efflux from agrivoltaic compared to conventional horticultural soil","url":"https://doi.org/10.1088/1748-9326/aeb1dd","doi":"10.1088/1748-9326/aeb1dd","journal":"Environmental Research Letters","jabbr":"ERL","pubdate":"2026-10-08","topic":"生物地球化学","topics":["生物地球化学"],"matchTerm":"soil carbon","matchWhere":"摘要：soil carbon","score":3,"authors":["Holly Andrews","Fabiana Olea Carrasco","Alyssa Salazar","Zoe Gineris","Talitha H Neesham-McTiernan","G. Darrel Jenerette"],"authorMore":true,"abstract":"Abstract Agrivoltaic (AV) systems that combine horticultural crops with photovoltaic (PV) infrastructure on the same land parcel can provide mutual benefits for crop performance, electricity production, and water use in semi-arid climates. Whether semi-arid AV systems provide additional benefits for soil development and carbon (C) accumulation remains unclear. Larger aboveground biomass and yield production, which has been observed in semi-arid AV for certain crops, may accelerate C loss by supporting more continual and extensive microbial and root respiration, resulting in net zero or negative change in soil C over a growing season. Alternatively, AV systems may retain more soil C by …","abstractTruncated":true,"tier":"other","tierLabel":"其他相关","reportDate":"2026-10-09","tkey":"other","id":93,"titleZh":"","abstractZh":""},{"title":"Role of atmospheric circulation and anthropogenic forcing in the extreme 2025 European summer heatwave","url":"https://doi.org/10.1088/1748-9326/aeb1e0","doi":"10.1088/1748-9326/aeb1e0","journal":"Environmental Research Letters","jabbr":"ERL","pubdate":"2026-10-08","topic":"空气污染","topics":["空气污染"],"matchTerm":"aerosol","matchWhere":"摘要：aerosol","score":3,"authors":["Yan Chen","Wen Chen","Shangfeng Chen","Juan Feng","Tianjiao Ma"],"authorMore":false,"abstract":"Abstract In summer 2025, an extreme heatwave propagated northeastward across Europe, sequentially affecting Southwestern (SWEU) and Northern (NEU) Europe with record-breaking durations in the 1979-2025 record. However, the roles of atmospheric circulation and anthropogenic forcing in the 2025 European high-temperature conditions remain unclear. Here we show that atmospheric circulation explains 82.5% (95% uncertainty interval: 65.0-99.0%) and 51.9% (37.0-65.2%) of the regional mean maximum temperature (Tmax) anomalies averaged over the respective heatwave periods in SWEU and NEU, respectively, based on the flow analogue method. Extreme anticyclonic circulation is associated with extreme …","abstractTruncated":true,"tier":"other","tierLabel":"其他相关","reportDate":"2026-10-09","tkey":"other","id":94,"titleZh":"","abstractZh":""},{"title":"A recent doubling of global warming rate signals a 1.5 °C breach by 2028","url":"https://doi.org/10.1038/s41612-026-01561-y","doi":"10.1038/s41612-026-01561-y","journal":"npj Climate and Atmospheric Science","jabbr":"npj Climate and Atmospheric Science","pubdate":"2026-10-08","topic":"减排政策与能源战略","topics":["减排政策与能源战略"],"matchTerm":"climate policy","matchWhere":"摘要：climate policy","score":3,"authors":["Qinjian Jin","Bing Pu"],"authorMore":false,"abstract":"Timely and accurate projections of when global warming will exceed the Paris Agreement’s 1.5 °C threshold are essential for effective climate policy. Existing estimates place this exceedance in the early 2030 s but carry substantial uncertainty. Here we analyze the latest observational temperature records through 2025 and identify a statistically significant doubling of the global warming rate during 2011–2025 (0.40 °C per decade) compared to 1971–2025 (0.20 °C per decade). Extrapolating this accelerated rate projects a crossing of the 1.5 °C threshold by 2028, nearly a decade earlier than previous estimates. Regional analyses attribute this acceleration primarily to intensified warming …","abstractTruncated":true,"tier":"other","tierLabel":"其他相关","reportDate":"2026-11-05","tkey":"ghg","id":95,"titleZh":"","abstractZh":""},{"title":"Maillard-like Reactions Generate Secondary Organic Products with Oxidative Potential: Mechanisms and Photoaging Enhancement","url":"https://doi.org/10.1021/acs.est.6c12787","doi":"10.1021/acs.est.6c12787","journal":"Environmental Science \u0026 Technology","jabbr":"ES\u0026T","pubdate":"2026-10-07","topic":"空气污染","topics":["空气污染"],"matchTerm":"aerosol","matchWhere":"摘要：aerosol","score":3,"authors":["Xin Zhu","Qingcai Chen","Tong Sha","Bo Wang","Huan Liu","Yue Yin"],"authorMore":true,"abstract":"Abstract The formation mechanisms and atmospheric evolution of secondary organic aerosols contributing to the oxidative potential (OP) remain poorly understood, limiting the assessment of their potential health impacts. Here, we demonstrate for the first time that atmospheric aqueous Maillard-like reactions constitute an important pathway for generating secondary organic products with OP. Six representative dicarbonyl-nitrogen reaction systems were designed to systematically investigate the formation kinetics, molecular characteristics, and photoaging evolution of the products generated from the Maillard-like reactions. All reactions systems generated measurable intrinsic OP, with the …","abstractTruncated":true,"tier":"other","tierLabel":"其他相关","reportDate":"2026-10-08","tkey":"other","id":96,"titleZh":"","abstractZh":""},{"title":"Modulation of precession-forced Asian–African monsoon and arid climate variability by obliquity","url":"https://doi.org/10.1038/s41612-026-01566-7","doi":"10.1038/s41612-026-01566-7","journal":"npj Climate and Atmospheric Science","jabbr":"npj Climate and Atmospheric Science","pubdate":"2026-10-07","topic":"气候变化与极端天气","topics":["气候变化与极端天气"],"matchTerm":"climate change","matchWhere":"摘要：climate change","score":3,"authors":["Jing Lei","Yingying Sha","Xinzhou Li","Heng Zhang","Zhengguo Shi"],"authorMore":false,"abstract":"Precession and obliquity play vital roles in orbital-scale climate change. However, their combined effects remain poorly understood. In this study, we examine how obliquity modulates precession-driven climate responses across Asian–African monsoon and arid regions (AAMAR). Results demonstrate that under high obliquity, the minimum-precession-induced precipitation increase is weakened in the Asian–African monsoon regions but enhanced in the Asian–African arid regions. The changes in precipitation responses over Africa and West Asia are largely explained by an enhanced northward displacement of the regional Hadley circulation, which shifts the zone of precipitation increase northward from …","abstractTruncated":true,"tier":"other","tierLabel":"其他相关","reportDate":"2026-11-05","tkey":"wx","id":97,"titleZh":"","abstractZh":""},{"title":"Synergistic Approaches in PFAS Remediation: Outlook for Sustainable In Situ Mitigation by Combined Adsorption and Photocatalysis","url":"https://doi.org/10.1021/acs.est.6c12980","doi":"10.1021/acs.est.6c12980","journal":"Environmental Science \u0026 Technology","jabbr":"ES\u0026T","pubdate":"2026-10-06","topic":"大气化学","topics":["大气化学"],"matchTerm":"photochemical","matchWhere":"摘要：photochemical","score":3,"authors":["Surabhi Sreenitha Raj","Jingqian Chen","Oscar Cabezuelo","Tetyana M. Budnyak"],"authorMore":false,"abstract":"Abstract Per- and polyfluoroalkyl substances (PFAS) are persistent organic pollutants with widespread environmental occurrence. Their toxicity and resistance to degradation pose serious risks to ecosystems and human health. While existing separation (e.g., adsorption, filtration) and degradation (e.g., photochemical, electrochemical, thermal) technologies can achieve partial PFAS removal, limitations such as high energy demand, poor cost-efficiency, and harsh operating conditions hinder their in situ application. In this context, a synergistic approach, a system in which adsorption and degradation are functionally coupled rather than applied as independent sequential unit operations, has …","abstractTruncated":true,"tier":"other","tierLabel":"其他相关","reportDate":"2026-10-07","tkey":"other","id":98,"titleZh":"","abstractZh":""},{"title":"Fine‐Tuning a Machine‐Learned 3D Cloud Climatology Reveals Aspects of Cloud Cover Trends","url":"https://doi.org/10.1029/2026gl123369","doi":"10.1029/2026gl123369","journal":"Geophysical Research Letters","jabbr":"GRL","pubdate":"2026-10-06","topic":"遥感","topics":["遥感"],"matchTerm":"geostationary","matchWhere":"摘要：geostationary","score":3,"authors":["Adrià Amell","Simon Pfreundschuh","Patrick Eriksson"],"authorMore":false,"abstract":"Abstract The Chalmers Cloud Ice Climatology (CCIC) is unique among long‐term cloud records: using retrievals from merged geostationary 11 μm observations, it provides continuous 3D estimates of both frozen hydrometeor mass and cloud probability. Here, we present a key update to CCIC: enhanced detection of thin clouds through tuning of its neural network cloud probability outputs. The update delivers robust information from local instantaneous retrievals to long‐term, large‐scale averages. We compare multidecadal, height‐resolved trends in cloud cover from CCIC and ERA5, revealing subtle but emerging long‐term changes in total cloud cover. By exploiting CCIC's capabilities, the contributions …","abstractTruncated":true,"tier":"other","tierLabel":"其他相关","reportDate":"2026-10-07","tkey":"other","id":99,"titleZh":"","abstractZh":""},{"title":"Distinct Dependencies of Tropical Cyclone Inner‐Core and Outer‐Region Precipitation on Translation Speed and Intensity","url":"https://doi.org/10.1029/2026gl125340","doi":"10.1029/2026gl125340","journal":"Geophysical Research Letters","jabbr":"GRL","pubdate":"2026-10-06","topic":"遥感","topics":["遥感"],"matchTerm":"satellite","matchWhere":"摘要：satellite","score":3,"authors":["Jingzhe Xu","Shuguang Wang"],"authorMore":false,"abstract":"Abstract This study analyzes how tropical cyclone (TC) precipitation in the inner core (IC) and outer region (OR) varies with translation speed and storm intensity using satellite‐derived precipitation data. Inner core precipitation initially increases with translation speed but decreases at higher speeds, while OR precipitation increases nearly linearly with translation speed. Inner core precipitation is strongly linked to TC intensity, both with and without conditioning on translation speed, whereas OR precipitation increases with intensity primarily for stronger storms. As translation speed increases, the location of maximum precipitation shifts toward the forward‐left quadrant in the …","abstractTruncated":true,"tier":"other","tierLabel":"其他相关","reportDate":"2026-10-07","tkey":"other","id":100,"titleZh":"","abstractZh":""},{"title":"Explainable Deep Learning Reveals Future Changes in East Asian Extreme Winter Predictability","url":"https://doi.org/10.1038/s41612-026-01564-9","doi":"10.1038/s41612-026-01564-9","journal":"npj Climate and Atmospheric Science","jabbr":"npj Climate and Atmospheric Science","pubdate":"2026-10-05","topic":"气候变化与极端天气","topics":["气候变化与极端天气"],"matchTerm":"climate change","matchWhere":"摘要：climate change","score":3,"authors":["Seo‐Young Jo","Jeong-Hwan Kim","Daehyun Kang","Jae-Heung Park","Seung‐Ki Min","Minju Kim"],"authorMore":false,"abstract":"Deep learning-based approaches have emerged as powerful tools for seasonal prediction, yet their skill remains limited for extreme anomalies, and warming climates may alter predictability sources. Here we present a convolutional neural network (CNN)-based framework to assess how seasonal predictability changes in a future climate, focusing on East Asian extreme winters. Our CNN, trained on CESM2-LENS simulations for historical and SSP3-7.0 scenarios and optimized with Amplitude Focal Loss, reliably captures seasonal mean and extreme temperatures. Overall prediction skill increases in the future climate, with warm winter extremes becoming more predictable while cold extremes show little …","abstractTruncated":true,"tier":"other","tierLabel":"其他相关","reportDate":"2026-11-05","tkey":"wx","id":101,"titleZh":"","abstractZh":""},{"title":"Twenty years of Kilimanjaro observations across 5000 m reveal tropical elevation-dependent warming under clear-sky conditions","url":"https://doi.org/10.1038/s41612-026-01560-z","doi":"10.1038/s41612-026-01560-z","journal":"npj Climate and Atmospheric Science","jabbr":"npj Climate and Atmospheric Science","pubdate":"2026-10-05","topic":"气候变化与极端天气","topics":["气候变化与极端天气"],"matchTerm":"climate change","matchWhere":"摘要：climate change","score":3,"authors":["Yaping Mo","Nicholas C. Pepin","Harold Lovell","Yongming Xu"],"authorMore":false,"abstract":"Abstract Mountain regions are experiencing rapid climate change. However, temperature trends along elevation gradients remain poorly understood in the tropics, where long-term high-elevation air temperature (T air) observations are sparse. Here, we examine elevation-dependent warming (EDW) on Mount Kilimanjaro by combining a unique long-term in situ T air transect with Moderate Resolution Imaging Spectroradiometer (MODIS) land-surface temperature (LST), surface and topographic datasets. Using machine learning, we map clear-sky T air at four MODIS overpasses at 1 km resolution for 2004–2024. The models showed strong predictive performance, with RMSE values of 1.76 °C and 1.36 °C, and R 2 …","abstractTruncated":true,"tier":"other","tierLabel":"其他相关","reportDate":"2026-11-05","tkey":"wx","id":102,"titleZh":"","abstractZh":""},{"title":"Niche Divergence-Based Identification of Microbial Indicators Tracking Cyanobacterial Bloom Succession: A Metagenomic and Machine Learning Framework","url":"https://doi.org/10.1021/acs.est.6c04563","doi":"10.1021/acs.est.6c04563","journal":"Environmental Science \u0026 Technology","jabbr":"ES\u0026T","pubdate":"2026-10-03","topic":"生物地球化学","topics":["生物地球化学"],"matchTerm":"biogeochemical","matchWhere":"摘要：biogeochemical","score":3,"authors":["Kaiwen Yang","Zhen Xie","Wei Li","Yi Ren","Xiao Yi Chen","Xinze Wang"],"authorMore":true,"abstract":"Abstract Cyanobacterial harmful algal blooms (CyanoHABs) pose significant environmental and public health risks through toxin production, antibiotic resistance gene dissemination, and the disruption of biogeochemical cycles. Although extensive metagenomic investigations have explored microbial interactions between Cyanobacteria and coexisting members, the potential of incorporating functional indicators into early CyanoHAB monitoring systems remains underexplored. In this study, we employed metagenomic binning combined with machine learning approaches to analyze seasonal cyanobacterial succession and coexisting microbial communities across 19 sites in Erhai Lake across four seasons. We …","abstractTruncated":true,"tier":"other","tierLabel":"其他相关","reportDate":"2026-10-04","tkey":"other","id":103,"titleZh":"","abstractZh":""},{"title":"Dust Loading Increases During Topsoil Flash Droughts Under Rapid Surface Drying and Vegetation Stress","url":"https://doi.org/10.1029/2026gl124553","doi":"10.1029/2026gl124553","journal":"Geophysical Research Letters","jabbr":"GRL","pubdate":"2026-10-03","topic":"遥感","topics":["遥感"],"matchTerm":"satellite","matchWhere":"摘要：satellite","score":3,"authors":["Xuesong Wang","Chunlai Zhang","Xi Chen"],"authorMore":false,"abstract":"Abstract Using satellite‐derived dust optical depth (DOD), reanalysis meteorology, and a global topsoil flash drought (TSFD) inventory for 2003–2022, we find that TSFD events are associated with increased dust loading at the global scale. During TSFD events, 44.7% of land pixels exhibited positive DOD anomalies. The net global DOD anomaly increased significantly over the study period; however, this trend cannot be attributed solely to TSFD‐related effects, as changes in background environmental conditions may also have contributed. Compound TSFD–strong dust (TSFD_SD) events occurred most frequently under sparse vegetation and moderately elevated wind conditions. SHapley Additive exPlanation …","abstractTruncated":true,"tier":"other","tierLabel":"其他相关","reportDate":"2026-10-04","tkey":"other","id":104,"titleZh":"","abstractZh":""},{"title":"Spatiotemporal Dynamics of Growing‐Season Plant‐Available Water in the Continental United States","url":"https://doi.org/10.1029/2026ef009877","doi":"10.1029/2026ef009877","journal":"Earth's Future","jabbr":"Earth's Future","pubdate":"2026-10-01","topic":"气候变化与极端天气","topics":["气候变化与极端天气"],"matchTerm":"drought","matchWhere":"摘要：drought","score":3,"authors":["Sagar Gautam","Chang Gyo Jung","Kunal Poorey","U.W.A. Vitharana","Umakant Mishra"],"authorMore":false,"abstract":"Abstract Plant‐available water (PAW) is a primary regulator of plant growth, ecosystem productivity, and drought resilience, yet its spatial heterogeneity and long‐term response to hydrothermal changes remain poorly quantified at continental scales. Here, we quantify historical (2005–2015) and projected (2030–2100) changes in growing‐season PAW across the continental United States (CONUS) by integrating site‐level soil moisture observations with environmental predictors and bias‐corrected downscaled Coupled Model Intercomparison Project phase six (CMIP6) climate projections. Root‐zone PAW (0–30 cm) was estimated from soil moisture content, field capacity, and wilting point, thereby …","abstractTruncated":true,"tier":"other","tierLabel":"其他相关","reportDate":"2026-11-05","tkey":"wx","id":105,"titleZh":"","abstractZh":""},{"title":"Fingerprint Evidence for Human Effects on Climate: Advances After the 2009 Endangerment Finding","url":"https://doi.org/10.1029/2026ef009129","doi":"10.1029/2026ef009129","journal":"Earth's Future","jabbr":"Earth's Future","pubdate":"2026-10-01","topic":"气候变化与极端天气","topics":["气候变化与极端天气"],"matchTerm":"climate change","matchWhere":"摘要：climate change","score":3,"authors":["Benjamin David Santer","Susan Solomon","David W. J. Thompson","Qiang Fu","Gabriele C. Hegerl"],"authorMore":false,"abstract":"Abstract Here we briefly review key advances in the field of climate fingerprinting. Fingerprint studies rely on pattern information to identify human and natural influences on Earth's climate. Our focus is on advances after 2009—the date of the finding by the U.S. Environmental Protection Agency (EPA) that emissions of six different greenhouse gases affect Earth's climate and endanger human health and welfare. In contrast to the conclusions from a 2025 review of climate science issued by the U.S. Department of Energy (DOE), we demonstrate that post‐2009 scientific advances have markedly increased confidence in the identification of significant anthropogenic contributions to global climate …","abstractTruncated":true,"tier":"other","tierLabel":"其他相关","reportDate":"2026-11-05","tkey":"wx","id":106,"titleZh":"","abstractZh":""},{"title":"Compound Risk and Centralized Desalination: Multi‐Hazard Threats to Water Security","url":"https://doi.org/10.1029/2026ef008999","doi":"10.1029/2026ef008999","journal":"Earth's Future","jabbr":"Earth's Future","pubdate":"2026-10-01","topic":"气候变化与极端天气","topics":["气候变化与极端天气"],"matchTerm":"drought","matchWhere":"摘要：drought","score":3,"authors":["Karol Bot","Natalie De Falco","Noam Weisbrod"],"authorMore":false,"abstract":"Abstract Water security research has long acknowledged that engineered water systems face concurrent threat pathways, yet risk assessment practice remains predominantly single‐hazard. For desalination‐dependent systems—nowhere more than in the Gulf—this simplification is a structural failure. We argue in this Commentary that centralized desalination systems concentrate three mutually reinforcing sources of compound vulnerability: structural compounding—near‐total dependence on desalinated water, extreme concentration of production in a small number of very large facilities, and tight physical coupling of water production to power generation; multi‐hazard concurrence—simultaneous exposure to …","abstractTruncated":true,"tier":"other","tierLabel":"其他相关","reportDate":"2026-11-05","tkey":"wx","id":107,"titleZh":"","abstractZh":""},{"title":"Adaptation Potential of Local Water Management Practices to Glacier Loss","url":"https://doi.org/10.1029/2026ef008697","doi":"10.1029/2026ef008697","journal":"Earth's Future","jabbr":"Earth's Future","pubdate":"2026-10-01","topic":"气候变化与极端天气","topics":["气候变化与极端天气"],"matchTerm":"climate change","matchWhere":"摘要：climate change","score":3,"authors":["Clara Gimeno Jésus","José Cuadros-Adriazola","Simon Moulds","Fabián Drenkhan","Jonathan Mackay","Nilton Montoya"],"authorMore":false,"abstract":"Abstract Climate change disproportionately affects mountain river basins, driving cryospheric changes and altering their hydrology. This has detrimental impacts on water resources, accentuating the need for robust adaptation strategies. Traditional engineering approaches can provide buffering capacity but are associated with high costs and limited flexibility. At the same time, local, small scale water management practices are gaining attention, yet evidence on their effectiveness remains limited. We evaluate the adaptation potential of common local practices, that is, headwater grassland regeneration, small surface storage, and artificial recharge, in the Vilcanota‐Urubamba system, Peru. …","abstractTruncated":true,"tier":"other","tierLabel":"其他相关","reportDate":"2026-11-05","tkey":"wx","id":108,"titleZh":"","abstractZh":""},{"title":"No Net Increase in Ecosystem Water Limitation Under Greenhouse Warming","url":"https://doi.org/10.1029/2026ef008222","doi":"10.1029/2026ef008222","journal":"Earth's Future","jabbr":"Earth's Future","pubdate":"2026-10-01","topic":"气候变化与极端天气","topics":["气候变化与极端天气"],"matchTerm":"climate change","matchWhere":"摘要：climate change","score":3,"authors":["Jiameng Xu","Kaighin A. McColl","Alexis Berg","Yu Liang","Jian Yang","Yuanchao Fan"],"authorMore":false,"abstract":"Abstract Energy and water availability are essential controls on terrestrial ecosystem functions such as evapotranspiration. Accurately identifying the dominant regime of water or energy limitation on evapotranspiration is crucial for understanding ecosystem responses to climate change. Recent studies using Earth System Model (ESM) projections suggest widespread shifts from energy‐ to water‐limited conditions under global warming. We demonstrate that incorporating a thermodynamically appropriate energy indicator fundamentally changes this projection. Surface energy availability for evapotranspiration and related ecosystem functions is primarily determined by net radiation (R n) rather …","abstractTruncated":true,"tier":"other","tierLabel":"其他相关","reportDate":"2026-11-05","tkey":"wx","id":109,"titleZh":"","abstractZh":""},{"title":"Optimizing Hybrid Wind–Solar Systems in Barren Land Under Constraints Imposed by Atmospheric Aerosols","url":"https://agupubs.onlinelibrary.wiley.com/doi/10.1029/2025EF007325?af=R","doi":"10.1029/2025ef007325","journal":"Earth's Future","jabbr":"Earth's Future","pubdate":"2026-10-01","topic":"空气污染","topics":["空气污染"],"matchTerm":"aerosol","matchWhere":"摘要：aerosol","score":3,"authors":["Xuesong Wang","Chunlai Zhang","Zhishan Xia","Jirui Gong"],"authorMore":false,"abstract":"Abstract By using a solar photovoltaic (PV) performance model and applying it to global data from 2000 to 2022, we demonstrated that although the net impact of aerosols on power generation was negative, this loss was almost entirely driven by soiling of panel surfaces and could be mitigated by developing an appropriate cleaning regime. In contrast, aerosol scattering of light under certain atmospheric conditions can locally increase power generation and stabilize output. These insights highlight the necessity of systematic, regionally tailored panel-cleaning protocols—particularly for tracking systems, which are most susceptible to aerosol deposition. Moreover, across regions with …","abstractTruncated":true,"tier":"other","tierLabel":"其他相关","reportDate":"2026-10-04","tkey":"other","id":110,"titleZh":"","abstractZh":""},{"title":"Nonlinear Release of Subinertial Diurnal Internal Tides Forms Spiral Internal Solitary Waves","url":"https://agupubs.onlinelibrary.wiley.com/doi/10.1029/2026GL124590?af=R","doi":"10.1029/2026gl124590","journal":"Geophysical Research Letters","jabbr":"GRL","pubdate":"2026-10-01","topic":"遥感","topics":["遥感"],"matchTerm":"satellite","matchWhere":"摘要：satellite","score":3,"authors":["Zenghao Jiang","Qun Li","Tao Xu","Wenyu Qu","Chengyuan Pang","Xu Chen"],"authorMore":false,"abstract":"Abstract Earth's rotation imposes a dynamical barrier on the free propagation of internal tides at high latitudes, raising questions about the fate of tidal energy poleward of the critical latitude. Satellite observations reveal spiral internal solitary waves (ISWs) along the continental slope of the South Orkney Plateau. Although these waves might be attributed to direct steepening of low-frequency internal tides, theoretical estimates of their propagation speed are nearly twice those inferred from observations. Using high-resolution simulations, we resolve this inconsistency by identifying a topographically steered energy cascade: subinertial diurnal internal tides, initially trapped by …","abstractTruncated":true,"tier":"other","tierLabel":"其他相关","reportDate":"2026-10-04","tkey":"other","id":111,"titleZh":"","abstractZh":""},{"title":"Restoration-driven positive and negative leakage in sub-Saharan Africa","url":"https://doi.org/10.1038/s41893-026-01936-2","doi":"10.1038/s41893-026-01936-2","journal":"Nature Sustainability","jabbr":"Nat Sustain","pubdate":"2026-09-30","topic":"能源地理与全球空间布局","topics":["能源地理与全球空间布局"],"matchTerm":"geospatial","matchWhere":"摘要：geospatial","score":3,"authors":["Xinran Miao","Oscar Morton","Christopher G. Bousfield","Leland K. Werden","Stephen M. Thomas","Thomas Ward Crowther"],"authorMore":false,"abstract":"Abstract Habitat restoration is a cornerstone of global climate and biodiversity policy, with over 350 million ha pledged for restoration by 2030, yet it remains unclear how restoration impacts ‘spill over’ beyond implementation areas. Restoration projects could lead to increased tree loss elsewhere (negative leakage; for example, when restoration replaces timber plantations and/or impacts landowner earnings) or reduced tree loss within project areas and surrounding landscapes (positive leakage; for example, if restoration meets timber or fuelwood resource needs or creates restoration-linked employment). Here we assembled a geospatial dataset of 129,982 restoration polygons (~6.8 million …","abstractTruncated":true,"tier":"other","tierLabel":"其他相关","reportDate":"2026-11-05","tkey":"gis","id":112,"titleZh":"","abstractZh":""},{"title":"Systematic overview of climate actions for health in cities","url":"https://doi.org/10.1038/s44284-026-00515-y","doi":"10.1038/s44284-026-00515-y","journal":"Nature Cities","
