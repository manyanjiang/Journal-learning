jabbr":"Nat Cities","pubdate":"2026-09-29","topic":"气候变化与极端天气","topics":["气候变化与极端天气"],"matchTerm":"climate change","matchWhere":"摘要：climate change","score":3,"authors":["Emma J. Hutchinson","Tobias Magnus Schuster","Melanie A. Crane","James Milner","Kristine Belesova","Roberto Picetti"],"authorMore":false,"abstract":"Abstract Many climate change adaptation and mitigation actions in cities have potential co-impacts for health. This overview of relevant systematic reviews appraises and summarizes available evidence of the effects of implemented city-level actions addressing climate change and health impacts. On the basis of an assessment of confidence in the findings of the 60 reviews identified, the findings from 49 were included in the analysis. Most evidence focused on climate mitigation actions in the transport and buildings sectors and on urban form. Health co-benefits mainly resulted from increased active transport or improved housing. Where reviews provided measures of effect, they suggested only …","abstractTruncated":true,"tier":"other","tierLabel":"其他相关","reportDate":"2026-11-05","tkey":"wx","id":113,"titleZh":"","abstractZh":""},{"title":"A tri‑basin matching index improves Indian Summer Monsoon Rainfall predictability","url":"https://doi.org/10.1038/s41612-026-01553-y","doi":"10.1038/s41612-026-01553-y","journal":"npj Climate and Atmospheric Science","jabbr":"npj Climate and Atmospheric Science","pubdate":"2026-09-29","topic":"气候变化与极端天气","topics":["气候变化与极端天气"],"matchTerm":"climate change","matchWhere":"摘要：climate change","score":3,"authors":["Shiyun Yu","Rong‐Hua Zhang","Lei Fan"],"authorMore":false,"abstract":"Interannual variability of Indian Summer Monsoon Rainfall (ISMR) is vital for South Asian water resources and agriculture, but its prediction is challenged by non-stationary ocean–monsoon interactions. This study proposes a Matching Index (MI), defined as the pointwise product of normalized ISMR and sea surface temperature anomalies, combined with Empirical Orthogonal Function analysis (MI–EOF) to identify state-dependent ocean–monsoon coupling regimes. MI–EOF reveals three dominant regimes: ENSO intensity, distinguishing strong and weak ENSO states modulated by the Indian Ocean Dipole and tropical South Atlantic; ENSO lifecycle, highlighting phase-dependent effects of Indian Ocean Basin …","abstractTruncated":true,"tier":"other","tierLabel":"其他相关","reportDate":"2026-11-05","tkey":"wx","id":114,"titleZh":"","abstractZh":""},{"title":"An historic fishery collapse driven by socioeconomic and environmental factors","url":"https://doi.org/10.1038/s41893-026-01937-1","doi":"10.1038/s41893-026-01937-1","journal":"Nature Sustainability","jabbr":"Nat Sustain","pubdate":"2026-09-28","topic":"气候变化与极端天气","topics":["气候变化与极端天气"],"matchTerm":"climate change","matchWhere":"摘要：climate change","score":3,"authors":["R. Voss","Jörn Oliver Schmidt","Oliver Lehmann","Daniel K. Okamoto","Patrick Polte","Kira Lancker"],"authorMore":false,"abstract":"Abstract In the Late Middle Ages, the western Baltic herring fishery played a central role in Europe. Salted herring was the basis for welfare and political power. We make use of a 450-year time series of Baltic herring catches (1200–1650), to identify which factors drove the herring catch dynamics during different phases of our time series. By the year 1570, the fishery suddenly collapsed, causing large-scale dislocations in trade, with major social and political consequences. Using a recently established bioeconomic stock assessment method based on catch and price data, in tandem with a loop analysis, we find that a combination of climate change, overfishing and socioeconomic factors can …","abstractTruncated":true,"tier":"other","tierLabel":"其他相关","reportDate":"2026-11-05","tkey":"wx","id":115,"titleZh":"","abstractZh":""},{"title":"The impact of financing cost differences on global energy and industry decarbonization","url":"https://doi.org/10.1038/s41558-026-02756-0","doi":"10.1038/s41558-026-02756-0","journal":"Nature Climate Change","jabbr":"Nat Clim Chang","pubdate":"2026-09-24","topic":"综合评估模型（GCAM/IAM）（摘要：integrated assessment model）（摘要：）","topics":["综合评估模型（GCAM/IAM）（摘要：integrated assessment model）（摘要：）"],"matchTerm":"","matchWhere":"","score":3,"authors":["Paul Waidelich","Constance Crassier","Harmen Sytze de Boer","Paul Tautorat","Detlef Peter van Vuuren","Bjarne Steffen"],"authorMore":false,"abstract":"Abstract Integrated assessment models usually neglect differences in financing conditions across countries, sectors and time. This omission could distort outcomes concerning electricity generation and also other sectors. Here we estimate and implement dynamic, country-specific cost of capital (CoC) for eight energy and industry sectors in the IMAGE integrated assessment model. Compared with assuming a uniform low-risk CoC, accounting for developing countries’ investment risks increases global mitigation costs through 2100 for staying well below +2 °C by around 9% and shifts cost-effective mitigation efforts to lower-risk regions. Sector-level analysis shows that using granular CoC estimates …","abstractTruncated":true,"tier":"other","tierLabel":"其他相关","reportDate":"2026-11-05","tkey":"other","id":116,"titleZh":"","abstractZh":""},{"title":"Deep learning trained on high-fidelity climate model simulations extends the skillful prediction of Northern Tropical Atlantic SST anomalies","url":"https://doi.org/10.1038/s41612-026-01546-x","doi":"10.1038/s41612-026-01546-x","journal":"npj Climate and Atmospheric Science","jabbr":"npj Climate and Atmospheric Science","pubdate":"2026-09-16","topic":"气候变化与极端天气","topics":["气候变化与极端天气"],"matchTerm":"climate extremes","matchWhere":"摘要：climate extremes","score":3,"authors":["Ao Liu","Jinqing Zuo","Hui Gao","Steven C. Hardiman","Lijuan Chen","Junhu Zhao"],"authorMore":false,"abstract":"Boreal spring sea surface temperature (SST) anomalies in the northern tropical Atlantic (NTA) are key drivers of global climate extremes, yet their prediction remains challenging for state-of-the-art dynamical models. Deep learning offers promise for seasonal SST prediction but is limited by data scarcity and weak physical interpretability. Here, we develop a convolutional neural network (CNN) framework for NTA prediction and demonstrate that physics-informed training data selection improves performance. Specifically, selecting CMIP6 models that realistically capture the ENSO–NTA teleconnection, rather than using all the CMIP6 models, significantly enhances predictive skill. The CNN trained …","abstractTruncated":true,"tier":"other","tierLabel":"其他相关","reportDate":"2026-11-05","tkey":"wx","id":117,"titleZh":"","abstractZh":""},{"title":"Eurasian Summertime Intraseasonal Oscillation and its impact on compound hot-dry extremes","url":"https://doi.org/10.1038/s41612-026-01549-8","doi":"10.1038/s41612-026-01549-8","journal":"npj Climate and Atmospheric Science","jabbr":"npj Climate and Atmospheric Science","pubdate":"2026-09-15","topic":"气候变化与极端天气","topics":["气候变化与极端天气"],"matchTerm":"drought","matchWhere":"摘要：drought","score":3,"authors":["Jeong‐Hun Kim","Yu Kosaka","Joowan Kim"],"authorMore":false,"abstract":"Mid- to high-latitude intraseasonal dynamics remain an underappreciated driver of summertime compound extremes over the Eurasian continent. Here, we identify the Eurasian Summertime Intraseasonal Oscillation (ESISO), a coherent propagating intraseasonal mode defined by the leading EOF pair of Eurasian summertime surface air temperature variability, using JRA-3Q reanalysis, and examine its future changes through large-ensemble climate simulations (d4PDF). The ESISO propagates southeastward from the Western Siberian Plain toward East Asia via Rossby wave energy dispersion, maintaining a predominantly equivalent barotropic structure. This propagation exerts striking phase-dependent control on …","abstractTruncated":true,"tier":"other","tierLabel":"其他相关","reportDate":"2026-11-05","tkey":"wx","id":118,"titleZh":"","abstractZh":""},{"title":"Combining AI and numerical models for improving short-medium range precipitation prediction","url":"https://doi.org/10.1038/s41612-026-01547-w","doi":"10.1038/s41612-026-01547-w","journal":"npj Climate and Atmospheric Science","jabbr":"npj Climate and Atmospheric Science","pubdate":"2026-09-15","topic":"气候变化与极端天气","topics":["气候变化与极端天气"],"matchTerm":"flood","matchWhere":"摘要：flood","score":3,"authors":["Hanbing Kong","Guoxing Chen","Ziyin Zhang","Wei-Chyung Wang","Jie Feng","Guihua Wang"],"authorMore":false,"abstract":"Short-to-medium-range precipitation forecasts, critical for water resource management and flood risk mitigation, remain challenging for both conventional numerical weather models (NWMs) and rapidly-advancing artificial intelligence (AI)-based models. We present an AI-NWM hybrid approach to improve this task over the Chinese mainland. The approach develops an AI-based model that predicts 24-hour total precipitation using meteorological fields, bypassing uncertainties in NWM cloud parameterizations, and then drives it with NWM-predicted meteorological fields to produce multi-lead daily precipitation forecasts, leveraging the physical consistency of NWM forecasts. Using meteorological …","abstractTruncated":true,"tier":"other","tierLabel":"其他相关","reportDate":"2026-11-05","tkey":"wx","id":119,"titleZh":"","abstractZh":""},{"title":"Incivility in public health policy discussions spills over to public engagement with climate issues: evidence from English-language social media","url":"https://iopscience.iop.org/article/10.1088/1748-9326/aeb682","doi":"10.1088/1748-9326/aeb682","journal":"Environmental Research Letters","jabbr":"ERL","pubdate":"2026-11-03","topic":"气候变化与极端天气","topics":["气候变化与极端天气","减排政策与能源战略"],"matchTerm":"climate change","matchWhere":"摘要：climate change、摘要：climate policy","score":6,"authors":["Hasti Narimanzadeh","Arash Badie-Modiri","Iuliia Smirnova and Ted Hsuan Yun Chen"],"authorMore":false,"abstract":"Abstract Affective polarization and political sorting drive public antagonism around climate change and other issues at the science-policy nexus. We study cross-domain spillover of incivility in public engagements with climate change and public health on English-language Twitter and Reddit using the COVID-19 period as a case study. To assess whether spillover exists between these two policy domains, we examined how the incivility of climate discussions on social media varied by their co-occurrence with COVID-19 content and temporal coincidence with pandemic events. We find strong evidence of the signatures of affective polarization surrounding COVID-19 spilling into the climate change …","abstractTruncated":true,"tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-11-05","tkey":"wx","id":120,"titleZh":"","abstractZh":""},{"title":"Structuring decision-making for systemic climate-financial risk.","url":"https://doi.org/10.1088/1748-9326/aebcfc","doi":"10.1088/1748-9326/aebcfc","journal":"Environmental Research Letters","jabbr":"ERL","pubdate":"2026-11-03","topic":"气候变化与极端天气","topics":["气候变化与极端天气"],"matchTerm":"climate risk","matchWhere":"摘要：climate risk","score":6,"authors":["Tanya Fiedler","Monica Trezise","A. J. Pitman","Ben Rhodri Newell"],"authorMore":false,"abstract":"Abstract Physical climate risks are a source of vulnerability in financial systems, yet existing risk measurement approaches struggle to translate them into decision-relevant metrics, reflecting a mismatch between how climate risk evolves and how financial risk is assessed. Drawing on workshops and interviews with 35 finance and risk professionals (33 from a large financial institution, two from a global insurance broker), we identify six interacting risk domains through which physical climate risk cascades to credit loss, creating decision bottlenecks where routine practice breaks down. Integrating storylines and dynamic adaptive policy pathways, we develop a qualitative–analytical …","abstractTruncated":true,"tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-11-05","tkey":"wx","id":121,"titleZh":"","abstractZh":""},{"title":"Significant albedo-induced cooling effects across tropical and subtropical dryland biomes","url":"https://doi.org/10.1088/1748-9326/aebd00","doi":"10.1088/1748-9326/aebd00","journal":"Environmental Research Letters","jabbr":"ERL","pubdate":"2026-11-03","topic":"CO2减排与碳排放","topics":["CO2减排与碳排放","气候变化与极端天气"],"matchTerm":"carbon dioxide","matchWhere":"摘要：carbon dioxide、摘要：climate mitigation","score":6,"authors":["H. Pei","Jieming Chou","Chaoyang Wang","Jingwen Liu","H. Jin","Peng Zhou"],"authorMore":false,"abstract":"Abstract Terrestrial ecosystems can significantly regulate climate through carbon uptake and alterations in surface albedo. However, current climate mitigation assessments largely focus on carbon sinks while overlooking albedo-induced radiative effects. We developed an integrated framework to quantify the net climate effect of global terrestrial ecosystems from 2001 to 2019 by combining net ecosystem productivity with albedo-induced radiative forcing. We estimated the Net Equivalent Carbon Dioxide Stock Change (NESC), which incorporates both Net Cumulative Carbon uptake Equivalent (NCCE) and the Emission Equivalent of Shortwave Forcing (EESF). Results show that global terrestrial ecosystems …","abstractTruncated":true,"tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-11-05","tkey":"ghg","id":122,"titleZh":"","abstractZh":""},{"title":"Afforestation reshapes wildfire activity across global temperate biomes","url":"https://doi.org/10.1073/pnas.2623623123","doi":"10.1073/pnas.2623623123","journal":"Proceedings of the National Academy of Sciences","jabbr":"PNAS","pubdate":"2026-11-02","topic":"气候变化与极端天气","topics":["气候变化与极端天气","城市与环境空间建模"],"matchTerm":"climate mitigation","matchWhere":"摘要：climate mitigation、摘要：land-use change","score":6,"authors":["Irene Repeto‐Deudero","Alejandro Miranda","Juli G. Pausas","Carlos Hormazábal","Blas Mola‐Yudego","Javier Lopatin"],"authorMore":false,"abstract":"In temperate ecosystems, afforestation is rapidly expanding as a flagship climate mitigation strategy. Yet its impact on wildfires remains poorly understood, raising concerns that establishing planted forests over nonforest areas may intensify wildfire activity under increasingly fire-prone climatic conditions. Here, we combine land-use change data, fire activity records, climatic and anthropogenic covariates to quantify how afforestation alters fire occurrence and burned area across 67,248 patches distributed throughout global temperate biomes using satellite records starting in 2001. We found that, on average, afforestation increased fire occurrence by 26% and burned area by 23% in global …","abstractTruncated":true,"tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-11-05","tkey":"wx","id":123,"titleZh":"","abstractZh":""},{"title":"Durable reactive CO₂ capture exceeding 1,000 h via self-reinforcing molecular catalysts","url":"https://www.nature.com/articles/s41560-026-02159-7","doi":"10.1038/s41560-026-02159-7","journal":"Nature Energy","jabbr":"Nature Energy","pubdate":"2026-10-30","topic":"CO2减排与碳排放","topics":["CO2减排与碳排放","CCUS与地质封存"],"matchTerm":"co2","matchWhere":"摘要：co2、摘要：co2 capture","score":6,"authors":["Zunmin Guo","Feng Li","Cai Wang","Yurou Celine Xiao","Shayan Angizi","Rongyi Wang"],"authorMore":false,"abstract":"Nature Energy, Published online: 30 October 2026; doi:10.1038/s41560-026-02159-7 Reactive CO2 capture integrates carbon capture and electrochemical conversion in a single process, but poor catalyst durability remains a major challenge. Here the authors show that pH-swing-driven acidification accelerates catalyst demetallation and develop a cobalt phthalocyanine catalyst that suppresses metal loss, sustaining efficient CO production for 1,000 h.","abstractTruncated":false,"tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-11-05","tkey":"ghg","id":124,"titleZh":"","abstractZh":""},{"title":"Disentangling dynamic and thermodynamic pathways reveals nonlocal winter climate responses to historical land use and land cover change","url":"https://doi.org/10.1038/s41612-026-01569-4","doi":"10.1038/s41612-026-01569-4","journal":"npj Climate and Atmospheric Science","jabbr":"npj Climate and Atmospheric Science","pubdate":"2026-10-30","topic":"气候变化与极端天气","topics":["气候变化与极端天气","城市与环境空间建模"],"matchTerm":"climate mitigation","matchWhere":"摘要：climate mitigation、摘要：land-use change","score":6,"authors":["Jintao Yang","Renhe Zhang"],"authorMore":false,"abstract":"Historical land use and land cover change (LULCC) can influence both nearby and distant climates through land–atmosphere interactions, yet its non-local climatic impacts remain poorly constrained. One possible explanation is that previous studies conflated non-local effects arising from distinct physical processes. Here we used CMIP6 models to separate the influences of large-scale circulation, thermodynamic advection, and local surface energy balance in winter surface air temperature responses to historical LULCC. We show that circulation-induced changes generate weak but significant warming over the Canada–Greenland region, with negligible signals elsewhere. After removing this dynamic …","abstractTruncated":true,"tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-11-05","tkey":"wx","id":125,"titleZh":"","abstractZh":""},{"title":"Relative Humidity Modulates Nitration and Ring Fragmentation during Heterogeneous Oxidation of Catechol by Nitrate Radicals","url":"https://doi.org/10.1021/acs.est.6c10536","doi":"10.1021/acs.est.6c10536","journal":"Environmental Science \u0026 Technology","jabbr":"ES\u0026T","pubdate":"2026-10-24","topic":"空气污染","topics":["空气污染","大气化学"],"matchTerm":"aerosol","matchWhere":"摘要：aerosol、摘要：secondary organic aerosols","score":6,"authors":["Md. Sohel Rana","Marcelo I. Guzman"],"authorMore":false,"abstract":"Abstract Catechol is an important biomass-burning-derived phenolic compound and a precursor to secondary organic aerosols (SOAs). Although nitrate radicals (NO3) are recognized as major nighttime oxidants, the influence of the aerosol water content on heterogeneous NO3 oxidation of phenolic compounds remains poorly understood. Here, we investigate the impact of relative humidity (RH = 0–90%) on the heterogeneous oxidation of catechol thin films by nitrate radicals generated from the reaction of O3 and NO2. Product formation was characterized using Fourier transform infrared (FTIR) spectroscopy, UV–visible spectroscopy, electrospray ionization mass spectrometry (ESI-MS), ultrahigh-pressure …","abstractTruncated":true,"tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-25","tkey":"other","id":126,"titleZh":"","abstractZh":""},{"title":"Cloud Controlling Factor Analysis Reveals E3SMv3 Structural Bias and Mean State Controls on Stratocumulus Radiative Sensitivity","url":"https://agupubs.onlinelibrary.wiley.com/doi/10.1029/2026GL125263?af=R","doi":"10.1029/2026gl125263","journal":"Geophysical Research Letters","jabbr":"GRL","pubdate":"2026-10-18","topic":"空气污染","topics":["空气污染","遥感"],"matchTerm":"aerosol","matchWhere":"摘要：aerosol、摘要：aerosol optical depth","score":6,"authors":["T. A. Myers","T. Aerenson","D. T. McCoy","M. D. Zelinka","J. M. Nugent","H. Brown"],"authorMore":false,"abstract":"Abstract We investigate marine stratocumulus cloud radiative sensitivity to meteorological and aerosol controlling factors in a perturbed parameter ensemble of the Energy Exascale Earth System Model version 3 (E3SMv3). The ensemble perturbs 25 cloud, convection, and aerosol parameters, spanning diverse cloud behavior. The default simulation and many ensemble members capture observed responses to most controlling factors, but not to surface temperature advection, revealing a structural deficiency in processes linking stratocumulus to advection. Many members also overestimate cloud fraction and radiative responses to inversion strength, free-tropospheric humidity, and sulfate aerosol optical …","abstractTruncated":true,"tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-20","tkey":"other","id":127,"titleZh":"","abstractZh":""},{"title":"Sustainable Use and Management of Bamboo Resources","url":"https://doi.org/10.1146/annurev-environ-022725-103157","doi":"10.1146/annurev-environ-022725-103157","journal":"Annual Review of Environment and Resources","jabbr":"Annu Rev Environ Resour","pubdate":"2026-10-15","topic":"气候变化与极端天气","topics":["气候变化与极端天气","减排政策与能源战略"],"matchTerm":"climate change","matchWhere":"摘要：climate change、摘要：climate policy","score":6,"authors":["Chunyu Pan","Guomo Zhou","Xuekun Cheng","Jiayi Guo","Guangyu Wang","John L. Innes"],"authorMore":false,"abstract":"Bamboo is a widely distributed, renewable resource that can deliver a broad range of green products and ecosystem services while supporting rural livelihoods. It has been increasingly acknowledged as a nature-based solution for mitigating climate change, promoting sustainable development, and facilitating the transition to a circular economy. This review synthesizes current knowledge of the global distribution of bamboo and its ecological functions, product innovations, and emerging role in carbon finance. It identifies major barriers, including those in life-cycle assessments, product standards, and carbon accounting frameworks, that limit bamboo's integration into climate policy. Drawing …","abstractTruncated":true,"tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-11-05","tkey":"wx","id":128,"titleZh":"","abstractZh":""},{"title":"Aging of Urban Traffic Fine Particles Modulates Toxicity Mechanisms and Oxidative Stress Responses","url":"https://doi.org/10.1021/acs.est.6c06323","doi":"10.1021/acs.est.6c06323","journal":"Environmental Science \u0026 Technology","jabbr":"ES\u0026T","pubdate":"2026-10-08","topic":"空气污染","topics":["空气污染","大气化学"],"matchTerm":"air pollution","matchWhere":"摘要：air pollution、摘要：photochemical","score":6,"authors":["Michal Pardo","Noga Kozer","Carolina Molina","Yanfang Chen","Haim Barr","Galit Cohen"],"authorMore":true,"abstract":"Abstract Vehicular emissions are an important source of urban air pollution that can age through atmospheric processes, but how their health effects change during atmospheric aging remains poorly understood. To simulate realistic urban emissions, we sampled air in a parking garage where cold-start and urban emissions coexist. Following aging in an oxidation flow reactor (OFR), we studied the cellular and acellular effects of the fresh and aged aerosols. Photochemical aging in the OFR increased secondary organic aerosol (SOA) mass by up to 6.9-fold, the oxygen-to-carbon (O:C) ratio from 0.26 to 0.79, and both the intrinsic oxidative potential (OPm) and the volume-normalized oxidative …","abstractTruncated":true,"tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-09","tkey":"other","id":129,"titleZh":"","abstractZh":""},{"title":"Measuring energy–agriculture dual production in agrivoltaics: Efficiency metrics, stakeholder decision needs, and implications for land-use decisions","url":"https://doi.org/10.1016/j.rser.2026.117532","doi":"10.1016/j.rser.2026.117532","journal":"Renewable and Sustainable Energy Reviews","jabbr":"Renewable and Sustainable Energy Reviews","pubdate":"2026-10-08","topic":"能源地理与全球空间布局","topics":["能源地理与全球空间布局","生命周期与技术经济评价"],"matchTerm":"siting","matchWhere":"摘要：siting、摘要：levelized cost","score":6,"authors":["Jian Chen","Madhu Khanna","Ruiqing Miao","Matthew O’Neal","John Tyndall","Ajay Nair"],"authorMore":false,"abstract":"Meeting global climate targets will require solar capacity to expand substantially, more than fourfold by 2030 based on some studies, while global food demand is projected to rise by over 40% by 2050, intensifying concerns about competition for land between renewable energy and agriculture. Agrivoltaics (AV) integrates solar generation with agricultural production, but evaluating it involves stakeholders with heterogeneous and sometimes competing objectives, complicating decisions about project design, siting, and land use. Of 1171 publications identified, 635 report efficiency-related measures; reviewing these, we assess how metrics for energy–agriculture dual production align with …","abstractTruncated":true,"tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-11-05","tkey":"gis","id":130,"titleZh":"","abstractZh":""},{"title":"Surface temperatures drive strong seasonality in urban reactive carbon emissions","url":"https://www.science.org/doi/abs/10.1126/sciadv.aef9622?af=R","doi":"10.1126/sciadv.aef9622","journal":"Science Advances","jabbr":"Sci Adv","pubdate":"2026-10-07","topic":"空气污染","topics":["空气污染","大气化学"],"matchTerm":"air quality","matchWhere":"摘要：air quality、摘要：voc","score":6,"authors":["Michael P. Vermeuel","Dylan B. Millet","Róisín Commane","Timothy J. Griffis","Trey A. Maddaleno","Emily B. Franklin"],"authorMore":true,"abstract":"Urban air quality is affected by diverse volatile organic compounds (VOCs), and prior studies reveal a need to understand their seasonal sources. We combine high-resolution mass spectrometry with eddy covariance to quantify VOC fluxes from an urban/suburban New York site during summer and winter. Emissions are strongly seasonal: During summer, twice as many VOCs undergo surface-atmosphere exchange, and molar and reactivity-based fluxes are 2 to 4× higher than in winter. Temperature-dependent emissions from volatile chemical products (VCPs), vegetation, and residences dominate during summer. Ethanol alone accounts for ∼25% of the total flux. During winter, temperature-dependent emissions are …","abstractTruncated":true,"tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-08","tkey":"other","id":131,"titleZh":"","abstractZh":""},{"title":"Spatially Refined Analysis of Emission Burdens and Equity from Light-, Medium-, and Heavy-Duty Vehicle Traffic in the United States","url":"https://doi.org/10.1021/acs.est.6c12227","doi":"10.1021/acs.est.6c12227","journal":"Environmental Science \u0026 Technology","jabbr":"ES\u0026T","pubdate":"2026-10-07","topic":"空气污染","topics":["空气污染","大气化学"],"matchTerm":"particulate matter","matchWhere":"摘要：particulate matter、摘要：nox","score":6,"authors":["Brittany Antonczak","Clare Nelson","Tammy M. Thompson","Mindi W. DePaola","Gregory Rowangould"],"authorMore":false,"abstract":"Abstract We estimate block-level emission intensities of nitrogen oxides (NOX) and fine particulate matter (PM2.5) from on-road vehicle traffic for every census block in the United States, combining MOVES-based emission factors with street level traffic data. We use this spatially refined, computationally efficient, and policy-sensitive metric to evaluate emissions burden. Despite comprising less than 11% of vehicle kilometers traveled, we find that medium- and heavy-duty trucks account for 46% of NOX and 50% of PM2.5 emission burden nationally ─ with PM2.5 burden from trucks dominated by exhaust emissions while tire and brake wear constitute nearly half of light-duty vehicle PM2.5 burden. …","abstractTruncated":true,"tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-08","tkey":"other","id":132,"titleZh":"","abstractZh":""},{"title":"The 2023–2024 El Niño as a Preview of Future Tropical Forest Climate","url":"https://agupubs.onlinelibrary.wiley.com/doi/10.1029/2026EF008071?af=R","doi":"10.1029/2026ef008071","journal":"Earth's Future","jabbr":"Earth's Future","pubdate":"2026-10-07","topic":"遥感","topics":["遥感","生物地球化学"],"matchTerm":"satellite","matchWhere":"摘要：satellite、摘要：carbon cycle","score":6,"authors":[],"authorMore":false,"abstract":"Abstract Tropical forests are an important component of the global carbon cycle. Increasingly frequent droughts and heatwaves are undermining their resilience, with far-reaching impacts on local livelihoods and on regional and global hydrological cycles. El Niño events, recurring climate patterns that lead to dry and hot conditions across multiple tropical regions, have always influenced these dynamics, but the 2023–2024 El Niño produced extreme droughts and heatwaves that exceeded the typical El Niño footprint. Here, we place the 2023–2024 El Niño in both past (2000–2024) and future (2025–2100) climatic contexts across pantropical forests. We assess its climatic magnitude using ensembles …","abstractTruncated":true,"tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-09","tkey":"other","id":133,"titleZh":"","abstractZh":""},{"title":"Reactive Oxygen Species Trigger Rapid Natural Purification of Soils and Water in Wetlands","url":"https://doi.org/10.1021/acs.est.6c06553","doi":"10.1021/acs.est.6c06553","journal":"Environmental Science \u0026 Technology","jabbr":"ES\u0026T","pubdate":"2026-10-01","topic":"大气化学","topics":["大气化学","生物地球化学"],"matchTerm":"photochemical","matchWhere":"摘要：photochemical、摘要：biogeochemical","score":6,"authors":["Binbin Wu","Jingyi Wang","Guanghui Yu","Liang Mao","Lin Xu","Guodong Fang"],"authorMore":true,"abstract":"Abstract Wetlands, often referred to as the “Earth’s kidneys”, are essential ecosystems that filter pollutants and regulate biogeochemical processes. However, the mechanisms underlying their rapid self-purification are still in their infancy and lack deep understanding. Here, we propose that reactive oxygen species (ROS) constitute an intrinsic oxidative network that drives accelerated pollutant transformation in wetlands. We summarize that ROS are generated through coupled photochemical and redox-driven processes and are highly concentrated at environmental interfaces, including soil–water, fluctuating redox boundaries, and rhizosphere. These interfaces function as reactive hotspots where …","abstractTruncated":true,"tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-04","tkey":"other","id":134,"titleZh":"","abstractZh":""},{"title":"Saturation‐Constrained and Spatially Heterogeneous Soil Organic Carbon Sequestration Following Bare Land Restoration in China","url":"https://doi.org/10.1029/2026ef008952","doi":"10.1029/2026ef008952","journal":"Earth's Future","jabbr":"Earth's Future","pubdate":"2026-10-01","topic":"能源地理与全球空间布局","topics":["能源地理与全球空间布局","气候变化与极端天气"],"matchTerm":"spatially explicit","matchWhere":"摘要：spatially explicit、摘要：climate mitigation","score":6,"authors":["Yinchuan Xiang","Lei Deng","Liangyuke Liu","Jianzhao Wu","Xiaozhen Wang","Shihe Zhang"],"authorMore":false,"abstract":"Abstract Soil organic carbon (SOC) sequestration represents a critical nature‐based strategy for atmospheric CO₂ mitigation. Yet, the magnitudes and dynamics of SOC accrual following bare land restoration have not been rigorously quantified at a large scale. By integrating field‐based observations with a spatially explicit machine learning framework, this study systematically evaluated the drivers, optimization pathways and SOC sequestration potential of bare land restoration across China. Results reveal that SOC accrual follows a distinct three‐stage pattern: rapid accumulation (0–17 years), a restoration bottleneck (17–30 years), and slow accumulation toward SOC saturation (\u003e30 years). …","abstractTruncated":true,"tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-11-05","tkey":"gis","id":135,"titleZh":"","abstractZh":""},{"title":"Exploring European forest management futures: a stakeholder-informed spatial scenario modeling approach","url":"https://doi.org/10.1016/j.gloenvcha.2026.103236","doi":"10.1016/j.gloenvcha.2026.103236","journal":"Global Environmental Change","jabbr":"Global Environmental Change","pubdate":"2026-09-20","topic":"能源地理与全球空间布局","topics":["能源地理与全球空间布局","气候变化与极端天气"],"matchTerm":"spatially explicit","matchWhere":"摘要：spatially explicit、摘要：climate change","score":6,"authors":["Niek Scherpenhuijzen","Thales A. P. West","Daniel Di Marzo","Peter H. Verburg"],"authorMore":false,"ab 8/1748-9326/aebcff","journal":"Environmental Research Letters","jabbr":"ERL","pubdate":"2026-11-03","topic":"气候变化与极端天气","topics":["气候变化与极端天气"],"matchTerm":"drought","matchWhere":"标题：drought","score":9,"authors":["Ertuğrul Gül"],"authorMore":false,"abstract":"Abstract Machine-learning drought studies typically regress a smooth, autocorrelated index at single stations and report near-perfect fits. Temporal leakage is rarely controlled, and the skill the index already carries in its own history is rarely separated out. Here we present HydroSPI-ARX, an autoregressive and explainable framework for drought early warning over Türkiye. It recasts the Standardized Precipitation Index (SPI) as a leakage-controlled, lead-resolved classification target built from ERA5 and ERA5-Land hydroclimatic fields. Five drought targets are evaluated at leads of one, three, six and twelve months, with feature selection and scaling recomputed inside every training fold. …","abstractTruncated":true,"tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-11-05","tkey":"wx","id":152,"titleZh":"","abstractZh":""},{"title":"A scoping review of psychosocial factors of climate change inaction: Implications for climate change communication and education","url":"https://doi.org/10.1088/1748-9326/aebcfd","doi":"10.1088/1748-9326/aebcfd","journal":"Environmental Research Letters","jabbr":"ERL","pubdate":"2026-11-03","topic":"气候变化与极端天气","topics":["气候变化与极端天气"],"matchTerm":"climate change","matchWhere":"标题：climate change","score":9,"authors":["Nicole M. Ardoin","Alison W. Bowers","Kathleen O’Connor","Marcia McKenzie"],"authorMore":false,"abstract":"Abstract Climate change communication and education efforts often focus on the cognitive aspects of addressing climate change, emphasizing that a key path to solving climate change-related challenges may be achieved through an educated public that better understands the science of this issue. However, despite decades of information-heavy communication and education efforts, designed with knowledge-related outcomes in mind, meaningful and sustained action to address climate change has yet to occur at a broad scale. This lack of effective, sustained action has motivated researchers from a range of fields to examine other factors that prevent climate change action. We undertook a systematic …","abstractTruncated":true,"tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-11-05","tkey":"wx","id":153,"titleZh":"","abstractZh":""},{"title":"Southeast Asian voices on climate change","url":"https://www.nature.com/articles/s41558-026-02783-x","doi":"10.1038/s41558-026-02783-x","journal":"Nature Climate Change","jabbr":"Nat Clim Chang","pubdate":"2026-11-02","topic":"气候变化与极端天气","topics":["气候变化与极端天气"],"matchTerm":"climate change","matchWhere":"标题：climate change","score":9,"authors":["Netra Eng","Inayah Hidayati","Hồng Xuân Đỗ","Ma. Laurice Jamero","Adi Jaya","Pinida Leelapanang Kamphaengthong"],"authorMore":false,"abstract":"Nature Climate Change, Published online: 02 November 2026; doi:10.1038/s41558-026-02783-x Responding to the increasing risks of climate change in Southeast Asia requires research and effective action that considers the unique challenges of the region. In this Viewpoint, researchers and practitioners from the region share their views on the progress made in understanding and responding to climate change.","abstractTruncated":false,"tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-11-05","tkey":"wx","id":154,"titleZh":"","abstractZh":""},{"title":"Fingerprints of Airborne Plastics in Urban PM2.5: Applications and Implications","url":"https://doi.org/10.1021/acs.est.6c09617","doi":"10.1021/acs.est.6c09617","journal":"Environmental Science \u0026 Technology","jabbr":"ES\u0026T","pubdate":"2026-11-02","topic":"空气污染","topics":["空气污染"],"matchTerm":"pm2.5","matchWhere":"标题：pm2.5","score":9,"authors":["Xiaorui Wu","Liya E. Yu"],"authorMore":false,"abstract":"Abstract To better identify emission sou d estimates. In this study, we develop a semi‐parametric statistical framework that constrains flood variability using a bounded logistic link function and estimates parameters from hydroclimatically analogous samples. Using 548 natural basins across the coterminous United States, we evaluate the proposed approach against log‐linear formulations from …","abstractTruncated":true,"tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-25","tkey":"other","id":197,"titleZh":"","abstractZh":""},{"title":"Financial contagion of climate risk: evidence from cross-industry complex networks and machine learning","url":"https://doi.org/10.1016/j.eneco.2026.109670","doi":"10.1016/j.eneco.2026.109670","journal":"Energy Economics","jabbr":"Energy Economics","pubdate":"2026-10-24","topic":"气候变化与极端天气","topics":["气候变化与极端天气"],"matchTerm":"climate risk","matchWhere":"标题：climate risk","score":9,"authors":["Xiao-Li Gong","Zhang Xiu-chao","Xiong Xiong"],"authorMore":false,"abstract":"","abstractTruncated":false,"tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-11-05","tkey":"wx","id":198,"titleZh":"","abstractZh":""},{"title":"Evaluating Emergency Emission Controls During an Unprecedented Regional Haze Event Using Causal Machine Learning","url":"https://doi.org/10.1021/acs.est.6c12991","doi":"10.1021/acs.est.6c12991","journal":"Environmental Science \u0026 Technology","jabbr":"ES\u0026T","pubdate":"2026-10-23","topic":"空气污染","topics":["空气污染"],"matchTerm":"haze","matchWhere":"标题：haze","score":9,"authors":["Weizhao Liang","Wubin Zhu","Qili Dai","Ruihong Feng","Jing Ding","Baoshuang Liu"],"authorMore":true,"abstract":"Abstract Emergency emission controls are widely implemented to mitigate severe haze, yet their effectiveness is difficult to disentangle from meteorological variability and concurrent changes in activities. Here, we develop a three-step evaluation approach integrating air quality meteorological normalization, augmented synthetic control, and machine-learning title":"Putting a time scale on emerging climate change stressors: a Vulnerability Index for Atlantic Ocean marine ecosystem services","url":"https://doi.org/10.1016/j.gloenvcha.2026.103251","doi":"10.1016/j.gloenvcha.2026.103251","journal":"Global Environmental Change","jabbr":"Global Environmental Change","pubdate":"2026-10-23","topic":"气候变化与极端天气","topics":["气候变化与极端天气"],"matchTerm":"climate change","matchWhere":"标题：climate change","score":9,"authors":["Alexandra Loveridge","Zoe Jacobs","Stephen Kelly","Andrew Yool","Stefanie Rynders","S. Jevrejeva"],"authorMore":false,"abstract":"Marine ecosystem services underpin human wellbeing and support resilient socio-ecological systems, yet existing vulnerability assessments remain fragmented, often focusing on isolated industries and overlooking the whole-system socio-ecological context. To bridge this gap, we develop a comprehensive Vulnerability Index to assess marine ecosystem service vulnerability to emerging climate stressors in the Atlantic. Using high-resolution ocean simulations and moving beyond traditional long-term projections, we employ the Time of Emergence metric to address actionable decision-making timescales (2–3 decades). We found that all Atlantic marine ecosystem services are projected to be exposed to …","abstractTruncated":true,"tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-11-05","tkey":"wx","id":201,"titleZh":"","abstractZh":""},{"title":"Heatwave-induced capacity bottlenecks in European electricity grids","url":"https://doi.org/10.1038/s41560-026-02151-1","doi":"10.1038/s41560-026-02151-1","journal":"Nature Energy","jabbr":"Nature Energy","pubdate":"2026-10-22","topic":"气候变化与极端天气","topics":["气候变化与极端天气"],"matchTerm":"heatwave","matchWhere":"标题：heatwave","score":9,"authors":["Enming Liang","Minghua Chen","Srinivasan Keshav"],"authorMore":false,"abstract":"Abstract Heatwaves are becoming more frequent, intense and prolonged as the climate warms, placing stress on the electricity infrastructure underpinning modern societies. Yet how rising temperatures erode grid capacity remains under-quantified. Existing power-flow models either oversimplify thermal effects or become computationally intractable when resolving them in detail. Here we introduce a unified, computationally efficient framework that jointly captures temperature-dependent demand, generator derating and spatially resolved transmission-line thermal limits within an alternating-current optimal power-flow formulation. Applying it to the Western European system with open-access grid, …","abstractTruncated":true,"tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-11-05","tkey":"wx","id":202,"titleZh":"","abstractZh":""},{"title":"Purple Phototrophic Bacteria as a Novel Platform for Coenzyme Q10 Production from CO2, Syngas, and Sulfur Waste Byproducts","url":"https://doi.org/10.1021/acs.est.6c07111","doi":"10.1021/acs.est.6c07111","journal":"Environmental Science \u0026 Technology","jabbr":"ES\u0026T","pubdate":"2026-10-22","topic":"温室气体","topics":["温室气体"],"matchTerm":"co2","matchWhere":"标题：co2","score":9,"authors":["Elisa Huang-Lin","Raquel Lebrero","Sara Cantera"],"authorMore":false,"abstract":"Abstract The efficient conversion of CO2 and industrial waste streams into value-added products remains a critical challenge for sustainable microbial processes. Here, we present the first systematic demonstration of purple phototrophic bacteria (PPB) as platforms for the autotrophic valorization of CO2 and industrial off-gases or sulfur byproducts into valuable metabolites. Genome-guided screening combined with experimental validation identified strains capable of coupling photoautotrophic growth with the production of CoQ10 and carotenoid pigments. Among them, Rhodospirillum rubrum DSM 467 and DSM 107 exhibited the highest performance, maintaining stable CO2 and H2 consumption under …","abstractTruncated":true,"tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-23","tkey":"other","id":203,"titleZh":"","abstractZh":""},{"title":"Initial affect shapes risk-benefit information processing and public support for carbon dioxide removal technologies","url":"https://doi.org/10.1088/1748-9326/aeb81e","doi":"10.1088/1748-9326/aeb81e","journal":"Environmental Research Letters","jabbr":"ERL","pubdate":"2026-10-22","topic":"温室气体","topics":["温室气体"],"matchTerm":"carbon dioxide","matchWhere":"标题：carbon dioxide","score":9,"authors":["Jessica F. van Veen","Zahra Rahmani Azad","Gabrielle Wong-Parodi","Ulf J. J. J. J. Hahnel"],"authorMore":false,"abstract":"Abstract Given the accelerating climate crisis, carbon dioxide removal (CDR) technologies are becoming increasingly important, while public support may play a relevant role in their implementation. This support is influenced by how citizens inform themselves about the technology. While prior research has examined public support under conditions of no or predefined information provision, little is known about the factors that shape how individuals actively select information about CDR and integrate it into their preferences about the technology. Here, we investigate how initial affect towards CDR shapes laypersons’ selection and evaluation of benefit-related versus risk-related information …","abstractTruncated":true,"tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-23","tkey":"other","id":204,"titleZh":"","abstractZh":""},{"title":"Thermodynamic characteristics and off-design performance of a direct heated supercritical CO2 Brayton cycle driven by solar-biomass complementarity","url":"https://doi.org/10.1016/j.renene.2026.126599","doi":"10.1016/j.renene.2026.126599","journal":"Renewable Energy","jabbr":"Renewable Energy","pubdate":"2026-10-21","topic":"CO2减排与碳排放","topics":["CO2减排与碳排放"],"matchTerm":"co2","matchWhere":"标题：co2","score":9,"authors":["Qiujie Cheng","Yunlong Zhou","Mei Yang"],"authorMore":false,"abstract":"","abstractTruncated":false,"tier":"worth_reading","tierLabel":"值得一读","report
