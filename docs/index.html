<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>个人文献中心 · 文献卡片墙</title>
<style>
:root{
  --bg:#f1f2f4; --card:#fff; --ink:#1c1c1e; --ink2:#63636d; --ink3:#9d9da8;
  --line:#eeeef2; --red:#ff2442; --radius:16px;
  --sh:0 1px 2px rgba(16,16,24,.05), 0 6px 20px rgba(16,16,24,.06);
  --sh-hover:0 2px 6px rgba(16,16,24,.07), 0 14px 34px rgba(16,16,24,.12);
  --air-a:#ffb27a; --air-b:#ff5f7e;
  --rs-a:#63b3ff;  --rs-b:#3a5ce0;
  --chem-a:#c3a0ff; --chem-b:#7048e8;
  --bgc-a:#6ee0a8;  --bgc-b:#0b9e73;
  --ghg-a:#f7c95c;  --ghg-b:#b87300;
  --wx-a:#ff8494;   --wx-b:#c1121f;
  --gis-a:#5ed6c4;  --gis-b:#0d8f9e;
  --other-a:#c9ccd4; --other-b:#8b90a0;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility; padding-bottom:56px;
}
a{color:inherit;text-decoration:none}
svg.ic{display:block;flex:none}

.topbar{
  position:sticky; top:0; z-index:60; background:rgba(241,242,244,.84);
  backdrop-filter:saturate(180%) blur(16px); -webkit-backdrop-filter:saturate(180%) blur(16px);
  border-bottom:1px solid rgba(0,0,0,.05);
}
.topbar-in{max-width:1560px;margin:0 auto;padding:14px 22px 0}
.brand{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.logo{
  width:30px;height:30px;border-radius:9px;flex:none;
  background:linear-gradient(135deg,var(--red),#ff7a59);
  display:grid;place-items:center;color:#fff;font-weight:800;font-size:15px;
  box-shadow:0 3px 10px rgba(255,36,66,.32);
}
.brand h1{font-size:17px;margin:0;font-weight:800;letter-spacing:.2px}
.brand .sub{font-size:12.5px;color:var(--ink3);margin-left:2px}
.brand .spacer{flex:1}
.kpi{display:flex;gap:6px;flex-wrap:wrap}
.kpi span{font-size:12px;color:var(--ink2);background:#fff;border:1px solid var(--line);padding:3px 9px;border-radius:999px;white-space:nowrap}
.kpi b{color:var(--red);font-weight:700}

.controls{max-width:1560px;margin:0 auto;padding:12px 22px;display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{
  border:1px solid var(--line);background:#fff;color:var(--ink2);
  font-size:13.5px;font-weight:600;padding:7px 14px;border-radius:999px;cursor:pointer;
  white-space:nowrap;transition:.16s;display:flex;align-items:center;gap:7px;font-family:inherit;
}
.tab svg{width:15px;height:15px;stroke-width:1.9}
.tab:hover{border-color:#dcdce4;transform:translateY(-1px)}
.tab .n{font-size:11.5px;color:var(--ink3);font-weight:600}
.tab.on{background:var(--ink);border-color:var(--ink);color:#fff}
.tab.on .n{color:rgba(255,255,255,.66)}
.tab.on svg{stroke-width:2}
.search{
  flex:1;min-width:180px;max-width:340px;border:1px solid var(--line);background:#fff;border-radius:999px;
  padding:8px 15px;font-size:13.5px;outline:none;font-family:inherit;color:var(--ink);transition:.16s;
}
.search:focus{border-color:#ffc2cc;box-shadow:0 0 0 3px rgba(255,36,66,.09)}
.search::placeholder{color:var(--ink3)}
.seg{display:flex;background:#fff;border:1px solid var(--line);border-radius:999px;padding:2px}
.seg button{border:0;background:transparent;font-size:12.5px;padding:5px 12px;border-radius:999px;cursor:pointer;color:var(--ink2);font-family:inherit;transition:.16s}
.seg button.on{background:var(--ink);color:#fff;font-weight:600}
.count{font-size:12.5px;color:var(--ink3);margin-left:auto;white-space:nowrap}
.local-controls{justify-content:space-between}
.local-note{font-size:12px;color:var(--ink3)}

.grouphead{max-width:1560px;margin:24px auto 0;padding:0 22px;display:flex;align-items:center;gap:10px}
.grouphead h2{font-size:15.5px;margin:0;font-weight:800;display:flex;align-items:center;gap:8px}
.grouphead h2 svg{width:18px;height:18px;stroke-width:1.9}
.grouphead .bar{flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
.grouphead .gn{font-size:12.5px;color:var(--ink3);font-weight:600}
.g-air h2{color:#e8455f} .g-rs h2{color:#3a5ce0} .g-chem h2{color:#7048e8} .g-bgc h2{color:#0b9e73} .g-ghg h2{color:#b87300} .g-wx h2{color:#c1121f} .g-gis h2{color:#0d8f9e}

.wall{max-width:1560px;margin:0 auto;padding:14px 22px 0;columns:4;column-gap:16px}
@media(max-width:1380px){.wall{columns:3}}
@media(max-width:1000px){.wall{columns:2}}
@media(max-width:620px){
  .wall{columns:1}
  .topbar-in,.controls,.wall,.grouphead{padding-left:14px;padding-right:14px}
  .kpi{display:none}
}
.card{
  break-inside:avoid; -webkit-column-break-inside:avoid; page-break-inside:avoid;
  background:var(--card);border-radius:var(--radius);overflow:hidden;
  box-shadow:var(--sh);margin:0 0 16px;cursor:pointer;
  transition:transform .18s cubic-bezier(.2,.8,.2,1),box-shadow .18s;
  display:inline-block;width:100%;vertical-align:top;
}
.card:hover{transform:translateY(-3px);box-shadow:var(--sh-hover)}

.cover{position:relative;height:108px;overflow:hidden}
.cover::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background-image:radial-gradient(rgba(255,255,255,.3) 1px,transparent 1px);
  background-size:14px 14px;opacity:.45;
}
.t-air .cover{background:linear-gradient(135deg,var(--air-a),var(--air-b))}
.t-rs  .cover{background:linear-gradient(135deg,var(--rs-a),var(--rs-b))}
.t-chem .cover{background:linear-gradient(135deg,var(--chem-a),var(--chem-b))}
.t-bgc .cover{background:linear-gradient(135deg,var(--bgc-a),var(--bgc-b))}
.t-ghg .cover{background:linear-gradient(135deg,var(--ghg-a),var(--ghg-b))}
.t-wx .cover{background:linear-gradient(135deg,var(--wx-a),var(--wx-b))}
.t-gis .cover{background:linear-gradient(135deg,var(--gis-a),var(--gis-b))}
.t-other .cover{background:linear-gradient(135deg,var(--other-a),var(--other-b))}
.cover .icon{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:#fff;opacity:.28;width:76px;height:76px;z-index:1}
.cover .icon svg{width:100%;height:100%;stroke-width:1.25}
.cover .jr{
  position:absolute;left:12px;bottom:11px;right:60px;color:#fff;font-size:13px;font-weight:800;
  letter-spacing:.3px;text-shadow:0 1px 6px rgba(0,0,0,.25);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;z-index:2;
}
.cover .tp{
  position:absolute;left:12px;top:10px;background:rgba(255,255,255,.95);color:#2a2a30;
  font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;z-index:2;
  box-shadow:0 1px 4px rgba(0,0,0,.1);
}
.cover .sc{
  position:absolute;right:12px;top:10px;background:rgba(0,0,0,.28);color:#fff;font-size:11px;
  font-weight:700;padding:3px 9px;border-radius:999px;z-index:2;backdrop-filter:blur(4px);
  font-variant-numeric:tabular-nums;
}
.tier{position:absolute;left:0;bottom:0;height:3px;width:100%;z-index:2}
.tier.must_read{background:#ff2442}
.tier.worth_reading{background:#ffab2e}
.tier.other{background:rgba(255,255,255,.6)}

.body{padding:12px 14px 11px}
.title{font-size:14.5px;font-weight:700;line-height:1.42;margin:0 0 7px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.excerpt{font-size:12.5px;line-height:1.62;color:var(--ink2);margin:0;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.excerpt.none{color:var(--ink3);font-style:italic;font-size:12px;-webkit-line-clamp:2}
.translation{margin-top:9px;padding:8px 9px;border-left:2px solid #4d8c72;background:#f2f7f4;color:#385548}
.translation-label{font-size:10.5px;font-weight:800;color:#47755f;margin:0 0 4px}
.translation-title{font-size:12.5px;font-weight:700;line-height:1.5;margin:0 0 3px}
.translation-abstract{font-size:11.5px;line-height:1.55;margin:0;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.translation-pending{font-size:11px;color:var(--ink3);margin:0}
.tagrow{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.tag{font-size:11px;padding:2px 8px;border-radius:6px;background:#f4f5f7;color:var(--ink2);font-weight:600;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag.must_read{background:#ffe9ed;color:#e01b39}
.tag.worth_reading{background:#fff4e3;color:#c67a00}
.tag.other{background:#f0f1f4;color:#7c8090}
.tag.match{background:#eef4ff;color:#3a5ce0}
.tag.cross{background:#e6f7f5;color:#0d8f9e}
.tag.record{background:#edf7f1;color:#26734d}
.tag.saved{background:#fff3dc;color:#986400}

.foot{display:flex;align-items:center;gap:8px;padding:9px 14px;border-top:1px solid var(--line);background:#fcfcfd}
.av{width:22px;height:22px;border-radius:50%;flex:none;color:#fff;display:grid;place-items:center;font-size:11px;font-weight:800}
.t-air .av{background:linear-gradient(135deg,var(--air-a),var(--air-b))}
.t-rs .av{background:linear-gradient(135deg,var(--rs-a),var(--rs-b))}
.t-chem .av{background:linear-gradient(135deg,var(--chem-a),var(--chem-b))}
.t-bgc .av{background:linear-gradient(135deg,var(--bgc-a),var(--bgc-b))}
.t-ghg .av{background:linear-gradient(135deg,var(--ghg-a),var(--ghg-b))}
.t-wx .av{background:linear-gradient(135deg,var(--wx-a),var(--wx-b))}
.t-gis .av{background:linear-gradient(135deg,var(--gis-a),var(--gis-b))}
.t-other .av{background:linear-gradient(135deg,var(--other-a),var(--other-b))}
.au{font-size:12px;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.dt{font-size:11.5px;color:var(--ink3);white-space:nowrap;font-variant-numeric:tabular-nums}

.empty{max-width:1560px;margin:70px auto;text-align:center;color:var(--ink3);font-size:14px}
.empty svg{width:44px;height:44px;margin:0 auto 12px;stroke-width:1.5;opacity:.5;display:block}

.mask{position:fixed;inset:0;background:rgba(20,20,26,.5);z-index:100;display:none;align-items:center;justify-content:center;padding:24px;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.mask.on{display:flex;animation:fade .16s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{background:#fff;border-radius:20px;max-width:760px;width:100%;max-height:86vh;overflow:auto;box-shadow:0 24px 70px rgba(0,0,0,.3);animation:pop .2s cubic-bezier(.2,.9,.3,1.2)}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
.mhead{position:relative;padding:18px 22px 16px;color:#fff;overflow:hidden}
.mhead::after{content:"";position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(rgba(255,255,255,.26) 1px,transparent 1px);background-size:16px 16px;opacity:.4}
.mhead .mj{font-size:12.5px;font-weight:700;opacity:.95;position:relative;z-index:2;letter-spacing:.3px}
.mhead h3{font-size:18px;line-height:1.42;margin:8px 0 0;position:relative;z-index:2;font-weight:800;text-shadow:0 1px 8px rgba(0,0,0,.18);padding-right:26px}
.mmeta{display:flex;gap:8px;flex-wrap:wrap;position:relative;z-index:2;margin-top:11px}
.mmeta span{background:rgba(255,255,255,.95);color:#2a2a30;font-size:11.5px;font-weight:700;padding:3px 10px;border-radius:999px}
.mclose{position:absolute;right:14px;top:14px;z-index:3;border:0;cursor:pointer;width:30px;height:30px;border-radius:50%;background:rgba(0,0,0,.22);color:#fff;font-size:16px;line-height:1;display:grid;place-items:center;font-family:inherit}
.mclose:hover{background:rgba(0,0,0,.36)}
.mbody{padding:18px 22px 22px}
.sec-t{font-size:11.5px;font-weight:800;color:var(--ink3);letter-spacing:.8px;margin:0 0 8px}
.abs{font-size:14px;line-height:1.78;color:#33333a;margin:0 0 20px;white-space:pre-wrap}
.authors{font-size:13.5px;line-height:1.7;color:var(--ink2);margin:0 0 18px}
.kv{font-size:12.5px;color:var(--ink2);line-height:1.9;margin:0 0 18px}
.kv code{background:#f4f5f7;padding:2px 7px;border-radius:5px;font-size:12px;color:#3a3a44}
.linkrow{display:flex;gap:9px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;font-weight:700;padding:9px 17px;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer;font-family:inherit;transition:.16s}
.btn:hover{border-color:#d8d8e0;transform:translateY(-1px)}
.btn.pri{background:var(--red);border-color:var(--red);color:#fff;box-shadow:0 3px 12px rgba(255,36,66,.28)}
.btn.pri:hover{background:#f01a38}
.personal-actions{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 18px}
.note-label{display:block;font-size:12px;font-weight:700;color:var(--ink2);margin:0 0 7px}
.note-input{display:block;width:100%;min-height:96px;resize:vertical;border:1px solid var(--line);border-radius:8px;padding:10px 12px;font:inherit;font-size:13px;line-height:1.6;color:var(--ink);outline:none;margin-bottom:18px}
.note-input:focus{border-color:#a9c6bb;box-shadow:0 0 0 3px rgba(38,115,77,.08)}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-in">
    <div class="brand">
      <div class="logo">J</div>
      <h1>个人文献中心 · 文献卡片墙</h1>

      <div class="spacer"></div>
      <div class="kpi">
        <span>总文献 <b>155</b></span>

        <button data-state="read" type="button">已读</button>
        <button data-state="saved" type="button">收藏</button>
      </div>
      <span class="local-note">阅读状态与笔记保存在此浏览器</span>
    </div>
  </div>
</div>

<div id="wall-wrap"></div>

<div class="mask" id="mask">
  <div class="modal" id="modal" onclick="event.stopPropagation()"></div>
</div>

ea-level and biodiversity dynamics during the Cambrian SPICE event","url":"https://doi.org/10.1038/s41467-026-78601-x","doi":"10.1038/s41467-026-78601-x","journal":"Nature Communications","jabbr":"Nat Commun","pubdate":"2026-10-24","topic":"生物地球化学","topics":["生物地球化学"],"matchTerm":"biogeochemical","matchWhere":"摘要：biogeochemical","score":3,"authors":["Meng Wang","Yukun Shi","Aihua Yang","Haotian Zhang","Xiaoyu Zhang","Yujing Wu"],"authorMore":true,"abstract":"The prominent Cambrian Steptoean Positive Carbon Isotope Excursion (SPICE) stands as one of Earth’s largest carbon cycle perturbations, marked by widespread marine anoxia, climatic upheaval, and biotic turnover, yet the complete extent and interplay of these environmental changes remain unclear. Here, we integrate high-resolution astrochronology, carbonate carbon isotope records from the North China Block and marine species richness to investigate sedimentary and biogeochemical responses during the SPICE interval. Time series analysis reveals a distinct ~2-million-year sedimentary rhythm that aligns with cycles in reconstructed sea-level fluctuations and biodiversity dynamics. We show that …","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-26","tkey":"other","id":3,"titleZh":"","abstractZh":""},{"title":"Mutualistic microbes linked to broader niches but reduced diversification","url":"https://doi.org/10.1038/s41467-026-79030-6","doi":"10.1038/s41467-026-79030-6","journal":"Nature Communications","jabbr":"Nat Commun","pubdate":"2026-10-24","topic":"极端天气","topics":["极端天气"],"matchTerm":"drought","matchWhere":"摘要：drought","score":3,"authors":["Eleanor Hay","Rosana Zenil‐Ferguson","Michelle E. Afkhami","Christopher A. Searcy"],"authorMore":false,"abstract":"Mutualistic interactions are widely hypothesized to broaden ecological niches and promote diversification, yet evidence for this relationship at macroevolutionary scales remains limited. Here, we investigate how fungal seed endophytes (Epichloë) influence niche breadth and diversification across over 100 species of the globally-distributed grass genus Poa. Combining global-scale climate, environmental, phylogenetic, and symbiosis data, we construct species distribution models for suites of symbiotic and non-symbiotic plant species, and use phylogenetic comparative methods to assess the influence of these symbionts on niche breadth, niche breadth evolution, and diversification. …","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-26","tkey":"other","id":4,"titleZh":"","abstractZh":""},{"title":"Impacts of Nuclear War on Human Health From Changed Surface Ultraviolet Radiation","url":"https://agupubs.onlinelibrary.wiley.com/doi/10.1029/2026EF009142?af=R","doi":"10.1029/2026ef009142","journal":"Earth's Future","jabbr":"Earth's Future","pubdate":"2026-10-24","topic":"空气污染","topics":["空气污染"],"matchTerm":"aerosol","matchWhere":"摘要：aerosol","score":3,"authors":["Shu Xu","Lili Xia","Alan Robock","Charles Bardeen","Simchan Yook","Sasha Madronich","Soko Setoguchi"],"authorMore":false,"abstract":"Abstract Climate model simulations indicate that surface ultraviolet (UV) radiation would change after soot injection into the stratosphere during a nuclear war, due to the competing effects of ozone depletion and aerosol attenuation. Using climate model simulations, we evaluate UV impacts under two scenarios: a regional India-Pakistan conflict producing 5 Tg of soot and a global U.S.-Russia war producing 150 Tg. UV enhancements due to ozone depletion substantially shorten safe outdoor exposure time, particularly for individuals with lighter skin types. Applying UV dose-response relationships to the year 2000 population data, without accounting for direct conflict mortality or …","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-26","tkey":"other","id":5,"titleZh":"","abstractZh":""},{"title":"Intensified human pressures threaten global mountain vertebrate biodiversity","url":"https://doi.org/10.1038/s41467-026-78392-1","doi":"10.1038/s41467-026-78392-1","journal":"Nature Communications","jabbr":"Nat Commun","pubdate":"2026-10-23","topic":"城市地理信息系统","topics":["城市地理信息系统"],"matchTerm":"land-use","matchWhere":"摘要：land-use","score":3,"authors":["Jianfeng Sun","Guangdong Li","Yue Cao","Ying Zhang","James E. M. Watson","Jianguo Liu"],"authorMore":false,"abstract":"Mountain ecosystems host rich biodiversity and often act as last refuges for species under growing human pressure. However, the extent and recent trajectory of anthropogenic impacts on global mountain biodiversity remain poorly understood. Here, we evaluate spatio-temporal changes in human pressure across 6717 mountain ranges worldwide from 2000 to 2020 and assess future exposure to anthropogenic pressures under three Shared Socioeconomic Pathways (SSPs). We show that more than 60% of mountain ranges are exposed to elevated human pressure and that intensification of human pressure between 2000 and 2020 is associated with the loss of 71.69 Mha of natural mountain habitat. Protected areas …","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-26","tkey":"other","id":6,"titleZh":"","abstractZh":""},{"title":"Building digital pregnancies from the single cell up","url":"https://www.science.org/doi/abs/10.1126/sciadv.aen0211?af=R","doi":"10.1126/sciadv.aen0211","journal":"Science Advances","jabbr":"Sci Adv","pubdate":"2026-10-21","topic":"城市地理信息系统","topics":["城市地理信息系统"],"matchTerm":"digital twins","matchWhere":"摘要：digital twins","score":3,"authors":["Adrienne K. Scott"],"authorMore":false,"abstract":"Single-cell digital twins connect in vitro drug screening studies with clinical outcomes, providing a new framework to evaluate therapies and advance precision medicine in pregnancy.","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-23","tkey":"other","id":7,"titleZh":"","abstractZh":""},{"title":"Single-cell–level digital twins for preterm birth prevention strategies","url":"https://www.science.org/doi/abs/10.1126/sciadv.aed2741?af=R","doi":"10.1126/sciadv.aed2741","journal":"Science Advances","jabbr":"Sci Adv","pubdate":"2026-10-21","topic":"城市地理信息系统","topics":["城市地理信息系统"],"matchTerm":"digital twin","matchWhere":"摘要：digital twin","score":3,"authors":["Jakob Einhaus","Peter Neidlinger","Olivier Fondeur","Masaki Sato","Sasha Anronikov","Kotaro Miyazaki"],"authorMore":true,"abstract":"Digital twin models can accelerate therapeutic development by enabling low-risk testing of candidate interventions. In preterm labor (PTL), a major pregnancy complication where clinical trials face ethical and financial barriers, digital twins are especially valuable for evaluating new therapies targeting immune dysfunctions driving PTL. Yet, current models lack single-cell resolution, limiting detection of cell type–specific mechanisms, off-target effects, and the design of personalized interventions. We present Simulated Immunome Modeling of Clinical Outcomes (SIMCO), a single-cell–level digital twin framework that models immunomodulatory treatment effects on the timing of labor using …","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-22","tkey":"other","id":8,"titleZh":"","abstractZh":""},{"title":"Global Cropland Efficiency-Stress Divide: Typological Diagnosis and Reconciling Pathways","url":"https://doi.org/10.1021/acs.est.6c07911","doi":"10.1021/acs.est.6c07911","journal":"Environmental Science \u0026 Technology","jabbr":"ES\u0026T","pubdate":"2026-10-21","topic":"城市地理信息系统","topics":["城市地理信息系统"],"matchTerm":"land use","matchWhere":"摘要：land use","score":3,"authors":["Tingyu Hu","Junnian Song","Wei Yang","Xian’en Wang"],"authorMore":false,"abstract":"Abstract Cropland underpins food security but faces mounting resource constraints and environmental pressures. Achieving sustainable agriculture hinges on advancing land use efficiency (LUE) and alleviating land ecological stress (LES). However, a typological framework characterizing LUE and LES remains lacking, hindering the distinction between technical efficiency and ecological sustainability in cropland use. Herein, we establish a coupled LUE-LES diagnostic framework by integrating the super-efficiency slack-based measure model with land ecological footprint accounting. This framework classifies regions into efficiency-stress typologies globally for 2011, 2015, 2019, and 2022, and …","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-22","tkey":"other","id":9,"titleZh":"","abstractZh":""},{"title":"High-risk antimicrobial resistance genomic traits in multidrug-resistant Salmonella across China’s food chain: projections to 2050","url":"https://doi.org/10.1038/s41467-026-78346-7","doi":"10.1038/s41467-026-78346-7","journal":"Nature Communications","jabbr":"Nat Commun","pubdate":"2026-10-20","topic":"城市地理信息系统","topics":["城市地理信息系统"],"matchTerm":"urbanisation","matchWhere":"摘要：urbanisation","score":3,"authors":["Michelle Baker","Xin Lu","Chengchang Luo","Ge Wu","Alexandre Maciel-Guerra","Komkiew Pinpimai"],"authorMore":true,"abstract":"Abstract Antimicrobial resistance (AMR) is rising globally, yet factors shaping its genomic evolution remain poorly understood. We investigated how socioeconomic, climate, and health factors are associated with AMR spread in multi-drug resistant (MDR) Salmonella enterica across China’s food chain, mapped hotspots and forecasted genomic trait prevalence to 2050. We analysed 2,536 MDR genomes from 15 provinces over 16 years, covering patients, food and non-food workers, meat, livestock, and environmental sources. A machine learning framework integrated genomic surveillance with risk assessment to identify high-risk AMR traits (clinically relevant, MDR, mobile). Regression models linked trait …","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-21","tkey":"other","id":10,"titleZh":"","abstractZh":""},{"title":"Resource-Oriented Wastewater Treatment through Quorum Quenching─Integration of AnMBR and Donnan Dialysis","url":"https://doi.org/10.1021/acs.est.6c05848","doi":"10.1021/acs.est.6c05848","journal":"Environmental Science \u0026 Technology","jabbr":"ES\u0026T","pubdate":"2026-10-20","topic":"生物地球化学","topics":["生物地球化学"],"matchTerm":"methane","matchWhere":"摘要：methane","score":3,"authors":["Hongyu Zhang","Yuxuan Wan","Liqiu Zhang","Huarong Yu","Haiyang Yang","Fangshu Qu"],"authorMore":false,"abstract":"Abstract Aligned with United Nations Sustainable Development Goal 6, water treatment is shifting from pollution removal to resource recovery and circularity. An integration of AnMBR and a Donnan dialysis (DD) (AnMBR-DD) was proposed to simultaneously recover methane and ammonium, and quorum quenching (QQ) was further incorporated to mitigate membrane fouling and enhance process efficiency. The COD removal efficiency was stably maintained above 80%, and the methane conversion efficiency reached 51.6%. The effluent NH4+-N concentration was controlled at 3–5 mg/L, with a recovery efficiency of 47.1% in the AnMBR-DD. The QQ effectively alleviated biofouling on the ultrafiltration membrane in …","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-21","tkey":"other","id":11,"titleZh":"","abstractZh":""},{"title":"Fe3 + Activation of Metal Sulfides for High-Performance Mercury Removal from Nonferrous Smelting Gas: A Dual Mercury Adsorption Mechanism","url":"https://doi.org/10.1021/acs.est.6c09451","doi":"10.1021/acs.est.6c09451","journal":"Environmental Science \u0026 Technology","jabbr":"ES\u0026T","pubdate":"2026-10-19","topic":"空气污染","topics":["空气污染"],"matchTerm":"so2","matchWhere":"摘要：so2","score":3,"authors":["Zixi Zhang","Chaolong Liu","Zhixing Huang","Kaisong Xiang","Fenghua Shen","Hui Liu"],"authorMore":false,"abstract":"Abstract Atmospheric elemental mercury (Hg0) emitted from the nonferrous metallurgy industry poses severe risks to ecosystems. Although metal sulfides are promising in Hg0 adsorption under high-concentration SO2 conditions, they typically suffer from poor performance at elevated temperatures due to weak binding affinity. Herein, a trivalent iron (Fe3+) activation strategy to boost Hg0 adsorption activity of metal sulfides was developed for the first time, which leverages electron-deficient Fe3+ to induce electronic reconstruction. This Fe3+ activation strategy is applicable to various metal sulfides, generating Fe sites with high activity and stability. Among the various candidates, the …","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-20","tkey":"other","id":12,"titleZh":"","abstractZh":""},{"title":"Submarine Groundwater Discharge Acts as a Significant Vector for Coastal Organophosphate Esters: Joint Evidence from Pollution Surveys and Radionuclide Analysis","url":"https://doi.org/10.1021/acs.est.6c11341","doi":"10.1021/acs.est.6c11341","journal":"Environmental Science \u0026 Technology","jabbr":"ES\u0026T","pubdate":"2026-10-19","topic":"生物地球化学","topics":["生物地球化学"],"matchTerm":"biogeochemical","matchWhere":"摘要：biogeochemical","score":3,"authors":["Li Zhang","Xiang Li","Xinhui He","Xuemin Feng","Bochao Xu","Shuo Yu"],"authorMore":true,"abstract":"Abstract Organophosphate esters (OPEs) are ubiquitous marine contaminants that raise global concern. While surface inputs are well-studied, the role of subsurface transport remains poorly constrained. Submarine groundwater discharge (SGD) drives seawater-groundwater interactions, yet its impact on OPEs behavior remains overlooked. This study comprehensively investigates the distribution, transport property and sources of OPEs from coastal groundwater to seawater in the Beibu Gulf, China. No statistically significant difference in Σ19OPEs levels was found between groundwater and tidal flat porewater, while both matrices exhibited significantly higher levels than seawater. The high …","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-20","tkey":"other","id":13,"titleZh":"","abstractZh":""},{"title":"Policy‐Driven Evolution of Sediment in the Yellow River Basin over the Past 2000 Years","url":"https://agupubs.onlinelibrary.wiley.com/doi/10.1029/2026EF009243?af=R","doi":"10.1029/2026ef009243","journal":"Earth's Future","jabbr":"Earth's Future","pubdate":"2026-10-19","topic":"城市地理信息系统","topics":["城市地理信息系统"],"matchTerm":"land use","matchWhere":"摘要：land use","score":3,"authors":["Anle Yang","Xiaohui Jiang","Yuxin Lei","Tong Nie","Xujing Li","Shengdong Yang","Fusen Nan","Liangbin Lan"],"authorMore":false,"abstract":"Abstract River sediment load serves as a typical indicator of the interaction between human activities and the natural environment, and historical policies have profoundly altered basin sediment transport processes. In this study, we constructed a quantitative analytical framework based on the policy index to systematically trace the evolutionary trajectories of ecological conservation, land use, and taxation policies in the Yellow River Basin over the past two millennia. We reveal how policy-driven human activities have reshaped land use patterns, and how these changes are linked to the long-term response mechanism of sediment load from the Yellow River. We find that prior to the 1970s, …","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-21","tkey":"other","id":14,"titleZh":"","abstractZh":""},{"title":"Evaluating mangrove establishment trajectories and carbon recovery potential using a spatial age-based framework","url":"https://doi.org/10.1088/1748-9326/aeb621","doi":"10.1088/1748-9326/aeb621","journal":"Environmental Research Letters","jabbr":"ERL","pubdate":"2026-10-19","topic":"遥感","topics":["遥感"],"matchTerm":"landsat","matchWhere":"摘要：landsat","score":3,"authors":["Yuxuan Zhao","Tong Li","Bohan Zheng","Xinyu Wang","Yifan Wang","Qiyue Zhang"],"authorMore":true,"abstract":"Abstract Mangrove restoration is a vital nature-based solution for climate change mitigation and biodiversity conservation. However, large-scale mangrove restoration success is predominantly evaluated using area-based metrics, which fail to capture the complex temporal trajectories of forest structural and functional recovery. Stand age directly determines structural heterogeneity and carbon stocks, making it a key indicator for monitoring recovery trajectories and estimating carbon stocks. We developed a spatial age-based framework to map established mangrove stands and quantify the existing carbon stock and remaining potential. To this end, we combined an optimized LandTrendr …","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-20","tkey":"other","id":15,"titleZh":"","abstractZh":""},{"title":"Modeled Groundwater Decline is Associated with Lower Arsenic Concentrations in Hanoi","url":"https://doi.org/10.1021/acs.est.6c07700","doi":"10.1021/acs.est.6c07700","journal":"Environmental Science \u0026 Technology","jabbr":"ES\u0026T","pubdate":"2026-10-18","topic":"生物地球化学","topics":["生物地球化学"],"matchTerm":"biogeochemical","matchWhere":"摘要：biogeochemical","score":3,"authors":["David Haaf","Michael McGlade","Athena A. Nghiem","Duyen Thi Vu","Tobias Steinert","Viet Hung Pham"],"authorMore":true,"abstract":"Abstract Elevated arsenic concentrations in groundwater pose health risks. Geogenic arsenic contamination is driven by biogeochemical mobilization and groundwater dynamics. Intensive pumping can initially exacerbate contamination by drawing arsenic or mobilizing organic matter into aquifers, but over longer time scales may also promote dilution and flushing in some settings. To better understand the mechanisms controlling arsenic concentrations, we examined changes over two decades in Hanoi (Vietnam), a hotspot of geogenic arsenic contamination and groundwater pumping. Arsenic concentrations from 470 wells sampled in the year 2000 were compared with 434 wells sampled in the same area in … ✅ 数据源：24 本刊、68 条通道全部正常。","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-19","tkey":"other","id":16,"titleZh":"","abstractZh":""},{"title":"ITLN1 suppresses colorectal cancer progression by orchestrating neutrophil maturation and spatial organization","url":"https://doi.org/10.1038/s41467-026-78599-2","doi":"10.1038/s41467-026-78599-2","journal":"Nature Communications","jabbr":"Nat Commun","pubdate":"2026-10-16","topic":"城市地理信息系统","topics":["城市地理信息系统"],"matchTerm":"spatial analysis","matchWhere":"摘要：spatial analysis","score":3,"authors":["Li Chen","Xiangwei Zhai","Shaoxiang Chen","Jie Luo","Jing Sun","Guibing Qiao"],"authorMore":true,"abstract":"Abstract Epithelial-derived intelectin-1 (ITLN1) is frequently downregulated in colorectal cancer, but whether it actively shapes anti-tumor immunity remains unclear. We integrate multiplex immunohistochemistry, spatial analysis, single-cell transcriptomics, chromatin-accessibility profiling, and perturbation models to define how ITLN1 regulates neutrophil maturation and spatial anti-tumor immunity. In treatment-naïve human colorectal cancer, higher ITLN1 expression associates with greater neutrophil infiltration, shorter distances between mature S100A9 + CXCR2 + neutrophils and ITLN1 + tumor epithelial cells, and improved survival. In mouse colorectal cancer models, Itln1 silencing …","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-17","tkey":"other","id":17,"titleZh":"","abstractZh":""},{"title":"Explainable artificial intelligence reveals spatially divergent effects of global change on mammals","url":"https://doi.org/10.1038/s41467-026-78677-5","doi":"10.1038/s41467-026-78677-5","journal":"Nature Communications","jabbr":"Nat Commun","pubdate":"2026-10-16","topic":"城市地理信息系统","topics":["城市地理信息系统"],"matchTerm":"land cover","matchWhere":"摘要：land cover","score":3,"authors":["Lei Song","Amy E. Frazier","Peter Kedron","Diogo S. A. Araujo","Diyang Cui","Brian J. Enquist"],"authorMore":true,"abstract":"Abstract Understanding how global change reshapes species distributions remains a central challenge in ecology, yet most global assessments treat environmental drivers as static, uniform, or aggregate influences. This obscures where, why, and how specific drivers generate ecological risk or opportunity. Here, we apply explainable machine learning to assess how climate averages, variability, extremes, and land cover are projected to reshape future distributions of 1,992 terrestrial mammals. Using Shapley Additive Explanations with species distribution models, we quantify the directional contribution of 16 environmental drivers and track how these contributions change over space and time. We …","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-17","tkey":"other","id":18,"titleZh":"","abstractZh":""},{"title":"Medium-Entropy LDH-Driven Electronic Coupling of MnO x for Preferential Oxidation of Formaldehyde","url":"https://doi.org/10.1021/acs.est.6c10822","doi":"10.1021/acs.est.6c10822","journal":"Environmental Science \u0026 Technology","jabbr":"ES\u0026T","pubdate":"2026-10-16","topic":"空气污染","topics":["空气污染"],"matchTerm":"air pollutant","matchWhere":"摘要：air pollutant","score":3,"authors":["Xuanning Wu","Haiyan Li","Tao Dong","Tao Ban","Michael K.H. Leung","Haibao Huang"],"authorMore":false,"abstract":"Abstract Preferential oxidation of formaldehyde (HCHO) in natural gas engine exhaust is pivotal to prevent NH3–SCR catalyst deactivation and inhibit highly toxic hydrogen cyanide (HCN) formation. Although manganese-based catalysts exhibit prominent activity for HCHO oxidation, complete mineralization is still hindered by poor electron-transfer efficiency and insufficient reactive oxygen species (ROS) generation. Herein, we fabricate hierarchical medium-entropy LDH nanoflower-anchored MnOx catalysts (MnO2@NiMgAl-MELH) via a facile in situ growth strategy, enabling 100% mineralization of HCHO at room temperature. Structural characterizations and DFT calculations verify that Ni–Mn electronic …","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-17","tkey":"other","id":19,"titleZh":"","abstractZh":""},{"title":"Perspectives and Mitigation Methods for Underappreciated Amine Escape from CO2 Desorption","url":"https://doi.org/10.1021/acs.est.6c08471","doi":"10.1021/acs.est.6c08471","journal":"Environmental Science \u0026 Technology","jabbr":"ES\u0026T","pubdate":"2026-10-16","topic":"空气污染","topics":["空气污染"],"matchTerm":"aerosol","matchWhere":"摘要：aerosol","score":3,"authors":["Lingyu Shao","Yanlei Meng","Zhengda Yang","Yao Shen","Jingkai Zhao","Jiexu Ye"],"authorMore":true,"abstract":"Abstract Amine-based CO2 capture is increasingly limited by amine escape and aerosol emissions that drive solvent loss and secondary pollution. Research has focused on the absorber, leaving the desorption section─where intensive CO2 release, water-vapor entrainment, and rapid cooling coincide─overlooked as an escape source. Here, we combine molecular dynamics simulations with bench-scale experiments to resolve the mechanism and control of amine escape during CO2 desorption. Counter to absorber-side expectations, a CO2-rich atmosphere suppresses rather than promotes aerosol nucleation: elevated CO2 competitively disrupts the H2O–H2O hydrogen-bond network stabilizing water-centered nuclei, …","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-17","tkey":"other","id":20,"titleZh":"","abstractZh":""},{"title":"Dynamic Nature of Soil Iron Minerals: Recent Advances Using Iron Isotope Tracers and Mössbauer Spectroscopy","url":"https://doi.org/10.1021/acs.est.6c07339","doi":"10.1021/acs.est.6c07339","journal":"Environmental Science \u0026 Technology","jabbr":"ES\u0026T","pubdate":"2026-10-16","topic":"生物地球化学","topics":["生物地球化学"],"matchTerm":"biogeochemistry","matchWhere":"摘要：biogeochemistry","score":3,"authors":["Luiza Notini","Andrew R. C. Grigg","L. Joëlle Kubeneck","Michelle M. Scherer","Ruben Kretzschmar"],"authorMore":false,"abstract":"Abstract Iron plays a central role in defining the redox and surface chemical environment of soils and sediments, by mediating the behavior of nutrients, pollutants, and carbon compounds. However, the mechanisms that drive dynamic changes in Fe speciation and mineral composition can be difficult to trace. Over three decades, technical advances in spectroscopy and theoretical modeling techniques have revealed detailed mechanisms of Fe mineral recrystallization and transformation. Here, we provide a perspective on the application of iron isotopic tracers to the development of atomic-scale mechanistic understanding of Fe mineral dynamics. We review key milestones in the advancement of 57Fe …","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-17","tkey":"other","id":21,"titleZh":"","abstractZh":""},{"title":"Molecular Size Mediates Sunlight Effects on the Biodegradation of Aquatic Dissolved Organic Matter: Insights from the Reservoir Wetland and Incubation Experiment","url":"https://doi.org/10.1021/acs.est.6c07764","doi":"10.1021/acs.est.6c07764","journal":"Environmental Science \u0026 Technology","jabbr":"ES\u0026T","pubdate":"2026-10-16","topic":"大气化学","topics":["大气化学"],"matchTerm":"photochemical","matchWhere":"摘要：photochemical","score":3,"authors":["Peng Zhou","Long Tian","Shian Song","Muhammad Saboor Siddique","Kurt Friese","Peter Herzsprung"],"authorMore":true,"abstract":"Abstract Dissolved organic matter (DOM) in aquatic ecosystems is crucial to climate, water quality, and water sanitation. However, little is known about how photochemical and biological processes interact to regulate the cycling of DOM in water environments. Here, we investigate the photobiochemical processing of different molecular weight (MW) fractions of aquatic DOM by incubating them with microbes in the dark and light/dark cycling environments via microcosm experiments. Light exposure has distinct effects on the medium (MMW; 1–20 kDa) and low (LMW; \u0026lt;1 kDa) MW fractions and can enrich photoautotrophic bacteria and taxa that could benefit the utilization of aromatic compounds. The …","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-17","tkey":"other","id":22,"titleZh":"","abstractZh":""},{"title":"A century of streamwater quality degradation by input from urban water infrastructure as revealed by tree-ring records","url":"https://doi.org/10.1088/1748-9326/aeb560","doi":"10.1088/1748-9326/aeb560","journal":"Environmental Research Letters","jabbr":"ERL","pubdate":"2026-10-16","topic":"城市地理信息系统","topics":["城市地理信息系统"],"matchTerm":"urban growth","matchWhere":"摘要：urban growth","score":3,"authors":["Josiah Marie Sananda","Jay L Banner","Sneha Nachimuthu","Bryan A Black","Jose Abella-Gutiérrez","Kasey Faust"],"authorMore":true,"abstract":"Abstract The transfer of water from urban water networks to natural streams is a driver of streamwater quality degradation that likely occurs worldwide. We develop a new proxy using tree-ring strontium isotope ratios (87 Sr/ 86 Sr) to reconstruct multidecadal histories of municipal-water contributions to natural streams. We apply this approach to three watersheds spanning highly urbanized, rapidly urbanizing, and rural conditions in central Texas, USA. Municipal water has persistently dominated streamflow (\u003e90%) in the urban watershed since at least 1945, only 25 years after the initial expansion of Austin’s municipal water infrastructure network. In the rapidly urbanizing watershed, the …","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-17","tkey":"other","id":23,"titleZh":"","abstractZh":""},{"title":"Projecting potential population exposure to the invasive malaria vector Anopheles stephensi","url":"https://doi.org/10.1088/1748-9326/aeb558","doi":"10.1088/1748-9326/aeb558","journal":"Environmental Research Letters","jabbr":"ERL","pubdate":"2026-10-16","topic":"城市地理信息系统","topics":["城市地理信息系统"],"matchTerm":"urban land","matchWhere":"摘要：urban land","score":3,"authors":["Yelin Sun","Weihang Liu","Yuanyuan Jing","Tian Liu","Meng Shang","Yujuan Yue"],"authorMore":true,"abstract":"Abstract Malaria remains a major global public health threat, and the recent invasion and rapid spread of Anopheles stephensi across Africa pose new challenges for disease control. To assess future risks, we estimated the distribution of An. stephensi habitat suitability under four Shared Socioeconomic Pathways (SSPs, SSP126, SSP245, SSP370 and SSP585) across 2021-2100 using a boosted regression tree (BRT) model, and quantified population exposure through a contribution decomposition framework separating environmental, population and joint effects. The results showed that the proportion of urban land was the most important predictor (17.17%), followed by mean temperature of the wettest …","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-17","tkey":"other","id":24,"titleZh":"","abstractZh":""},{"title":"Ammonia Air‐Sea Exchange in Southwest UK","url":"https://agupubs.onlinelibrary.wiley.com/doi/10.1029/2025GL120401?af=R","doi":"10.1029/2025gl120401","journal":"Geophysical Research Letters","jabbr":"GRL","pubdate":"2026-10-16","topic":"生物地球化学","topics":["生物地球化学"],"matchTerm":"biogeochemistry","matchWhere":"摘要：biogeochemistry","score":3,"authors":["S. Louw","T. G. Bell","E. M. S. Woodward","M. Yang"],"authorMore":false,"abstract":"Abstract Ammonia (NH₃) measurements are challenging to make, and air-sea flux estimates are sparse, with coastal observations complicated by overlapping marine and terrestrial signals. Here we present high-resolution NH₃ air-sea flux estimates based on two years (2022–2023) of atmospheric and seawater measurements at the Penlee Point Atmospheric Observatory (PPAO), on the southwest UK coast. NH₃ concentrations peak in spring and summer and were strongly influenced by terrestrial air masses from the UK and Continental Europe. Net NH₃ deposition occurred across all seasons, with seasonal median deposition ranging from 20.5 to 34.5 μmol m −2 d −1 or 1.0 to 1.8 kg NH₃ -N ha −1 yr −1. The …","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-18","tkey":"other","id":25,"titleZh":"","abstractZh":""},{"title":"Interpretable Machine Learning Reveals Global Nonlinear Responses of Soil Respiration to Climate","url":"https://agupubs.onlinelibrary.wiley.com/doi/10.1029/2026GL124051?af=R","doi":"10.1029/2026gl124051","journal":"Geophysical Research Letters","jabbr":"GRL","pubdate":"2026-10-16","topic":"生物地球化学","topics":["生物地球化学"],"matchTerm":"carbon cycle","matchWhere":"摘要：carbon cycle","score":3,"authors":["Benjamin Laffitte","Zhihan Yang","Tao Zhou","Xiangjun Pei","Xiaolu Tang"],"authorMore":false,"abstract":"Abstract Soil respiration (R s) is a major component of the global carbon cycle, yet its responses to environmental drivers remain poorly constrained. Using 8,111 observations and a SHAP-interpreted Random Forest model, we identified global response patterns for key environmental drivers of R s. Temperature contributions showed a peaked association with a descriptive maximum of 27.7°C, precipitation contributions plateaued at high values, and leaf area index contributions increased approximately linearly. These results provide a global, data-driven characterization of peaked temperature and saturating precipitation associations, including how their shapes and supported ranges vary among …","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-18","tkey":"other","id":26,"titleZh":"","abstractZh":""},{"title":"Between public space and private living: social infrastructure as a demand-side strategy for compact living","url":"https://iopscience.iop.org/article/10.1088/1748-9326/aeaf69","doi":"10.1088/1748-9326/aeaf69","journal":"Environmental Research Letters","jabbr":"ERL","pubdate":"2026-10-15","topic":"城市地理信息系统","topics":["城市地理信息系统"],"matchTerm":"urban form","matchWhere":"摘要：urban form","score":3,"authors":["Tamar Meshulam and Shoshanna Saxe"],"authorMore":false,"abstract":"Abstract Cities must balance the housing needs of growing populations with planetary boundaries. Technological improvements alone cannot meet climate targets, and demand-side strategies that reduce private dwelling size are critical for achieving absolute reductions in material and energy demand. However, the socio-spatial conditions that enable compact living remain poorly understood. Prior theoretical work suggests that social infrastructure, including cafés, parks, libraries, and community centres, can reduce demand for private residential space, but empirical evidence linking social infrastructure to dwelling size has been virtually absent. We address this gap through a large-scale, …","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-17","tkey":"other","id":27,"titleZh":"","abstractZh":""},{"title":"Urban vegetation experienced less damage than rural vegetation during the 2022 compound hot–dry event in eastern China","url":"https://doi.org/10.1088/1748-9326/aeb435","doi":"10.1088/1748-9326/aeb435","journal":"Environmental Research Letters","jabbr":"ERL","pubdate":"2026-10-14","topic":"城市地理信息系统","topics":["城市地理信息系统"],"matchTerm":"land-use","matchWhere":"摘要：land-use","score":3,"authors":["Zhihan Zhao","Bo Qiu","Jiuyi Chen","Yueyang Ni","Chen Chen"],"authorMore":false,"abstract":"Abstract Compound hot–dry events (CHDEs) increasingly threaten vegetation growth, but whether urban environments amplify or buffer vegetation responses to such extremes remains unclear. This study examined urban–rural contrasts in vegetation responses by integrating standardized enhanced vegetation index (EVI) anomalies with resistance and recovery metrics during the 2022 CHDE over the Yangtze River Basin (YZB) in China. Our results show that the CHDE caused widespread declines in EVI across the YZB, but urban vegetation showed weaker declines than rural vegetation and croplands, together with a smaller damaged area and higher resistance among affected pixels. By contrast, post-event …","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-15","tkey":"other","id":28,"titleZh":"","abstractZh":""},{"title":"Reinforcement learning guided robotic platform that investigates and discovers asymmetric reactions","url":"https://www.nature.com/articles/s41467-026-78271-9","doi":"10.1038/s41467-026-78271-9","journal":"Nature Communications","jabbr":"Nat Commun","pubdate":"2026-10-13","topic":"城市地理信息系统","topics":["城市地理信息系统"],"matchTerm":"digital twin","matchWhere":"摘要：digital twin","score":3,"authors":["Patryk Klochowicz","Ahmad F. Kassir","Chandrakanta Parida","Jarosław M. Granda"],"authorMore":false,"abstract":"Abstract Autonomous robotic platforms accelerate chemical discovery by coupling automated experimentation with algorithmic decision-making, but most lack integrated support for chirality and the sequential decision-making required to explore asymmetric reaction spaces with unknown reactivity and stereochemical outcomes. Here, we report a bespoke robotic platform guided by deep reinforcement learning that autonomously navigates a defined asymmetric reaction space by scouting reaction conditions, discovering chiral products, screening catalysts and mapping substrate scope. The structure-agnostic workflow is enabled by a digital twin of asymmetric catalysis, in which control policies are …","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-14","tkey":"other","id":29,"titleZh":"","abstractZh":""},{"title":"Earlier green-up exacerbates northern vegetation sensitivity to flash drought","url":"https://doi.org/10.1038/s41467-026-78296-0","doi":"10.1038/s41467-026-78296-0","journal":"Nature Communications","jabbr":"Nat Commun","pubdate":"2026-10-08","topic":"遥感","topics":["遥感"],"matchTerm":"satellite","matchWhere":"摘要：satellite","score":3,"authors":["Wenrui Bai","Quansheng Ge","Constantin M. Zohner","Jun Wang","Shaozhi Lin","Yani Liang"],"authorMore":true,"abstract":"Flash drought–induced relative reduction in vegetation activity and canopy functioning, referred to as vegetation sensitivity, is a crucial measure of drought impacts. While climatic factors influencing vegetation sensitivity are well recognized, the role of phenological shifts remains poorly understood. Using multiple satellite-derived vegetation proxies (NDVI, LAI, SIF, and VOD) during 2001–2021, we show that earlier green-up dates (GUD) exacerbate vegetation sensitivity to flash droughts across 61.2–84.1% of the Northern Hemisphere (\u003e23.5°N). Earlier GUDs enhance pre-drought vegetation growth, especially during the early growing season. Such amplified vegetation growth exacerbates …","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-11","tkey":"other","id":30,"titleZh":"","abstractZh":""},{"title":"Reduced semi-arid summer carbon dioxide efflux from agrivoltaic compared to conventional horticultural soil","url":"https://doi.org/10.1088/1748-9326/aeb1dd","doi":"10.1088/1748-9326/aeb1dd","journal":"Environmental Research Letters","jabbr":"ERL","pubdate":"2026-10-08","topic":"生物地球化学","topics":["生物地球化学"],"matchTerm":"soil carbon","matchWhere":"摘要：soil carbon","score":3,"authors":["Holly Andrews","Fabiana Olea Carrasco","Alyssa Salazar","Zoe Gineris","Talitha H Neesham-McTiernan","G. Darrel Jenerette"],"authorMore":true,"abstract":"Abstract Agrivoltaic (AV) systems that combine horticultural crops with photovoltaic (PV) infrastructure on the same land parcel can provide mutual benefits for crop performance, electricity production, and water use in semi-arid climates. Whether semi-arid AV systems provide additional benefits for soil development and carbon (C) accumulation remains unclear. Larger aboveground biomass and yield production, which has been observed in semi-arid AV for certain crops, may accelerate C loss by supporting more continual and extensive microbial and root respiration, resulting in net zero or negative change in soil C over a growing season. Alternatively, AV systems may retain more soil C by …","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-09","tkey":"other","id":31,"titleZh":"","abstractZh":""},{"title":"Role of atmospheric circulation and anthropogenic forcing in the extreme 2025 European summer heatwave","url":"https://doi.org/10.1088/1748-9326/aeb1e0","doi":"10.1088/1748-9326/aeb1e0","journal":"Environmental Research Letters","jabbr":"ERL","pubdate":"2026-10-08","topic":"空气污染","topics":["空气污染"],"matchTerm":"aerosol","matchWhere":"摘要：aerosol","score":3,"authors":["Yan Chen","Wen Chen","Shangfeng Chen","Juan Feng","Tianjiao Ma"],"authorMore":false,"abstract":"Abstract In summer 2025, an extreme heatwave propagated northeastward across Europe, sequentially affecting Southwestern (SWEU) and Northern (NEU) Europe with record-breaking durations in the 1979-2025 record. However, the roles of atmospheric circulation and anthropogenic forcing in the 2025 European high-temperature conditions remain unclear. Here we show that atmospheric circulation explains 82.5% (95% uncertainty interval: 65.0-99.0%) and 51.9% (37.0-65.2%) of the regional mean maximum temperature (Tmax) anomalies averaged over the respective heatwave periods in SWEU and NEU, respectively, based on the flow analogue method. Extreme anticyclonic circulation is associated with extreme …","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-09","tkey":"other","id":32,"titleZh":"","abstractZh":""},{"title":"Maillard-like Reactions Generate Secondary Organic Products with Oxidative Potential: Mechanisms and Photoaging Enhancement","url":"https://doi.org/10.1021/acs.est.6c12787","doi":"10.1021/acs.est.6c12787","journal":"Environmental Science \u0026 Technology","jabbr":"ES\u0026T","pubdate":"2026-10-07","topic":"空气污染","topics":["空气污染"],"matchTerm":"aerosol","matchWhere":"摘要：aerosol","score":3,"authors":["Xin Zhu","Qingcai Chen","Tong Sha","Bo Wang","Huan Liu","Yue Yin"],"authorMore":true,"abstract":"Abstract The formation mechanisms and atmospheric evolution of secondary organic aerosols contributing to the oxidative potential (OP) remain poorly understood, limiting the assessment of their potential health impacts. Here, we demonstrate for the first time that atmospheric aqueous Maillard-like reactions constitute an important pathway for generating secondary organic products with OP. Six representative dicarbonyl-nitrogen reaction systems were designed to systematically investigate the formation kinetics, molecular characteristics, and photoaging evolution of the products generated from the Maillard-like reactions. All reactions systems generated measurable intrinsic OP, with the …","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-08","tkey":"other","id":33,"titleZh":"","abstractZh":""},{"title":"Synergistic Approaches in PFAS Remediation: Outlook for Sustainable In Situ Mitigation by Combined Adsorption and Photocatalysis","url":"https://doi.org/10.1021/acs.est.6c12980","doi":"10.1021/acs.est.6c12980","journal":"Environmental Science \u0026 Technology","jabbr":"ES\u0026T","pubdate":"2026-10-06","topic":"大气化学","topics":["大气化学"],"matchTerm":"photochemical","matchWhere":"摘要：photochemical","score":3,"authors":["Surabhi Sreenitha Raj","Jingqian Chen","Oscar Cabezuelo","Tetyana M. Budnyak"],"authorMore":false,"abstract":"Abstract Per- and polyfluoroalkyl substances (PFAS) are persistent organic pollutants with widespread environmental occurrence. Their toxicity and resistance to degradation pose serious risks to ecosystems and human health. While existing separation (e.g., adsorption, filtration) and degradation (e.g., photochemical, electrochemical, thermal) technologies can achieve partial PFAS removal, limitations such as high energy demand, poor cost-efficiency, and harsh operating conditions hinder their in situ application. In this context, a synergistic approach, a system in which adsorption and degradation are functionally coupled rather than applied as independent sequential unit operations, has …","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-07","tkey":"other","id":34,"titleZh":"","abstractZh":""},{"title":"Fine‐Tuning a Machine‐Learned 3D Cloud Climatology Reveals Aspects of Cloud Cover Trends","url":"https://doi.org/10.1029/2026gl123369","doi":"10.1029/2026gl123369","journal":"Geophysical Research Letters","jabbr":"GRL","pubdate":"2026-10-06","topic":"遥感","topics":["遥感"],"matchTerm":"geostationary","matchWhere":"摘要：geostationary","score":3,"authors":["Adrià Amell","Simon Pfreundschuh","Patrick Eriksson"],"authorMore":false,"abstract":"Abstract The Chalmers Cloud Ice Climatology (CCIC) is unique among long‐term cloud records: using retrievals from merged geostationary 11 μm observations, it provides continuous 3D estimates of both frozen hydrometeor mass and cloud probability. Here, we present a key update to CCIC: enhanced detection of thin clouds through tuning of its neural network cloud probability outputs. The update delivers robust information from local instantaneous retrievals to long‐term, large‐scale averages. We compare multidecadal, height‐resolved trends in cloud cover from CCIC and ERA5, revealing subtle but emerging long‐term changes in total cloud cover. By exploiting CCIC's capabilities, the contributions …","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-07","tkey":"other","id":35,"titleZh":"","abstractZh":""},{"title":"Distinct Dependencies of Tropical Cyclone Inner‐Core and Outer‐Region Precipitation on Translation Speed and Intensity","url":"https://doi.org/10.1029/2026gl125340","doi":"10.1029/2026gl125340","journal":"Geophysical Research Letters","jabbr":"GRL","pubdate":"2026-10-06","topic":"遥感","topics":["遥感"],"matchTerm":"satellite","matchWhere":"摘要：satellite","score":3,"authors":["Jingzhe Xu","Shuguang Wang"],"authorMore":false,"abstract":"Abstract This study analyzes how tropical cyclone (TC) precipitation in the inner core (IC) and outer region (OR) varies with translation speed and storm intensity using satellite‐derived precipitation data. Inner core precipitation initially increases with translation speed but decreases at higher speeds, while OR precipitation increases nearly linearly with translation speed. Inner core precipitation is strongly linked to TC intensity, both with and without conditioning on translation speed, whereas OR precipitation increases with intensity primarily for stronger storms. As translation speed increases, the location of maximum precipitation shifts toward the forward‐left quadrant in the …","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-07","tkey":"other","id":36,"titleZh":"","abstractZh":""},{"title":"Niche Divergence-Based Identification of Microbial Indicators Tracking Cyanobacterial Bloom Succession: A Metagenomic and Machine Learning Framework","url":"https://doi.org/10.1021/acs.est.6c04563","doi":"10.1021/acs.est.6c04563","journal":"Environmental Science \u0026 Technology","jabbr":"ES\u0026T","pubdate":"2026-10-03","topic":"生物地球化学","topics":["生物地球化学"],"matchTerm":"biogeochemical","matchWhere":"摘要：biogeochemical","score":3,"authors":["Kaiwen Yang","Zhen Xie","Wei Li","Yi Ren","Xiao Yi Chen","Xinze Wang"],"authorMore":true,"abstract":"Abstract Cyanobacterial harmful algal blooms (CyanoHABs) pose significant environmental and public health risks through toxin production, antibiotic resistance gene dissemination, and the disruption of biogeochemical cycles. Although extensive metagenomic investigations have explored microbial interactions between Cyanobacteria and coexisting members, the potential of incorporating functional indicators into early CyanoHAB monitoring systems remains underexplored. In this study, we employed metagenomic binning combined with machine learning approaches to analyze seasonal cyanobacterial succession and coexisting microbial communities across 19 sites in Erhai Lake across four seasons. We …","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-04","tkey":"other","id":37,"titleZh":"","abstractZh":""},{"title":"Dust Loading Increases During Topsoil Flash Droughts Under Rapid Surface Drying and Vegetation Stress","url":"https://doi.org/10.1029/2026gl124553","doi":"10.1029/2026gl124553","journal":"Geophysical Research Letters","jabbr":"GRL","pubdate":"2026-10-03","topic":"遥感","topics":["遥感"],"matchTerm":"satellite","matchWhere":"摘要：satellite","score":3,"authors":["Xuesong Wang","Chunlai Zhang","Xi Chen"],"authorMore":false,"abstract":"Abstract Using satellite‐derived dust optical depth (DOD), reanalysis meteorology, and a global topsoil flash drought (TSFD) inventory for 2003–2022, we find that TSFD events are associated with increased dust loading at the global scale. During TSFD events, 44.7% of land pixels exhibited positive DOD anomalies. The net global DOD anomaly increased significantly over the study period; however, this trend cannot be attributed solely to TSFD‐related effects, as changes in background environmental conditions may also have contributed. Compound TSFD–strong dust (TSFD_SD) events occurred most frequently under sparse vegetation and moderately elevated wind conditions. SHapley Additive exPlanation …","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-04","tkey":"other","id":38,"titleZh":"","abstractZh":""},{"title":"Optimizing Hybrid Wind–Solar Systems in Barren Land Under Constraints Imposed by Atmospheric Aerosols","url":"https://agupubs.onlinelibrary.wiley.com/doi/10.1029/2025EF007325?af=R","doi":"10.1029/2025ef007325","journal":"Earth's Future","jabbr":"Earth's Future","pubdate":"2026-10-01","topic":"空气污染","topics":["空气污染"],"matchTerm":"aerosol","matchWhere":"摘要：aerosol","score":3,"authors":["Xuesong Wang","Chunlai Zhang","Zhishan Xia","Jirui Gong"],"authorMore":false,"abstract":"Abstract By using a solar photovoltaic (PV) performance model and applying it to global data from 2000 to 2022, we demonstrated that although the net impact of aerosols on power generation was negative, this loss was almost entirely driven by soiling of panel surfaces and could be mitigated by developing an appropriate cleaning regime. In contrast, aerosol scattering of light under certain atmospheric conditions can locally increase power generation and stabilize output. These insights highlight the necessity of systematic, regionally tailored panel-cleaning protocols—particularly for tracking systems, which are most susceptible to aerosol deposition. Moreover, across regions with …","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-04","tkey":"other","id":39,"titleZh":"","abstractZh":""},{"title":"Nonlinear Release of Subinertial Diurnal Internal Tides Forms Spiral Internal Solitary Waves","url":"https://agupubs.onlinelibrary.wiley.com/doi/10.1029/2026GL124590?af=R","doi":"10.1029/2026gl124590","journal":"Geophysical Research Letters","jabbr":"GRL","pubdate":"2026-10-01","topic":"遥感","topics":["遥感"],"matchTerm":"satellite","matchWhere":"摘要：satellite","score":3,"authors":["Zenghao Jiang","Qun Li","Tao Xu","Wenyu Qu","Chengyuan Pang","Xu Chen"],"authorMore":false,"abstract":"Abstract Earth's rotation imposes a dynamical barrier on the free propagation of internal tides at high latitudes, raising questions about the fate of tidal energy poleward of the critical latitude. Satellite observations reveal spiral internal solitary waves (ISWs) along the continental slope of the South Orkney Plateau. Although these waves might be attributed to direct steepening of low-frequency internal tides, theoretical estimates of their propagation speed are nearly twice those inferred from observations. Using high-resolution simulations, we resolve this inconsistency by identifying a topographically steered energy cascade: subinertial diurnal internal tides, initially trapped by …","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-04","tkey":"other","id":40,"titleZh":"","abstractZh":""},{"title":"Relative Humidity Modulates Nitration and Ring Fragmentation during Heterogeneous Oxidation of Catechol by Nitrate Radicals","url":"https://doi.org/10.1021/acs.est.6c10536","doi":"10.1021/acs.est.6c10536","journal":"Environmental Science \u0026 Technology","jabbr":"ES\u0026T","pubdate":"2026-10-24","topic":"空气污染","topics":["空气污染","大气化学"],"matchTerm":"aerosol","matchWhere":"摘要：aerosol、摘要：secondary organic aerosols","score":6,"authors":["Md. Sohel Rana","Marcelo I. Guzman"],"authorMore":false,"abstract":"Abstract Catechol is an important biomass-burning-derived phenolic compound and a precursor to secondary organic aerosols (SOAs). Although nitrate radicals (NO3) are recognized as major nighttime oxidants, the influence of the aerosol water content on heterogeneous NO3 oxidation of phenolic compounds remains poorly understood. Here, we investigate the impact of relative humidity (RH = 0–90%) on the heterogeneous oxidation of catechol thin films by nitrate radicals generated from the reaction of O3 and NO2. Product formation was characterized using Fourier transform infrared (FTIR) spectroscopy, UV–visible spectroscopy, electrospray ionization mass spectrometry (ESI-MS), ultrahigh-pressure …","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-25","tkey":"other","id":41,"titleZh":"","abstractZh":""},{"title":"Cloud Controlling Factor Analysis Reveals E3SMv3 Structural Bias and Mean State Controls on Stratocumulus Radiative Sensitivity","url":"https://agupubs.onlinelibrary.wiley.com/doi/10.1029/2026GL125263?af=R","doi":"10.1029/2026gl125263","journal":"Geophysical Research Letters","jabbr":"GRL","pubdate":"2026-10-18","topic":"空气污染","topics":["空气污染","遥感"],"matchTerm":"aerosol","matchWhere":"摘要：aerosol、摘要：aerosol optical depth","score":6,"authors":["T. A. Myers","T. Aerenson","D. T. McCoy","M. D. Zelinka","J. M. Nugent","H. Brown"],"authorMore":false,"abstract":"Abstract We investigate marine stratocumulus cloud radiative sensitivity to meteorological and aerosol controlling factors in a perturbed parameter ensemble of the Energy Exascale Earth System Model version 3 (E3SMv3). The ensemble perturbs 25 cloud, convection, and aerosol parameters, spanning diverse cloud behavior. The default simulation and many ensemble members capture observed responses to most controlling factors, but not to surface temperature advection, revealing a structural deficiency in processes linking stratocumulus to advection. Many members also overestimate cloud fraction and radiative responses to inversion strength, free-tropospheric humidity, and sulfate aerosol optical …","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-20","tkey":"other","id":42,"titleZh":"","abstractZh":""},{"title":"Aging of Urban Traffic Fine Particles Modulates Toxicity Mechanisms and Oxidative Stress Responses","url":"https://doi.org/10.1021/acs.est.6c06323","doi":"10.1021/acs.est.6c06323","journal":"Environmental Science \u0026 Technology","jabbr":"ES\u0026T","pubdate":"2026-10-08","topic":"空气污染","topics":["空气污染","大气化学"],"matchTerm":"air pollution","matchWhere":"摘要：air pollution、摘要：photochemical","score":6,"authors":["Michal Pardo","Noga Kozer","Carolina Molina","Yanfang Chen","Haim Barr","Galit Cohen"],"authorMore":true,"abstract":"Abstract Vehicular emissions are an important source of urban air pollution that can age through atmospheric processes, but how their health effects change during atmospheric aging remains poorly understood. To simulate realistic urban emissions, we sampled air in a parking garage where cold-start and urban emissions coexist. Following aging in an oxidation flow reactor (OFR), we studied the cellular and acellular effects of the fresh and aged aerosols. Photochemical aging in the OFR increased secondary organic aerosol (SOA) mass by up to 6.9-fold, the oxygen-to-carbon (O:C) ratio from 0.26 to 0.79, and both the intrinsic oxidative potential (OPm) and the volume-normalized oxidative …","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-09","tkey":"other","id":43,"titleZh":"","abstractZh":""},{"title":"Surface temperatures drive strong seasonality in urban reactive carbon emissions","url":"https://www.science.org/doi/abs/10.1126/sciadv.aef9622?af=R","doi":"10.1126/sciadv.aef9622","journal":"Science Advances","jabbr":"Sci Adv","pubdate":"2026-10-07","topic":"空气污染","topics":["空气污染","大气化学"],"matchTerm":"air quality","matchWhere":"摘要：air quality、摘要：voc","score":6,"authors":["Michael P. Vermeuel","Dylan B. Millet","Róisín Commane","T "id":96,"titleZh":"","abstractZh":""},{"title":"Mapping agricultural dynamics in displacement-affected landscapes using satellite foundation model embeddings","url":"https://doi.org/10.1088/1748-9326/aeabbc","doi":"10.1088/1748-9326/aeabbc","journal":"Environmental Research Letters","jabbr":"ERL","pubdate":"2026-10-01","topic":"遥感","topics":["遥感"],"matchTerm":"satellite","matchWhere":"标题：satellite","score":9,"authors":["Abena Boatemaa Asare-Ansah","Jamon Van Den Hoek","Adebowale Daniel Adebayo","Xiao-Peng Song","Catherine Nakalembe"],"authorMore":false,"abstract":"Abstract Sub-Saharan Africa already faces low human development, extreme climate risks, and environmental degradation–pressures compounded by large-scale population displacement resulting from armed conflict. Nowhere are these intersecting challenges more evident than in Uganda, which currently hosts the largest refugee population in Africa (nearly 2 million), straining land management, natural resources, and local food systems. As is common across displacement settings, spatially explicit baseline agricultural data in Uganda’s refugee-hosting regions remain scarce, limiting land-use planning, food security assessments, and humanitarian interventions. We present the first high-resolution …","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-04","tkey":"other","id":97,"titleZh":"","abstractZh":""},{"title":"Techno-economic and environmental assessment of next-generation battery-powered farming robots","url":"https://doi.org/10.1038/s41467-026-78281-7","doi":"10.1038/s41467-026-78281-7","journal":"Nature Communications","jabbr":"Nat Commun","pubdate":"2026-11-02","topic":"城市与环境空间建模","topics":["城市与环境空间建模","生命周期与技术经济评价"],"matchTerm":"environmental assessment","matchWhere":"标题：environmental assessment、摘要：life cycle assessment","score":12,"authors":["Simon Schlehuber","Moritz Gutsch","Luca Stegemann","Thomas P. Hendrickson","Stephan von Delft"],"authorMore":false,"abstract":"Decarbonizing agricultur
